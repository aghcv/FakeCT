# Transfer the existing synthetic edits onto the broader automatic mask for review.
# python3 scripts/preview_mask_pairs.py --config configs/anatomy/260602-mask-pairs.ini

[mask_pairs]
case_id = 260602                            # NOTE 1: must match the source mask
anatomy_npz = outputs/anatomy/thoracic-auto/260602-r1/mask.npz # NOTE 1
dataset_manifest = outputs/datasets/coa/two-stage-radius115-r1/dataset-manifest.json # NOTE 2
output_directory = outputs/datasets/coa/thoracic-mask-preview/260602-r2 # NOTE 3

# NOTE 1 — First run select_phantom_anatomy.py with thoracic-aorta-260602.ini.
# This mask has automatic atlas/landmark extent; it is not the original edit ROI.
# Case, frame and native spacing must match the paired source. Inspect the
# automatic distal boundary and proximal branch extent before accepting it.
#
# NOTE 2 — Reuse the existing frozen pairs. No geometry edit is rerun. Each
# removal and each dilation ancestor must belong to the new automatic mask;
# incompatible edits are flagged for review. Broad anatomy outside the edits
# is preserved. Newly borrowed voxels may extend beyond the automatic crop.
# Added/removed masks are recalculated from the new before/after pair: an old
# lineage addition already present in the broader reference is not a new lesion.
#
# NOTE 3 — Choose a fresh directory for each review. This export is deliberately
# a review dataset, not a released model-training manifest. Approve anatomical
# coverage consistently across phantoms before preparing a new training revision.
# Existing masks/models remain available for the separate mask-only baseline.
