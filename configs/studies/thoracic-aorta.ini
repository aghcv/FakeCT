# Aorta study: edit this text, then run scripts/train_study.py --config this-file.ini.
# Start at stage=preview. Numbered NOTES below explain each setting.

[study]
schema_version = fakect.study/1              # NOTE 1: staged study input
name = xcat-thoracic-aorta-pilot              # NOTE 1: report name

[input]
root = /home/aghorban/slurm/xcat              # NOTE 2: read-only source root
case_id = 260602                             # NOTE 3: pilot anatomy
frame = 1                                   # NOTE 3: matching act/atn frame
audit = docs/integration/2026-09-16/xcat-results.json # NOTE 4: geometry audit
catalog = outputs/tissues/atlas-v1/label-catalog.json # NOTE 4: pinned anatomy mapping

[selection]
tissue = artery                             # NOTE 5: coarse tissue group
source_ids = 2922                            # NOTE 5: dias_aorta, provisional scope

[roi]
shape = tube                                # NOTE 6: ordered path with round caps
center_ijk = 387,360,1352 ; 378,365,1363 ; 373,362,1374 ; 373,363,1389 ; 376,366,1409 ; 385,375,1415 ; 392,386,1417 ; 393,398,1409 ; 390,408,1394 ; 387,414,1383 ; 387,419,1370 ; 387,419,1356 ; 389,419,1341 ; 391,416,1316 # NOTE 6: native i,j,k in path order
radius_mm = 10,10,10,12,11,10,10,13,12,11,11,11,11,11 # NOTE 7: one radius per node
crop_half_width_mm = 22                      # NOTE 8: context around node bounds
coordinate_reviewed = false                 # NOTE 9: review record

[preview]
slice_ijk = 385,388,1390                      # NOTE 10: crosshair, does not move ROI
overlay_opacity = 0.22                       # NOTE 11: orange ROI on slices
volume_opacity = 0.25                        # NOTE 11: selected tissue in 3D
context_tissues = artery, bone, vein         # NOTE 12: nearby anatomy
context_opacity = 0.08                       # NOTE 11: contextual tissue in 3D
volume_stride = 2                           # NOTE 12: display pooling only

[edit]
operation = none                            # NOTE 13: one preview trial
distance_mm = 1.5                            # NOTE 14: preview displacement in mm
profile = gaussian                          # NOTE 15: spatial taper
profile_axis = tube                         # NOTE 15: physical distance along path
shape_k = 10                                # NOTE 15: preview concentration
shape_window = 0.25,0.75                     # NOTE 15: normalized path interval

[reassignment]
allowed_tissues = soft_tissue, muscle, adipose # NOTE 16: permitted recipients/donors
max_distance_mm = 3                         # NOTE 16: erosion recipient search
unresolved = preserve                       # NOTE 16: retain unresolved voxels

[train]
stage = preview                             # NOTE 17: preview, plan, prepare, fit
dataset_directory = outputs/studies/thoracic-aorta/pairs-v1 # NOTE 18: new paired dataset
model_directory = outputs/studies/thoracic-aorta/model-v1 # NOTE 18: new model run
target_source_ids = 2922                     # NOTE 19: full-crop binary target
anatomy_family = xcat_260602_unverified_family # NOTE 20: shared source identity
operations = erosion, dilation              # NOTE 21: independent variant operations
distances_mm = 0.5,1.0,1.5,2.0               # NOTE 21: provisional distances, mm
shape_ks = 10                               # NOTE 21: Gaussian concentrations
include_baseline = true                     # NOTE 21: add unchanged source pair
max_variants = 25                           # NOTE 21: explicit generation bound
image_method = attenuation_copy_proxy       # NOTE 22: current image approximation
split_mode = scenario_only                  # NOTE 23: shared-anatomy holdouts
validation_fraction = 0.2                   # NOTE 23: provisional variant share
test_fraction = 0.2                         # NOTE 23: reserved from fitting
split_seed = 42                             # NOTE 23: deterministic partition

[model]
architecture = unet2d                       # NOTE 24: attenuation-to-mask model
patch_size = 64,64                          # NOTE 24: native j,i patch dimensions
slice_axis = k                              # NOTE 24: axial training slices
normalization = fixed_clip                  # NOTE 25: same transform at inference
clip_min = 0.0                              # NOTE 25: inverse centimetres
clip_max = 0.5                              # NOTE 25: provisional clipping limit
epochs = 5                                 # NOTE 26: small engineering run
batch_size = 4                              # NOTE 26: memory and update size
learning_rate = 0.001                       # NOTE 26: Adam step size
seed = 42                                  # NOTE 26: model/data-order seed

[output]
directory = outputs/studies/thoracic-aorta/preview-v3 # NOTE 27: new preview/plan directory

# -----------------------------------------------------------------------------
# NOTES -- all lines below are comments, not extra configuration.
# -----------------------------------------------------------------------------
# NOTE 1 -- This study uses the existing ROI and edit controls and adds [train]
# and [model]. Run scripts/train_study.py for this schema. Earlier preview/edit
# INIs still use scripts/preview_roi.py. Unknown sections or keys are rejected.
# name identifies the run; use letters, digits, underscores, hyphens or dots.
#
# NOTE 2 -- Relative paths inside this file resolve from this FakeCT checkout,
# independent of the current working directory or INI location. Absolute paths
# and ~ are accepted. Do not quote paths. Environment variables are not expanded.
# Source volumes remain read only. Generated outputs are separate crop artifacts.
#
# NOTE 3 -- Case 260602 frame 1 is the engineering pilot, not an independent
# population. Use matching non-averaged act (organ IDs) and atn (attenuation).
# Motion frames or reconstructions of one anatomy do not create new subjects.
#
# NOTE 4 -- Audit geometry must agree with the source parameter/log metadata.
# The catalog preserves signed source IDs, original names, hierarchy and atlas
# hashes. atlas-v1 names an output folder; the actual DPI sources are pinned by
# content hashes. See docs/TISSUE_MAPPING.md to build/inspect the catalog.
#
# NOTE 5 -- The dictionary and DPI hierarchy identify ID 2922 as dias_aorta.
# This is a candidate anatomical target; lumen versus outer vessel boundary and
# exact endpoints need review. Nearby arteries may carry other IDs. Keep the
# selected edit IDs within train.target_source_ids. A blank source_ids selects
# ALL IDs of the tissue group and is unsuitable for this aorta-only study.
# Raw surface block ordinals are not voxel IDs. Never infer artery/vein identity
# from attenuation alone. Preserve original signed IDs when refining selections.
#
# NOTE 6 -- Coordinates are zero-based native i,j,k (column,row,slice); arrays
# are k,j,i. Patient axes and physical origin remain unverified. Tube centers
# are semicolon-separated triples on ONE line in path order, never coordinate
# order. Adjacent nodes must differ. For a sphere, use shape=sphere, one triple,
# one radius, and change profile_axis to i, j or k for a Gaussian profile.
# This provisional path follows the arch; it does not cover the entire aorta.
#
# NOTE 7 -- Positive radii in millimetres, one per ordered node. Radii interpolate
# along straight segments; the ROI has round endcaps. A radius is half a diameter.
# ROI size controls where changes can occur; edit distance controls how much.
# The initial radii leave some original aorta outside the editable ROI. Inspect
# orange overlays and branch contacts before moving nodes or expanding radii.
#
# NOTE 8 -- Context extends this distance beyond node coordinate bounds on each
# axis, not beyond the tube surface. Leave enough margin for the largest radius,
# largest planned edit distance, recipient search and one spacing step. Current
# edits are bounded to 2,000,000 crop voxels. Full descending-aorta inclusion
# would need a different crop strategy; the current crop is an arch pilot.
#
# NOTE 9 -- Set true after coordinate inspection. This is a provenance record,
# not a programmatic approval gate or proof of anatomical correctness.
#
# NOTE 10 -- Explicit i,j,k controls three inspection planes; roi chooses a
# representative tube point. This setting changes the views, not the ROI. Use
# native axes and neighboring k levels in report.html to adjust the centerline.
#
# NOTE 11 -- Opacities range from 0 (invisible) to 1 (opaque). They only affect
# displays, not labels, material properties or the target mask.
#
# NOTE 12 -- Context shows nearby named tissue groups in the same crop. Including
# artery helps expose excluded branches. volume_stride=2 max-pools occupancy for
# display and may enlarge thin features; native slices/masks remain unchanged.
# Empty context groups do not establish that a tissue is anatomically absent.
#
# NOTE 13 -- At stage=preview, none renders source placement and the planned
# training target. erosion or dilation additionally runs ONE bounded trial and
# adds before/after comparisons. The cohort is still not prepared. At prepare,
# train.operations/distances_mm/shape_ks replace the single-trial values for each
# variant. Every cohort variant starts independently from the original phantom.
#
# NOTE 14 -- Physical weighted six-neighbor grid distance, not a stenosis
# percentage or diameter factor. Native 1 mm sampling can make 0.5 mm trials
# identical to baseline. Always inspect achieved changes and no-op accounting.
#
# NOTE 15 -- gaussian tapers distance along normalized physical tube length (or
# a native i/j/k axis). shape_window is ordered start,end in [0,1]. Outside that
# interval there is no edit. Larger shape_k concentrates the Gaussian. uniform
# applies constant distance and ignores these shape controls. These provisional
# settings do not by themselves define clinically calibrated coarctation or
# hypoplasia. Broad/focal and combined lesions need geometry review and later
# ordered-recipe support. Current sweeps share this profile/axis/window.
#
# NOTE 16 -- Erosion releases voxels to permitted surrounding tissue; dilation
# borrows permitted voxels. All other tissues, unknown labels and neighboring
# arteries/veins remain protected. Erosion searches within max_distance_mm using
# weighted grid distance. preserve retains unresolved source voxels; error
# rejects that trial. Dilation preserves blocked proposals. Replacement original
# labels AND attenuation values come from actual source seeds. Some configured
# tissue groups may be empty. Review allowed groups and realized transitions.
#
# NOTE 17 -- preview: HTML placement, optional single edit, target view and plan.
# plan: validate metadata and write a plan without reading voxel payloads.
# prepare: run the edit sweep and write paired NPZ volumes plus a frozen manifest.
# fit: verify an existing prepared dataset and run TensorFlow; it never prepares
# data implicitly. CLI --stage can explicitly override this setting for one run.
# --validate-only checks geometry and ranges without generation, even for fit.
# Start with preview while we refine ROI and ranges; prepare and fit are later.
#
# NOTE 18 -- Preparation refuses an existing dataset directory. Fitting refuses
# a populated model directory. Use a new version when data/model settings change.
# Stage, model settings and output paths do not change the dataset fingerprint;
# anatomy, ROI, edit/reassignment rules, ranges, source state and generator code
# do. A fit with incompatible data settings fails instead of silently rebuilding.
# Exact input text is captured alongside normalized configuration and hashes.
#
# NOTE 19 -- Binary masks contain these original IDs across the ENTIRE exported
# crop after editing, including unchanged aorta outside the ROI. They are not
# the ROI mask or the changed-voxel mask. Review training-target.png in the HTML.
# Original labels/catalog remain available for finer subdivision. This crop
# contains only part of the thoracic aorta; expanding coverage is separate work.
#
# NOTE 20 -- All variants share this source anatomy family. The family name is
# recorded explicitly; independence among other XCAT cases has not been verified.
# Real anatomy-family train/validation/test grouping is a later multi-case stage.
#
# NOTE 21 -- The sweep is operations x distances_mm x shape_ks plus an optional
# baseline: the current settings plan 9 variants. Lists are comma-separated and
# must be unique. Distances are positive and at most 50 mm; shape_ks are positive.
# uniform requires one shape_ks value. max_variants is a hard count limit.
# These are provisional engineering ranges. No automatic patient realism or
# lesion-percentage calibration is implied. Mixed-operation recipes come later.
#
# NOTE 22 -- The current image is original attenuation with copied source values
# at reassigned voxels, exported in 1/cm. It is not HU, learned background
# recovery, or physically reconstructed CT. This explicit image method is the
# only implemented option. Keep this limitation with all pilot model results.
#
# NOTE 23 -- Split complete variants before slicing/patching. Baseline belongs
# to train; fractions apply to edited variants using a deterministic seeded
# ordering (small counts are rounded to leave holdouts). Exact duplicate masks
# are kept in one split; baseline-equivalent variants go to train. Realized
# fractions may differ. If no distinct validation geometry remains, fit fails;
# revise the sweep instead of leaking duplicates. Test payloads are reserved
# from fitting/model selection. This shared-anatomy holdout measures synthetic
# scenario performance, not unseen-anatomy or patient generalization.
#
# NOTE 24 -- Initial two-level 2D U-Net: attenuation input, one sigmoid target.
# patch_size is j,i, divisible by 4 (16..512). All native k slices are tiled;
# edge padding is excluded from loss/metrics. Tiles inherit the variant split.
# This is crop segmentation, not an implemented whole-patient deployment.
#
# NOTE 25 -- Clip 1/cm values to [clip_min,clip_max] and scale to [0,1]. Bounds
# must be ordered. They are fixed engineering settings, saved with the model
# and reused at inference, never estimated from validation/test images. Examine
# attenuation distributions before fixing them. Patient/modality bridging needs
# separate calibration and validation; normalization alone cannot establish it.
#
# NOTE 26 -- The starter model uses Adam and BCE plus Dice loss. Validation loss
# selects the saved .keras checkpoint; reserved test data are not evaluated by
# fit. Seeds control ordering/initialization; hardware equivalence is not claimed.
# Five epochs is a smoke-scale setting, not a demonstrated best model.
#
# NOTE 27 -- Use a new directory for every preview/plan iteration (for example
# preview-v2). A populated directory is never overwritten. report.html embeds
# the figures and editable input; the remaining files preserve crop provenance.
# Changing stage to prepare/fit uses the separate dataset/model directories.
#
# RUN FROM THIS CHECKOUT:
# python3 scripts/train_study.py --config configs/studies/thoracic-aorta.ini
# Add --validate-only for metadata checks. See docs/TRAINING_STUDIES.md.
