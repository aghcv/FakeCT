# Aorta edits along one shared tube: run scripts/preview_roi.py --config this-file.ini.
# Define the centerline/radii once in [roi], then choose path_percent per edit.
# Curvature trial with your revised path ranges, distances and profile windows.
# Inspect the Edits tab: centerline-distance profiles, frame arrows and surface overlay.
# Profile axes use physical distance from the first ROI point; see NOTE 28.

[study]
schema_version = fakect.recipe/1             # NOTE 1: ordered editing recipe
name = xcat-thoracic-aorta-curvature             # NOTE 1: report name

[input]
root = /home/aghorban/slurm/xcat              # NOTE 2: original source root
case_id = 260602                             # NOTE 3: pilot anatomy
frame = 1                                   # NOTE 3: matching source frame
audit = docs/integration/2026-09-16/xcat-results.json # NOTE 4: source geometry
catalog = outputs/tissues/atlas-v1/label-catalog.json # NOTE 4: pinned tissue mapping

[selection]
tissue = artery                             # NOTE 5: coarse tissue category
source_ids =                                 # NOTE 5: artery category; ROI selects ancestors

[roi]
shape = tube                                # NOTE 6: reviewed target-selection tube
center_ijk = 387,360,1352 ; 378,365,1363 ; 373,362,1374 ; 373,363,1389 ; 376,366,1409 ; 385,375,1415 ; 392,386,1417 ; 393,398,1409 ; 390,408,1394 ; 387,414,1383 ; 387,419,1370 ; 387,419,1356 ; 389,419,1341 ; 391,416,1316 # NOTE 6: native i,j,k path order
radius_mm = 10,10,10,12,11,10,10,13,12,11,11,11,11,11 # NOTE 7: selection tube radii
crop_half_width_mm = 33                      # NOTE 8: shared display/edit crop
coordinate_reviewed = true                  # NOTE 9: user's reviewed main placement

[preview]
slice_ijk = 385,388,1390                      # NOTE 10: inspection planes only
overlay_opacity = 0.22                       # NOTE 11: ROI transparency
volume_opacity = 0.25                        # NOTE 11: target transparency
context_tissues = artery, bone, vein         # NOTE 12: neighboring anatomy
context_opacity = 0.08                       # NOTE 11: context transparency
volume_stride = 3                           # NOTE 12: display pooling only

[centerline]
smoothing_mm = 1.0                          # NOTE 24: physical spline residual budget
sample_step_mm = 1.0                        # NOTE 24: fitted arc resampling distance
min_curvature_per_mm = 0.002                # NOTE 25: minimum bend for inner/outer

[recipe]
roi_role = selection                        # NOTE 27: select here; growth may leave ROI
steps = arch_outer_expand, arch_inner_narrow, coa_narrow # NOTE 13: explicit execution order
overlap = sequential                        # NOTE 14: second pass uses first result

[edit.arch_outer_expand]
roi = main                                  # NOTE 16: original selection on main tube
path_percent = 15,55                        # NOTE 15: physical parent arc interval
operation = dilation                        # NOTE 17: add target on outer bend
distance_mm = 9.0                           # NOTE 18: peak distance before resistance
iterations = 1                              # NOTE 19: finite passes for this step
profile = gaussian                          # NOTE 20: smooth along selected range
profile_axis = tube                         # NOTE 20: local longitudinal coordinate
shape_k = 6                                 # NOTE 20: Gaussian concentration
shape_window = 0.05,0.95                          # NOTE 20: your local Gaussian window
direction = outer                           # NOTE 25: opposite principal normal N
angular_width_deg = 180                     # NOTE 26: full sector width, centered outward

[edit.arch_inner_narrow]
roi = main                                  # NOTE 16: reuse tube with separate range
path_percent = 25,55                        # NOTE 15: adjust independently if desired
operation = erosion                         # NOTE 17: remove target on inner bend
assign_surrounding_tissue = false            # NOTE 29: mark releases for diagnosis
#min_volume_ratio = 0.10                    # NOTE 30: retained fraction in active segment
#preserve_connectivity = true                # NOTE 31: keep affected components connected
#backoff_factor = 0.5                        # NOTE 32: halve rejected trial distance
#max_backoff_steps = 8                       # NOTE 32: reductions before skipping pass
distance_mm = 7.0                           # NOTE 18: peak distance before resistance
iterations = 1                              # NOTE 19: finite passes for this step
profile = gaussian                          # NOTE 20: smooth along selected range
profile_axis = tube                         # NOTE 20: local longitudinal coordinate
shape_k = 6                                 # NOTE 20: Gaussian concentration
shape_window = 0.3,0.9                          # NOTE 20: your local Gaussian window
direction = inner                           # NOTE 25: toward principal normal N
angular_width_deg = 180                     # NOTE 26: full sector width, centered inward

[edit.coa_narrow]
roi = main                                  # NOTE 16: reuse tube with separate range
path_percent = 65,75                        # NOTE 15: adjust independently if desired
operation = erosion                         # NOTE 17: circumferential narrowing
assign_surrounding_tissue = false            # NOTE 29: mark releases for diagnosis
min_volume_ratio = 0.10                    # NOTE 30: retained fraction in active segment
preserve_connectivity = true                # NOTE 31: keep affected components connected
backoff_factor = 0.5                        # NOTE 32: halve rejected trial distance
max_backoff_steps = 8                       # NOTE 32: reductions before skipping pass
distance_mm = 10                           # NOTE 18: peak distance before resistance
iterations = 1                              # NOTE 19: finite passes for this step
profile = gaussian                          # NOTE 20: smooth along selected range
profile_axis = tube                         # NOTE 20: local longitudinal coordinate
shape_k = 8                                 # NOTE 20: Gaussian concentration
shape_window = 0.05,0.95                          # NOTE 20: your local Gaussian window
direction = all                            # NOTE 25: full circumference
# angular_width_deg = 180                     # NOTE 26: full sector width, centered inward

[reassignment]
mode = stiffness                            # NOTE 21: use the editable factors below
allowed_tissues =                           # NOTE 21: must be blank in this mode
max_distance_mm = 3                         # NOTE 21: erosion recipient search
unresolved = preserve                       # NOTE 21: retain unresolved original voxels

[stiffness]
default = 0.05                              # NOTE 23: fallback factor for catalogued anatomy
bone = 1.0                                  # NOTE 23: rigid at 1; editable
skin = 0.95                                 # NOTE 23: very resistant; editable
soft_tissue = 0.05                           # NOTE 23: category resistance
muscle = 0.10                                # NOTE 23: category resistance
artery = 0.05                                # NOTE 23: includes selected target aorta
vein = 0.05                                  # NOTE 23: category resistance
lung = 0.02                                  # NOTE 23: category resistance
cartilage = 0.20                             # NOTE 23: category resistance
adipose = 0.02                               # NOTE 23: category resistance
nervous_tissue = 0.10                        # NOTE 23: category resistance
fluid = 0.02                                 # NOTE 23: category resistance
unknown = 0.05                               # NOTE 23: catalogued anatomy with unresolved grouping

[output]
directory = outputs/studies/thoracic-aorta/recipe-v12 # NOTE 22: new folder per trial

# -----------------------------------------------------------------------------
# NOTES -- these explanations are comments, not extra configuration.
# -----------------------------------------------------------------------------
# NOTE 1 -- fakect.recipe/1 supports ordered edits using a shared ROI. Run this
# file with scripts/preview_roi.py. It does not generate a training cohort or fit
# a model. Existing named [roi.NAME] definitions still work when you need a
# different path/radius. Unknown settings and spelling mistakes are rejected.
# Edit names use letters, digits, underscores, hyphens or dots; no spaces.
#
# NOTE 2 -- All relative paths resolve from this FakeCT checkout. Absolute paths
# and ~ are accepted; do not quote them or use environment variables. Original
# phantom files are read only. Each complete recipe starts from those originals.
#
# NOTE 3 -- Case 260602 frame 1 remains a single engineering anatomy. Match act
# organ IDs and atn attenuation by case/frame. Native arrays are k,j,i. Additional
# edits or motion frames of this anatomy are not independent anatomical subjects.
#
# NOTE 4 -- The audit supplies geometry checked against source metadata. The
# catalog preserves original signed IDs, anatomy names, tissue mapping, atlas
# hashes and provenance. atlas-v1 is an output folder name, not an atlas version.
#
# NOTE 5 -- This example selects the artery CATEGORY, with no original-ID filter.
# source_ids may be blank or omitted. Every original ID mapped to artery is a
# candidate, including aorta and branch labels. This lets mapped coronary/arch
# branches participate near their ostia wherever they intersect the chosen ROI.
# Only actual artery voxels in the tube and edit range can be selected; the
# category cannot recover missing or misclassified branch labels. The Global
# and Local views show context so nearby arteries and junctions can be reviewed.
# The ROI path defines local directions, so a branch has its parent's local frame
# in this trial. Smooth junctions are a review target, not a guaranteed result.
#
# An optional source_ids filter can still narrow selection to known original
# volume IDs, but no such knowledge is needed for this example. Surface block
# ordinals are not volume label IDs. All steps share the same tissue selection.
# Labels preserve their source identities and atlas metadata. Stiffness overrides
# by ID are also optional; category factors apply when that section is omitted.
# Global guide changes must be copied into this INI and rerun to change edits.
# The aorta ROI placement was reviewed; the arch range and directional trial are
# proposals for inspection, including branch ostia and any nearby artery contacts.
#
# NOTE 6 -- Define the tube once in [roi]. Its first listed point is 0% and its
# last is 100%. Put the proximal end first if you want proximal-to-distal ranges;
# the software preserves the supplied order and does not infer anatomical direction
# or sort coordinates. This ROI fixes initial selection and crop placement.
# With roi_role=selection, edited offspring may grow beyond its boundary (NOTE 27).
# Coordinates are native zero-based i,j,k (column,row,slice). Node triples are
# semicolon-separated on ONE line, with no trailing semicolon. Consecutive nodes
# must differ. Point numbers used by point_range start at 1, unlike voxel indices.
# The report includes a table of point numbers, coordinates, radii, mm and percent.
#
# NOTE 7 -- Supply one positive radius_mm per main centerline node. Radii
# interpolate between nodes. Each edit inherits these radii automatically,
# including interpolated radii at percentage endpoints; no repeated radius list
# is needed. Radius controls the allowed editing region, not edit strength.
# Keep the selector narrow enough to exclude unwanted artery voxels. The growth
# region provides dilation space separately; no radius increase is needed for it.
#
# NOTE 8 -- One common crop surrounds the main node bounds by this many mm along
# each native axis. Named ROIs do not get independent crops. Leave enough margin
# for outer radius, edit distance, recipient search and one spacing step. The
# bounded engine currently accepts at most 2,000,000 crop voxels. Increasing
# iterations does not enlarge the loaded crop. The growth region can extend
# beyond the selection ROI. Validation reserves context for inherited and repeated
# growth plus the current edit, recipient search and one spacing step.
# With your one-pass 9 mm dilation, the halo is 9 + 3 + 1 = 13 mm;
# for the 7 mm erosion it is 7 + 3 + 1 = 11 mm beyond its initial envelope. crop_half_width_mm=28 and volume_stride=3 pass
# both context and display checks for these paths. Crop width changes loaded
# context, not the ROI or edit strength. Revalidate after changing paths/radii.
#
# NOTE 9 -- coordinate_reviewed records review of the parent ROI placement.
# It is not an execution gate and does not automatically mark newly chosen edit
# ranges as reviewed. Inspect their colored regions and final edited geometry.
#
# NOTE 10 -- slice_ijk chooses three inspection planes without moving any ROI.
# Use roi for a representative main-tube point, or provide one native i,j,k.
# Inspect ROI-specific views and neighboring slices when adjusting subdivisions.
#
# NOTE 11 -- Opacities are between 0 and 1 and affect display only. They do not
# affect source labels, the edit strength, or tissue reassignment decisions.
#
# NOTE 12 -- Nearby tissue categories provide context. Display stride max-pools
# occupancy and may enlarge thin structures visually; native masks are unchanged.
# Empty displayed tissue groups do not establish that anatomy is absent.
# A larger crop can exceed the display budget: raise volume_stride (for example
# from 2 to 3) while keeping enough crop margin for editing. This changes only
# pooled 3D context views; native editing, slices and the before/after overlay
# remain at source resolution. The error recommends a valid display stride.
#
# NOTE 13 -- steps explicitly orders edit names. Section order has no effect.
# Each [edit.NAME] appears exactly once in steps. Reuse roi=main in any number of
# edits, with different ranges or operations. Use iterations for repeated passes
# of one step. Every command starts from the original phantom. operation=none
# retains an inactive range for planning. Optional named ROIs remain supported.
#
# NOTE 14 -- sequential lets later passes consume earlier edited labels and
# attenuation, including within overlapping ranges. error rejects overlap of
# distinct selectors or their conservative growth envelopes before execution.
# Repeated passes of
# one step are allowed. Legacy repeated use of the same whole named ROI retains
# its existing meaning; new per-edit ranges are separate regions even on main.
#
# NOTE 15 -- path_percent = start,end selects a portion of the referenced tube
# by PHYSICAL centerline length, including anisotropic voxel spacing. Use values
# satisfying 0 <= start < end <= 100, for example 30,75. Uneven point spacing does
# not bias the percentage. Endpoint coordinates and radii interpolate as needed.
# The starting end is always the first supplied centerline point, not an inferred
# patient axis. Your current original-target selections are 3-20% for outward
# dilation, 25-55% for inward erosion, and 65-75% for circumferential coa erosion.
# These ranges are independently editable in each section.
#
# Alternatively REPLACE path_percent with point_range = 2,8 to choose original
# points 2 through 8 exactly, using 1-based inclusive endpoint numbers. Never
# specify both selectors. Omitting both uses the entire referenced ROI. A range
# requires shape=tube; whole-ROI edits can still use named spheres.
#
# For each voxel, the closest parent centerline position sets its longitudinal
# coordinate; equal-distance segments use the first in the supplied order. The
# original selection lies in the selected subpath tube, parent tube, chosen arc
# interval and main ROI. In selection mode these boundaries select original target
# ancestors; their growth may leave these boundaries. Uniform dilation can extend
# beyond an interval end. Gaussian budgets still use the spatial parent coordinate
# and taper to zero outside shape_window. Bends/self-approaches can make closest-
# point partitions nonplanar; inspect the selected seeds and resulting geometry.
#
# NOTE 16 -- roi=main references the top-level [roi]. This is the compact default.
# Optional roi=NAME references [roi.NAME] for a separate path or sphere. main is
# reserved, so do not define [roi.main]. Each edit can choose its own path_percent
# or point_range on the referenced tube; no copied coordinate/radius list is needed.
# All edits use the shared tissue category and original main selection. Growth
# footprints and tracked offspring are separate from the original selection.
#
# NOTE 17 -- dilation adds selected aorta voxels from permitted neighboring
# tissues; erosion removes eligible aorta voxels using permitted recipients.
# none leaves the current result unchanged but retains a visible planning step.
# This trial uses your outward dilation and inward erosion on separate selected
# portions of the reference path. These are experimental geometry edits,
# not calibrated diagnoses or prescribed clinical severities.
#
# NOTE 18 -- Physical weighted six-neighbor grid distance per pass, at most
# 50 mm for active editing. This is not a stenosis percentage or diameter scale.
# Native 1 mm sampling, narrow ROIs and protected tissues can reduce the achieved
# change. Check reported changed counts and before/after geometry, including no-ops.
#
# NOTE 19 -- iterations is a finite repeat count from 1 to 10 for THIS step.
# The full recipe allows at most 20 passes, counting inactive placeholders too.
# Each pass takes the preceding pass's result. Two 1 mm passes need not equal
# one 2 mm pass because boundaries, tissue availability and profiles interact.
# This is an ordered bounded loop, not a while loop seeking convergence. A new
# command starts the recipe again from the original phantom, not the prior output.
#
# NOTE 20 -- With profile_axis=tube, the chosen edit range has local coordinate
# u=0 at its start and u=1 at its end. gaussian tapers along that local coordinate.
# shape_window=0,1 uses the whole range; 0.2,0.8 confines the Gaussian to its middle
# 60%. Larger shape_k concentrates the change; it does not change the ROI range.
# For a parent path_percent=30,75, local u=0.5 is parent 52.5%. Uniform uses a
# constant budget within the selected range and ignores Gaussian shape settings.
# This defines longitudinal localization/taper. direction and angular_width_deg
# independently taper around the local cross-section (NOTEs 25-26).
#
# NOTE 21 -- One shared policy controls all steps. stiffness uses the editable
# factors in NOTE 23 for dilation, erosion release and erosion recipients.
# Catalogued anatomical IDs are eligible, including unknown-group anatomy such
# as pericardium and other arteries/veins. Background and unmapped IDs remain
# protected because they are not recognized anatomical donors/recipients. Atlas
# labels/categories remain unchanged. allowed_tissues must be blank in this mode.
# To restore the original restricted policy, remove both stiffness sections,
# use mode=allowlist and allowed_tissues=soft_tissue,muscle,adipose. Omitting mode
# also means allowlist; an empty allowlist permits no donors. The alternative
# permissive_except_bone_skin mode has binary bone/skin protection and likewise
# requires blank allowed_tissues and no stiffness sections. preserve retains
# unresolved release candidates; error aborts that edit. Labels AND attenuation
# follow actual current seeds. This remains an experimental attenuation-copy
# proxy, not reconstructed CT, learned recovery or validated patient appearance.
#
# NOTE 22 -- Use a fresh output directory after each input change, for example
# recipe-v12 after the generated recipe-v11. Populated outputs are not overwritten.
# The HTML captures the input, resolved percent/point ranges, centerline table,
# native geometry and ordered before/after results. Per-pass artifacts preserve
# the chain. Recipe-to-training sweeps still require separate integration work.
#
# NOTE 23 -- Every stiffness factor is editable and must be between 0 and 1.
# These are heuristic editing resistance weights, NOT physical elastic moduli,
# measured tissue stiffnesses or a finite-element mechanics model. Zero grants
# the full configured distance budget; one is a rigid barrier. Intermediate
# values multiply the local edit budget by (1 - stiffness). Dilation uses the
# would-be donor voxel's factor; erosion release uses the current target's factor.
# Erosion recipient seeds additionally pay max_distance_mm * seed_stiffness,
# followed by ordinary physical six-neighbor path distance. The winning seed
# minimizes penalty + path distance within max_distance_mm, giving each seed
# physical reach max_distance_mm * (1 - seed_stiffness). This is a bounded search.
#
# Precedence: original-ID entry in [stiffness.labels], then fine-atlas bone/skin
# identity, then the coarse tissue category, then default. Fine identity locates
# skin even when its coarse category is soft_tissue. An explicit label override
# can change ANY anatomical ID's factor, including bone or skin. The default,
# bone and skin settings are required but their values are not fixed in code.
# Other known categories are optional; missing categories use default. IDs in
# stiffness.labels are signed original 32-bit integers, not tissue category IDs.
# That section may be omitted or left empty when no label overrides are needed.
#
# This starter sets bone=1 (rigid), skin=.95 (5% of the normal distance budget),
# and other anatomy to lower resistance. At native 1 mm spacing with a 2 mm edit,
# a skin donor receives at most .1 mm and typically cannot move a whole voxel;
# .95 is still a continuous setting, not a binary protection switch. The 3 mm
# recipient search gives skin at most .15 mm physical reach. Subvoxel budgets
# often produce no change; inspect achieved counts before choosing more passes.
# All values are provisional controls you can tune in this file. Keep the
# original atlas metadata so tissue classifications can be refined independently.
#
# NOTE 24 -- These settings create a smoothed DIRECTIONAL REFERENCE, keeping the
# original polyline ROI mask, radii and path_percent coordinates unchanged.
# Coordinates first convert to physical mm using native i,j,k spacing. A cubic
# spline is fitted against original cumulative physical arc fraction. Its
# residual sum budget is node_count * smoothing_mm^2; smoothing_mm is an RMS
# tolerance at controls, not a maximum per-node displacement or a filter radius.
# Zero interpolates controls and may retain their noise. Inspect fit displacement
# in the report before increasing smoothing. At least four parent points are
# required for directional edits, even if an edit selects a short two-point part.
# sample_step_mm sets approximate uniform distance along the FITTED spline;
# it does not resample the CT or redefine percentages. Frame count is bounded at
# 4096. The Edits tab shows original and fitted paths, sparse arrows, and curvature
# against the original parent path percentage. Full vectors are saved in JSON.
#
# NOTE 25 -- Tangent T follows the supplied order. Principal normal N points
# toward the local center of curvature (inner bend); outer is -N. The second
# normal, or binormal B, is T cross N. These are local geometric directions,
# not patient left/right. Reversing point order reverses T and B, while the same
# geometric inner/outer side remains. direction=inner or outer selects that side;
# omit direction, or use direction=all AND remove angular_width_deg, to restore
# ordinary circumferential editing. The frame uses the full referenced parent
# path so multiple edit ranges share one directional reference.
# Curvature has units 1/mm: .002 corresponds to a 500 mm curvature radius. Below
# the threshold, at endpoints, stationary tangents, and sampled inflection/normal
# ambiguities, inner/outer budgets are zero. Transported display normals NEVER
# supply an invented inner/outer direction. Normals are not flipped just to make
# arrows look continuous. Report counts identify skipped voxels. Sparse control
# points can hide bends; inspect arrows and decrease spacing or refine controls.
#
# NOTE 26 -- angular_width_deg is the FULL sector width, >0 and <=180 degrees.
# 180 selects at most one cross-sectional half; 90 selects a narrower quarter.
# The angular factor is 1 exactly in the requested direction and tapers to zero
# at +/- half the width with a raised cosine. It is zero beyond that sector.
# Native voxels map by closest ORIGINAL parent arc position to the fitted local
# frame. Their radial offset is projected perpendicular to T; undefined radial
# directions on the fitted axis are skipped. The local distance budget is
# distance_mm * longitudinal_profile * angular_factor, then * (1-stiffness).
# Thus most supported voxels receive less than distance_mm, and the grid can
# suppress small changes. Increase distance_mm, widen the sector up to 180, or
# change the longitudinal profile to adjust severity. The parent ROI selects
# original target voxels; offspring may leave it (NOTE 27). Every pass saves
# weights, reliability masks, and exact
# changed labels in step.npz. An asymmetric erosion removes selected tissue at
# the inner-facing boundary; it does not translate the entire vessel or prescribe
# a diameter reduction. This is a geometric editing experiment for review.
#
# NOTE 27 -- roi_role=selection separates target selection from permitted growth.
# The original phantom is the reference. Each artery voxel inside the selected
# ROI and path range is an ancestor; added target voxels inherit the winning
# selected seed's original ancestor coordinate. Subsequent iterations AND later
# edits select those ancestors and their surviving offspring, including outside
# the original ROI. An artery outside the original selection never becomes a
# new seed merely because it is nearby, shares the same ID, or enters the growth
# region. Original labels and the optional ID filter retain their meanings.
#
# For each dilation pass the engine creates an envelope within distance_mm of
# the CURRENT tracked target, using physical distances. This is available space,
# not guaranteed displacement: profile, direction, accepted grid paths, tissue
# eligibility and stiffness still limit the actual changes. The crop must contain
# all requested context. Repeated passes advance their offspring; a fixed ROI
# never clips that growth. Erosion removes tracked target at true tissue boundaries,
# including previous offspring. The ROI cut itself is not treated as a vessel wall.
#
# Unselected artery voxels remain unchanged and cannot seed or carry growth.
# New growth can touch them; this does not imply they are branches of the same
# vascular tree. Inspect contacts in the report. The report distinguishes the
# fixed orange selector from the blue growth/edit footprint, reports changes
# outside selection, and saves masks and ancestor indices for every pass.
# overlap=error rejects conservative growth-region overlap between distinct edit
# regions before editing; sequential permits ordered interactions. No automatic
# topology repair or physical deformation is implied. Remove roi_role or use
# boundary to restore the previous behavior that clips all edits to the ROI.
#
# NOTE 28 -- Tube edit profiles use distance in mm from the first original ROI
# centerline point, with a matching percentage axis. Every range edit retains
# the full parent reference; shading marks its selected path interval. Curves
# show native target/change voxel volume divided by arc-bin length (mm3/mm),
# not vessel-normal lumen area or stenosis percentage. Growth is located by its
# current voxel position, not its ancestor. Endpoint-projected volumes are
# reported separately. The native k-slice plot remains a collapsed diagnostic.
#
# NOTE 29 -- assign_surrounding_tissue defaults to true when omitted. On an
# erosion edit, false assigns released voxels to the bright-pink diagnostic
# category "released" instead of searching for surrounding tissue recipients.
# Target stiffness, distance, direction and profile still determine release.
# max_distance_mm and unresolved do not govern assignment in this mode; the
# conservative crop halo is retained. No atlas labels or skin/bone settings
# are changed. The released-neighborhood views/table expose nearby labels.
# These markers carry NO inferred tissue identity: attenuation is retained
# only as a placeholder and flagged by attenuation_unassigned_mask. Markers
# stay protected in subsequent passes and cannot be used for training pairs.
# Set true and rerun from the source to restore normal tissue assignment.
# The overlay has independent category visibility and 15/45/80% opacity.
# Category context shows FINAL labels; pink released voxels start visible.
#
# NOTE 30 -- min_volume_ratio is an optional retained TARGET-volume fraction,
# from 0 to 1; 0 disables the volume floor. Here 0.50 means retain at least half
# of the selected target in this edit's active segment, NOT half of the whole
# main ROI. The reference is captured immediately BEFORE this named step, after
# preceding steps, and stays fixed through all of its iterations and retries.
# Separate named edits use separate references, even if their ranges overlap.
# The measurement mask includes selected target where the longitudinal profile
# is positive, before angular weighting or tissue resistance. It therefore
# includes the full selected cross-section, not only the eroded surface shell
# or just the inner/outer sector. For a Gaussian it excludes shape_window's
# zero-strength ends. This keeps an unchanged long tube from diluting the check.
# With coa path_percent=65,75 and shape_window=0.05,0.95, the active arc support
# is parent 65.5-74.5% (native closest-centerline voxel assignment). Uniform
# uses the entire selected segment. Previously grown selected offspring count.
# Volume ratio is surviving reference target voxels / reference target voxels;
# all voxels share the source spacing, so their physical volume cancels. Empty
# references skip the edit and report ratio 1. The report gives exact counts and
# each step.npz saves erosion_guard_scope_mask and erosion_guard_retained_mask.
# The 0.50 setting is an initial debugging choice, not a clinical threshold.
#
# NOTE 31 -- preserve_connectivity defaults to false. When true, every pre-step
# full-crop target component intersecting the measurement mask must retain
# exactly ONE component connected through voxel FACES (six neighbors). Splitting
# a component or losing it entirely rejects the trial. Already separate artery
# components are evaluated individually; their counts cannot cancel a split.
# Connectivity uses surrounding target in the loaded crop to test connections
# through the edited segment. It does not invent connections beyond the crop or
# repair pre-existing gaps. It is not a minimum lumen-area/diameter constraint:
# a one-voxel bridge can pass. Inspect the accepted surfaces and profiles.
# Both enabled checks must pass. To disable all guards set min_volume_ratio=0
# and preserve_connectivity=false. These optional settings apply only to erosion.
#
# NOTE 32 -- Each pass first tries the unchanged requested distance_mm. If any
# enabled safeguard fails, retry from that SAME pass input at distance_mm times
# backoff_factor (strictly between 0 and 1), repeatedly. Default factor is 0.5;
# max_backoff_steps defaults to 8 and accepts 0-20 reductions AFTER the initial
# trial. If all fail, preserve this pass input and report accepted distance 0.
# Rejected trials never contribute released markers, attenuation, ancestry,
# counts, figures or later inputs. The report records their scalar diagnostics.
# The first passing trial is accepted; this bounded geometric search does not
# find the largest possible distance. Each new iteration tries the requested
# distance again against the same fixed step reference. The INI distance stays
# unchanged; requested/accepted distances are shown separately in the report.
# A small positive accepted distance may produce no change on the native grid.
# Crop/halo validation still reserves the full requested distance before trials.
#
# RUN FROM THIS CHECKOUT:
# python3 scripts/preview_roi.py --config configs/studies/thoracic-aorta-curvature.ini
# Add --validate-only to check settings and geometry without generating edits.
