# Explore an artery ROI without knowing XCAT anatomical IDs.
# Run: python3 scripts/preview_roi.py --config configs/studies/thoracic-aorta-explore.ini

[study]
schema_version = fakect.preview/2            # NOTE 1: exploration only
name = xcat-thoracic-aorta-explore             # NOTE 1: report title

[input]
root = /home/aghorban/slurm/xcat              # NOTE 2: source phantom collection
case_id = 260602                             # NOTE 2: selected phantom
frame = 1                                   # NOTE 2: matching frame
audit = docs/integration/2026-09-16/xcat-results.json # NOTE 2: checked geometry
catalog = outputs/tissues/atlas-v1/label-catalog.json # NOTE 2: tissue mapping

[selection]
tissue = artery                             # NOTE 3: choose a tissue by name
source_ids =                                # NOTE 3: OPTIONAL; blank or omit this line

[roi]
shape = tube                                # NOTE 4: sphere or ordered tube
center_ijk = 387,360,1352 ; 378,365,1363 ; 373,362,1374 ; 373,363,1389 ; 376,366,1409 ; 385,375,1415 ; 392,386,1417 ; 393,398,1409 ; 390,408,1394 ; 387,414,1383 ; 387,419,1370 ; 387,419,1356 ; 389,419,1341 ; 391,416,1316 # NOTE 4: ordered native coordinates
radius_mm = 10,10,10,12,11,10,10,13,12,11,11,11,11,11 # NOTE 5: millimetres, one radius per node
crop_half_width_mm = 22                      # NOTE 6: native local context margin
coordinate_reviewed = true                  # NOTE 7: copied reviewed overall placement

[preview]
slice_ijk = roi                             # NOTE 8: keep local planes near the ROI
overlay_opacity = 0.22                       # NOTE 9: local ROI transparency
volume_opacity = 0.25                        # NOTE 9: local selected tissue transparency
context_tissues = artery, bone, vein         # NOTE 9: local neighboring anatomy
context_opacity = 0.08                       # NOTE 9: local context transparency
volume_stride = 2                           # NOTE 9: local 3D display sampling

[output]
directory = outputs/studies/thoracic-aorta/explore-v1 # NOTE 10: fresh folder for each run

# -----------------------------------------------------------------------------
# NOTES -- practical instructions; all lines below are comments.
# -----------------------------------------------------------------------------
# NOTE 1 -- This input makes a Global view and a Local view in report.html.
# It applies no erosion or dilation. Use it to position the target first, then
# transfer the geometry to a single edit or a named recipe ROI when ready.
#
# NOTE 2 -- The pipeline reads audited XCAT labels and attenuation, then uses the
# atlas to map original labels onto tissue names. You do not need to know those
# original IDs. They remain recorded automatically for provenance. Paths inside
# this file resolve from the integrated FakeCT checkout, not the current shell
# directory. Source volumes are read only.
#
# NOTE 3 -- The selection is tissue intersected with ROI. Leave source_ids blank
# or remove the line to select by tissue and position alone. An explicit list is
# an advanced optional filter. If two arteries cross your ROI, both are selected;
# narrow or reshape the tube to isolate the intended vessel. Artery is a broad
# tissue group, not an anatomical name such as aorta. No stiffness label overrides
# are needed: a later recipe may omit [stiffness.labels] and use category factors.
#
# NOTE 4 -- Start in Global view. Slice sliders and image clicks change the
# crosshair throughout the whole phantom. Use the temporary sphere guide and
# copy its native i,j,k coordinate; these controls do not alter this saved INI.
# For a tube, collect points in path order and separate them with semicolons.
# Each point has i,j,k in native voxel indices, not millimetres. The starter path
# copies the user's reviewed aorta ROI. To begin elsewhere, replace the path,
# or use shape=sphere with one center_ijk triple and one radius_mm value.
#
# NOTE 5 -- Radii are physical millimetres. A tube needs one radius per center.
# The ROI is the union of interpolated balls along the path, including round
# end caps. A sphere uses one radius. Global views sample the whole volume, so
# small vessels and narrow ROIs can be missed there. Refine in native Local view.
#
# NOTE 6 -- This padding determines the native local crop around the ROI path;
# it must be at least the largest radius. A long path or large margin can exceed
# the bounded crop limit. Use Global view for the full phantom, rather than
# enlarging the local crop to cover the body. Active recipe edits also need room
# for the edit distance and recipient search around their named ROIs.
#
# NOTE 7 -- Mark false after moving the geometry; set true when you have reviewed
# the new native local masks. This records your review, not automatic anatomy
# recognition. Physical anatomical orientation remains unverified; use i,j,k.
#
# NOTE 8 -- slice_ijk=roi follows a point on the ROI path automatically. You may
# supply a native i,j,k triple to inspect specific planes inside the local crop.
# Moving the Global view crosshair only browses the captured whole-phantom sample;
# it does not update native Local view, the saved geometry, or any edit result.
# Save changed INI coordinates, choose a fresh output folder, and rerun to update
# the local native views. The report's Input tab can copy/download edited text.
#
# NOTE 9 -- These are native-local display settings. Global sampling is chosen
# automatically to bound memory and HTML size; its step is shown in the report.
# Display sampling never resamples the labels used by native ROI edits.
#
# NOTE 10 -- Existing populated output folders are not overwritten. For the next
# run use outputs/studies/thoracic-aorta/explore-v2, then v3, and so forth.
# Open that folder's report.html. It embeds Global, Local and input information
# so the report can be moved as one file. Global navigation runs offline.
