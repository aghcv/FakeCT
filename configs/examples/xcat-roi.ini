# FakeCT ROI preview input. Edit the values, save, and rerun preview_roi.py.
# Short hints refer to the numbered NOTES at the bottom of this file.

[study]
schema_version = fakect.preview/1            # NOTE 1: supported input version
name = xcat-carotid-roi                      # NOTE 2: name shown in previews

[input]
root = /home/aghorban/slurm/xcat             # NOTE 3: folder containing the cases
case_id = 260602                             # NOTE 4: one source anatomy
frame = 1                                   # NOTE 4: one motion frame
audit = docs/integration/2026-09-16/xcat-results.json # NOTE 5: verified geometry audit
catalog = outputs/tissues/atlas-v1/label-catalog.json  # NOTE 6: anatomy-to-tissue mapping

[selection]
tissue = artery                             # NOTE 7: editable tissue group
source_ids = 1185                            # NOTE 8: original IDs; blank selects entire group

[roi]
center_ijk = 404, 363, 1584                   # NOTE 9: move the sphere in native voxel indices
radius_mm = 12                              # NOTE 10: sphere radius in millimetres
crop_half_width_mm = 40                      # NOTE 11: close-up extent around the centre
coordinate_reviewed = false                 # NOTE 12: record your coordinate review

[preview]
slice_ijk = roi                              # NOTE 13: sections through ROI centre, or i, j, k
overlay_opacity = 0.22                       # NOTE 14: transparent ROI on slice images
volume_opacity = 0.25                        # NOTE 14: selected-label opacity in 3D
context_tissues = bone, vein                 # NOTE 15: faint anatomical context; blank disables
context_opacity = 0.08                       # NOTE 14: context opacity in 3D
volume_stride = 2                           # NOTE 16: 3D preview sampling step

[output]
directory = outputs/roi/carotid-v2           # NOTE 17: a new output directory for this iteration

# -----------------------------------------------------------------------------
# NOTES -- detailed guidance; everything below is a comment.
# -----------------------------------------------------------------------------
# NOTE 1 -- This file controls ROI PREVIEWS only. It does not dilate or erode a
# label, reassign voxels, submit a job, or generate a cohort. The standard input
# for those later operations is still being developed. Unsupported sections and
# misspelled keys fail validation rather than silently doing nothing. Use the
# version shown above; this is the preview-input schema, not an atlas version.
#
# NOTE 2 -- Give each experiment a short descriptive name using letters, digits,
# underscores, hyphens, or dots. This name helps distinguish saved previews.
#
# NOTE 3 -- All relative paths INSIDE this file are resolved from the FakeCT
# repository containing the preview script, regardless of the shell's current
# directory or where this INI is stored. Absolute paths and ~ are accepted.
# Environment variables such as $HOME are not expanded. Do not quote paths;
# spaces within them are allowed. A space followed by # begins an inline comment.
# Input files are read only; source volumes and dictionaries remain unchanged.
#
# NOTE 4 -- Select one case folder and a positive motion-frame number. A case ID
# is kept as text, including leading zeros. Case/frame geometry and file sizes
# must match the audit. Use per-frame act labels and the matching atn volume;
# averaged act_av intensities are mixtures and cannot serve as categorical IDs.
#
# NOTE 5 -- The audit supplies source dimensions and voxel spacing established
# from the XCAT parameter file and output log. It also records sampling and
# geometry checks. It is not a replacement for verifying anatomical orientation.
# See docs/integration/2026-09-16/ for the original audit and its limitations.
#
# NOTE 6 -- The catalog preserves each signed organ ID, original name, anatomy
# hierarchy, proposed tissue group, mapping evidence, and source hashes. Its JSON
# format is generated metadata: users edit this INI and the tissue policy rather
# than manually editing thousands of catalog records. Anatomical grouping does
# not imply a unique material or attenuation value. Unresolved labels stay
# unknown. Rebuild the catalog after an atlas or policy change; previews record
# the exact catalog used. See docs/TISSUE_MAPPING.md for catalog commands.
#
# NOTE 7 -- Use an exact group name from the catalog. The initial editable policy
# contains soft_tissue, bone, cartilage, muscle, artery, vein, lung, adipose,
# nervous_tissue, and fluid. Some groups may be empty. Arteries and veins cannot
# be distinguished by attenuation thresholds alone. The chosen group filters
# original IDs; it does not replace or discard the original anatomy labels.
#
# NOTE 8 -- List signed original organ IDs separated by commas to narrow the
# group, for example 1185. Preserve minus signs: +N and -N are distinct IDs.
# Every listed ID must belong to the selected group in the catalog. Leave the
# value empty to include all IDs assigned to that group. Surface block indices
# from *.raw files are NOT organ IDs. Use catalog names and the rendered label
# legend to confirm the intended vessel or structure before geometry editing.
#
# NOTE 9 -- Enter three nonnegative integers in i, j, k order: i is the column,
# j is the row, and k is the slice index in the original source volume. Indices
# are zero based; internal array storage is k, j, i (z, y, x). These coordinates
# refer to the native XCAT grid, not verified patient left/right/anterior axes.
# Move one coordinate at a time, regenerate, and use the displayed index axes
# and crosshair to locate the intended segment. Bounds are checked against the
# selected case. The initial centre (404, 363, 1584) was located by sampling
# original ID 1185 in case 260602, frame 1. It is a preview starting point, not
# an approved intervention location. The earlier whole-body preview crosshair
# (375, 375, 1264) does not locate this selected carotid segment.
#
# NOTE 10 -- The ROI is a sphere in physical space. Radius is measured in mm,
# applying source spacing separately along i, j, and k. A radius of 12 means a
# 24 mm diameter, not a 12-voxel radius. Transparent overlays show the actual
# sphere-plane intersection, which shrinks away from the centre slice. This
# sphere is only a proposed editing region; no voxel modification occurs here.
#
# NOTE 11 -- The close-up is a box extending this distance from the ROI centre
# along each physical axis. It must be at least the radius to enclose the sphere.
# Use a smaller box to inspect thin structures or a larger box for context; the
# crop is clipped at source-volume boundaries. The renderer limits crop size to
# keep previews bounded. Display coordinates continue to refer to the full
# source volume, so moving or resizing the crop does not change their meaning.
#
# NOTE 12 -- Keep false while locating the ROI. Set true once you have reviewed
# the coordinate placement in the available views. This flag records review of
# this input only: it does not establish patient orientation, approve tissue
# classification, run an operation, or authorize future cohort generation.
#
# NOTE 13 -- "roi" puts all three cross-sections through center_ijk. To inspect a
# neighbouring level without moving the ROI, enter another i, j, k triple. A
# section outside the sphere has no ROI fill; a section outside the crop is
# rejected. The axial section fixes k, the coronal section fixes j, and the
# sagittal section fixes i; these names describe array planes until anatomical
# orientation has been verified.
#
# NOTE 14 -- Opacity ranges from 0 (invisible) to 1 (opaque). overlay_opacity
# controls the ROI fill on 2D sections. volume_opacity controls the selected
# anatomy in the 3D preview; context_opacity controls neighbouring tissue groups.
# Transparency aids visual inspection and does not represent tissue density or
# physical X-ray transmission. Rendered opacity can vary with viewing direction
# and overlapping voxels. These settings never change source label values.
#
# NOTE 15 -- Context is drawn inside the same crop using the named tissue groups.
# Separate multiple names with commas; leave blank for only the selected label.
# Use faint bone or veins as landmarks. Narrow structures may be absent from a
# crop or assigned unknown pending review, so absence from a preview is not
# evidence that the anatomy is absent from the source phantom.
#
# NOTE 16 -- A step of 1 uses native voxel occupancy in the 3D crop. Larger
# integers combine neighbouring voxels with maximum pooling: if any voxel in a
# block belongs to a displayed label, that coarser block displays the label.
# This preserves thin labels at reduced rendering cost, but enlarges their
# displayed extent and can merge apparent gaps. The default is 2. Pooling is
# ONLY for the 3D visualization; source masks and 2D sections stay at native
# resolution. Inspect those sections before judging fine geometry. Transparency
# and pooled occupancy do not validate connectivity or watertight surfaces.
#
# NOTE 17 -- Use a new directory for each saved iteration, for example
# outputs/roi/carotid-v3. Existing populated output directories are refused so
# earlier previews remain available for comparison. The renderer saves
# roi-closeups.png, roi-z-stack.png, roi-volume.html (interactive),
# roi-surfaces.png (static surface view), and
# preview-report.json with resolved parameters, selection details, and provenance.
# Keep the INI alongside your experiment notes; generated JSON is for machines.
#
# QUICK ITERATION -- Run from the FakeCT repository containing this file:
# python3 scripts/preview_roi.py --config configs/examples/xcat-roi.ini
# Add --validate-only to validate inputs without reading the volume data.
# Inspect the close-ups, coordinate axes, ROI intersection, and 3D view. Adjust
# center_ijk, radius_mm, or the selected IDs; choose a new output directory; rerun.
# Once the region is satisfactory, keep that exact input as the reviewed preview
# baseline for the later morphology and cohort-generation milestones.
