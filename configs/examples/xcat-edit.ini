# FakeCT bounded-edit input. Edit the values, save, and rerun preview_roi.py.
# Short hints refer to the numbered NOTES at the bottom of this file.

[study]
schema_version = fakect.edit/1                # NOTE 1: bounded-edit input version
name = xcat-carotid-erosion                  # NOTE 2: name shown in the report

[input]
root = /home/aghorban/slurm/xcat             # NOTE 3: folder containing the cases
case_id = 260602                             # NOTE 4: one source anatomy
frame = 1                                   # NOTE 4: one motion frame
audit = docs/integration/2026-09-16/xcat-results.json # NOTE 5: verified geometry audit
catalog = outputs/tissues/atlas-v1/label-catalog.json  # NOTE 6: anatomy-to-tissue mapping

[selection]
tissue = artery                             # NOTE 7: editable tissue group
source_ids =                                 # NOTE 8: blank selects tissue within the ROI

[roi]
shape = tube                                 # NOTE 18: sphere or ordered variable-radius tube
center_ijk = 404, 360, 1544 ; 404, 363, 1584 ; 401, 362, 1624 # NOTE 9: ordered i,j,k nodes
radius_mm = 4.7, 4.7, 4.5                     # NOTE 10: one millimetre radius per node
crop_half_width_mm = 40                       # NOTE 11: context padding around all nodes
coordinate_reviewed = false                 # NOTE 12: record your coordinate review

[preview]
slice_ijk = roi                              # NOTE 13: sections through ROI centre, or i, j, k
overlay_opacity = 0.22                       # NOTE 14: transparent ROI on slice images
volume_opacity = 0.25                        # NOTE 14: selected-label opacity in 3D
context_tissues = artery, bone, vein           # NOTE 15: show nearby vessels outside selection
context_opacity = 0.08                       # NOTE 14: context opacity in 3D
volume_stride = 2                           # NOTE 16: 3D preview sampling step

[edit]
operation = erosion                         # NOTE 19: none, erosion, or dilation
distance_mm = 1.5                            # NOTE 20: maximum weighted grid distance
profile = gaussian                          # NOTE 21: uniform or spatial Gaussian
profile_axis = tube                         # NOTE 22: position along tube, i, j, or k
shape_k = 10                                # NOTE 23: Gaussian concentration
shape_window = 0.25, 0.75                    # NOTE 24: normalized interval along the axis

[reassignment]
allowed_tissues = soft_tissue, muscle, adipose # NOTE 25: allowed surrounding tissue groups
max_distance_mm = 3                         # NOTE 26: erosion reassignment search limit
unresolved = preserve                       # NOTE 27: preserve original voxels or fail

[output]
directory = outputs/edits/carotid-erosion-v1 # NOTE 17: new directory for this iteration

# -----------------------------------------------------------------------------
# NOTES -- detailed guidance; everything below is a comment.
# -----------------------------------------------------------------------------
# NOTE 1 -- This schema adds bounded morphology to the same ROI workbench.
# Use the same preview_roi.py command. The source volumes are read only; changes
# are written to new crop artifacts together with the original values and
# provenance. This is a local morphology prototype, not a full-volume cohort
# export or an AI background-recovery run. Earlier fakect.preview/1 and /2
# inputs remain preview-only and reject edit/reassignment sections. Unsupported
# sections and misspelled keys fail validation; nothing is silently defaulted.
#
# NOTE 2 -- Give each experiment a short descriptive name using letters, digits,
# underscores, hyphens, or dots. This name helps distinguish saved previews.
#
# NOTE 3 -- All relative paths INSIDE this file are resolved from the FakeCT
# repository containing the preview script, regardless of the shell's current
# directory or where this INI is stored. Absolute paths and ~ are accepted.
# Environment variables such as $HOME are not expanded. Do not quote paths;
# spaces within them are allowed. A space followed by # begins an inline comment.
# Input files are read only; source volumes and dictionaries remain unchanged.
#
# NOTE 4 -- Select one case folder and a positive motion-frame number. A case ID
# is kept as text, including leading zeros. Case/frame geometry and file sizes
# must match the audit. Use per-frame act labels and the matching atn volume;
# averaged act_av intensities are mixtures and cannot serve as categorical IDs.
#
# NOTE 5 -- The audit supplies source dimensions and voxel spacing established
# from the XCAT parameter file and output log. It also records sampling and
# geometry checks. It is not a replacement for verifying anatomical orientation.
# See docs/integration/2026-09-16/ for the original audit and its limitations.
#
# NOTE 6 -- The catalog preserves each signed organ ID, original name, anatomy
# hierarchy, proposed tissue group, mapping evidence, and source hashes. Its JSON
# format is generated metadata: users edit this INI and the tissue policy rather
# than manually editing thousands of catalog records. Anatomical grouping does
# not imply a unique material or attenuation value. Unresolved labels stay
# unknown. Rebuild the catalog after an atlas or policy change; previews record
# the exact catalog used. See docs/TISSUE_MAPPING.md for catalog commands.
#
# NOTE 7 -- Use an exact group name from the catalog. The initial editable policy
# contains soft_tissue, bone, cartilage, muscle, artery, vein, lung, adipose,
# nervous_tissue, and fluid. Some groups may be empty. Arteries and veins cannot
# be distinguished by attenuation thresholds alone. The chosen group filters
# original IDs; it does not replace or discard the original anatomy labels.
#
# NOTE 8 -- Blank source_ids selects all voxels of the chosen tissue inside
# the ROI. The tube can isolate an artery spatially, but does not automatically
# choose one vessel: if two arteries enter the tube, both become candidates.
# Check original-label counts, selected overlays, and before/after views. Enter
# comma-separated signed original IDs to restrict the tissue further if needed;
# each ID must belong to the chosen group. Preserve minus signs. Raw surface
# block indices are not voxel IDs. Geometry editing changes only permitted
# voxels in the new crop output; every original source value stays available.
#
# NOTE 9 -- Coordinates use native, zero-based voxel indices: i is the column,
# j is the row, and k is the slice. Internal arrays use k,j,i (z,y,x). Physical
# patient axes remain unverified. With shape=tube, enter ordered i,j,k triples
# separated by semicolons, all on one line. Their sequence defines the path;
# nodes are never sorted by coordinate. Decimal positions are accepted. At least
# two nodes are required, and adjacent nodes must differ. With shape=sphere,
# enter one i,j,k triple. Preview schema /2 accepts decimal sphere centers too;
# legacy schema /1 requires integers and always uses a sphere. The sample path
# follows a candidate carotid segment in case 260602 frame 1. Its location and
# radius are starting values for review, not an approved intervention region.
#
# NOTE 10 -- For a tube, supply one positive radius in millimetres per node,
# in the same order. Radii interpolate linearly along each straight segment in
# physical space. The tube is the union of these moving balls, including round
# endcaps. Source spacing is applied independently along each axis. The ROI
# controls WHERE editing may happen; radius_mm is separate from distance_mm,
# which controls the requested boundary displacement. For a sphere provide one
# radius. A radius of 4 means an 8 mm diameter. Smaller ROIs can help exclude
# adjacent vessels, but can clip the intended edit; inspect before/after masks.
#
# NOTE 11 -- The crop extends this many millimetres past the minimum and maximum
# centerline-node coordinates on each physical axis. For a sphere there is one
# center. This context margin must be at least the largest ROI radius. The crop
# is clipped to the source volume, and all displayed indices retain their source
# meaning. A longer tube needs a larger crop even with the same margin. Reduce
# padding or split a long path if the bounded renderer rejects the crop size.
#
# NOTE 12 -- Set true once you have reviewed the coordinate placement. This
# flag records your review status; it does not establish patient orientation or
# anatomical/material correctness. The operation setting determines whether the
# command computes a bounded edit or only a preview. The original source files
# remain unchanged in either case.
#
# NOTE 13 -- With slice_ijk=roi, the sections use a rounded center for a sphere
# or a representative point along the tube. Inspect the report's resolved slice
# coordinates; use an explicit integer i,j,k triple to compare exact levels.
# Changing this crosshair does not move the ROI. The axial section fixes k,
# coronal fixes j, and sagittal fixes i; these are array-plane names until
# anatomical orientation is verified. Sections outside the ROI have no orange
# fill, and sections outside the crop are rejected. The z stack samples five
# representative axial levels. Set slice_ijk explicitly to inspect other levels.
#
# NOTE 14 -- Opacity ranges from 0 (invisible) to 1 (opaque). overlay_opacity
# controls the ROI fill on 2D sections. volume_opacity controls the selected
# anatomy in the 3D preview; context_opacity controls neighbouring tissue groups.
# Transparency aids visual inspection and does not represent tissue density or
# physical X-ray transmission. Rendered opacity can vary with viewing direction
# and overlapping voxels. These settings never change source label values.
#
# NOTE 15 -- Context is drawn inside the same crop using the named tissue groups.
# Separate names with commas; leave blank for only the selection. Include the
# selected tissue (artery here) to show other candidate voxels outside the ROI.
# This makes a nearby artery visible even when it is excluded from selection.
# Bone and vein can help with placement. Empty or unresolved groups may not be
# drawn; absence in the preview is not evidence of absent source anatomy.
#
# NOTE 16 -- A step of 1 uses native voxel occupancy in the 3D crop. Larger
# integers combine neighbouring voxels with maximum pooling: if any voxel in a
# block belongs to a displayed label, that coarser block displays the label.
# This preserves thin labels at reduced rendering cost, but enlarges their
# displayed extent and can merge apparent gaps. The default is 2. Pooling is
# ONLY for the 3D visualization; source masks and 2D sections stay at native
# resolution. Inspect those sections before judging fine geometry. Transparency
# and pooled occupancy do not validate connectivity or watertight surfaces.
#
# NOTE 17 -- Save each iteration to a new directory, for example
# outputs/edits/carotid-erosion-v2. Existing populated directories are refused.
# report.html brings together placement views, before/after edit results,
# reassignment statistics, and provenance. Generated crop data retains original
# labels and attenuation alongside the proposed result. Keep the input snapshot
# with that report to reproduce the experiment. operation=none produces the
# usual placement preview without edit artifacts. Generated JSON is metadata;
# edit this INI to change the experiment.
#
# NOTE 18 -- Choose sphere or tube. Sphere uses one center triple and one
# radius. Tube uses ordered semicolon-separated triples and a comma-separated
# radius per node. Nodes define straight segments with linearly varying radii
# and round caps. Node order is preserved, including bends and loops; repeated
# consecutive nodes are rejected. The 3D orange tube is extracted from the
# native ROI voxel mask, whereas contextual anatomy may be display-downsampled.
# The ROI includes every matching tissue voxel it intersects; it does not stop
# at vessel connectivity boundaries. Tighten or reposition the tube if an
# unwanted branch or nearby artery enters the selected region.
#
# NOTE 19 -- none generates a placement preview without requesting a geometry
# change. erosion shrinks the selected tissue by releasing boundary voxels;
# dilation expands it by borrowing permitted surrounding voxels. Operations are
# evaluated by six-neighbor voxel propagation, weighted by physical axis step,
# and bounded by the ROI. Distances therefore follow the voxel graph rather than
# unrestricted Euclidean diagonals. Unselected anatomy and voxels outside the
# permitted region remain unchanged. Requested
# and accepted changes can differ when no permitted reassignment is available.
#
# NOTE 20 -- distance_mm is a positive physical displacement for erosion or
# dilation. Zero is accepted for operation=none. It is not a stenosis percentage,
# a diameter scaling factor, or an iteration count. The profile multiplies this
# maximum distance at each position. Discrete voxel geometry means a small
# positive distance may produce no change, and an excessive erosion distance
# may remove a thin selected segment. Review the realized geometry and counts.
#
# NOTE 21 -- uniform applies the same requested distance across the ROI.
# gaussian uses the shape_k/shape_window idea from the phantom workflow as a
# SPATIAL profile along a physical axis or tube path. This adapts that Gaussian
# control to position rather than replaying legacy GUI iterations. It tapers the
# displacement within the configured window; outside it, no edit is requested.
# This model uses bounded propagation on the native six-neighbor voxel graph.
# The legacy GUI deformation and this spatial model need not behave identically.
#
# NOTE 22 -- With a Gaussian profile, tube uses normalized cumulative physical
# path length from the first to last ordered centerline node and requires a tube
# ROI. i, j, or k instead use a native coordinate axis normalized across the ROI.
# These axes are grid indices, not verified anatomical directions. This option
# has no effect for a uniform profile. Bends and self-approaching paths can make
# the nearest centerline location ambiguous; inspect the resulting edit map.
#
# NOTE 23 -- shape_k must be positive. It controls the concentration of the
# Gaussian spatial profile around its center: larger values make the profile
# narrower. It is not the source slice index k, voxel spacing, or a tissue ID.
# Inspect the report's profile and before/after views when changing this value.
#
# NOTE 24 -- shape_window contains exactly two ordered values between 0 and 1:
# start, end. For example 0.25,0.75 places the Gaussian within the middle half
# of the path or ROI axis. The profile is zero outside this interval. The values
# refer to normalized physical position, not absolute i,j,k indices. With a
# uniform profile this setting is retained as metadata but does not shape the
# displacement. The start must be strictly smaller than the end.
#
# NOTE 25 -- Explicitly list tissue groups allowed to participate in reassignment.
# In erosion, they identify recipient tissues that may occupy released target
# voxels. In dilation, they identify donor tissues from which the target may
# borrow voxels. All other tissues are protected. Blank means allow none, never
# allow all. Unknown labels and unresolved mappings are not silently converted
# to soft tissue. Replacement values come from actual original source seeds:
# a recipient seed for erosion or a selected target seed for dilation. Their
# original signed labels and paired attenuation scalars are copied; coarse group
# IDs are never written in place of organ IDs. Some groups, such as adipose, may have
# no assigned anatomical labels even when fat-like scalar values are present.
#
# NOTE 26 -- For erosion, max_distance_mm limits the reassignment search from
# released voxels to allowed surrounding recipient tissue. Distance follows
# six-neighbor physical axis steps. A larger limit may assign more released
# voxels, but can copy values from more distant anatomy. Dilation uses its own
# spatial distance_mm growth budget; ownership follows the accepted growth
# frontier, so this erosion search limit does not cap dilation. Replacement
# labels and paired scalars are copied from actual original source seeds.
# This scalar transfer is an attenuation proxy, not learned background recovery,
# CT reconstruction, or proof of material correctness. Originals remain saved.
#
# NOTE 27 -- For erosion, preserve retains original target voxels that lack an
# eligible recipient; error rejects that trial before writing outputs. Dilation
# always preserves blocked proposals and reports them; this option does not turn
# blocked dilation into an error. Neither option invents replacement labels or
# relaxes protected tissue rules. Inspect requested and accepted counts together.
#
# QUICK ITERATION -- Run from the FakeCT repository containing this file:
# python3 scripts/preview_roi.py --config configs/examples/xcat-edit.ini
# Add --validate-only to validate input and geometry without reading crop voxels.
# Start with operation=none to review placement. Then choose erosion or dilation,
# inspect before/after views and reassignment counts, adjust the profile or ROI,
# choose a new output directory, and rerun. Keep each saved input with its report.
