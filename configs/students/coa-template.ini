# Student CoA-shaped software example. Created by scripts/student_demo.py.
# Mathematical tubes are not patient anatomy or licensed XCAT data.

[study]
schema_version = fakect.recipe-cohort/1        # NOTE 1: generation only
name = student-{case_id}                     # NOTE 1

[input]
root = {source_root}                        # NOTE 2: generated phantom storage
case_id = {case_id}                          # NOTE 2
frame = 1                                   # NOTE 2
audit = {audit}                             # NOTE 2: dimensions and spacing
catalog = {catalog}                         # NOTE 3: original IDs to tissue types

[selection]
tissue = artery                             # NOTE 3: IDs are optional
source_ids =                                # NOTE 3: empty selects this category

[roi]
shape = tube                                # NOTE 4: ordered controls
center_ijk = {centers}                       # NOTE 4: i,j,k triples separated by ;
radius_mm = {radii}                          # NOTE 4: one radius per control
crop_half_width_mm = 14                      # NOTE 5: source context for edits
coordinate_reviewed = false                  # NOTE 6: set after inspecting every control

[preview]
mode = full                                 # NOTE 7: CLI override for ROI selection
content = attenuation                       # NOTE 7: attenuation or labels
slice_ijk = roi                              # NOTE 7
overlay_opacity = 0.20                       # NOTE 7
volume_opacity = 0.25                        # NOTE 7
context_tissues = artery,soft_tissue,bone     # NOTE 7
context_opacity = 0.08                       # NOTE 7
volume_stride = 3                           # NOTE 7: full report only

[recipe]
roi_role = selection                        # NOTE 8: growth may leave the seed ROI
steps = ascending_expand, arch_narrow, coa_narrow # NOTE 8: serial within each sibling
overlap = sequential                        # NOTE 8

[edit.ascending_expand]
roi = main                                  # NOTE 9: reuse one tube
path_percent = 5,30                          # NOTE 9: physical tube length
operation = dilation                        # NOTE 10
distance_mm = 2.0                           # NOTE 10: requested maximum per pass
iterations = 1                              # NOTE 10
profile = uniform                           # NOTE 10: start simple
profile_axis = tube                         # NOTE 10
shape_k = 6                                 # NOTE 10: used by Gaussian profiles
shape_window = 0,1                          # NOTE 10
direction = all                             # NOTE 10: circumferential

[edit.arch_narrow]
roi = main                                  # NOTE 9
path_percent = 35,60                        # NOTE 9
operation = erosion                         # NOTE 10
distance_mm = 2.0                           # NOTE 10
iterations = 1                              # NOTE 10
profile = uniform                           # NOTE 10
profile_axis = tube                         # NOTE 10
shape_k = 6                                 # NOTE 10
shape_window = 0,1                          # NOTE 10
direction = all                             # NOTE 10
assign_surrounding_tissue = true             # NOTE 11: valid paired attenuation
preserve_connectivity = true                # NOTE 12: opt-in safeguard
min_volume_ratio = 0.30                      # NOTE 12: active local segment
backoff_factor = 0.5                        # NOTE 12
max_backoff_steps = 6                       # NOTE 12

[edit.coa_narrow]
roi = main                                  # NOTE 9
path_percent = 70,85                        # NOTE 9
operation = erosion                         # NOTE 10
distance_mm = 2.0                           # NOTE 10
iterations = 1                              # NOTE 10
profile = uniform                           # NOTE 10
profile_axis = tube                         # NOTE 10
shape_k = 6                                 # NOTE 10
shape_window = 0,1                          # NOTE 10
direction = all                             # NOTE 10
assign_surrounding_tissue = true             # NOTE 11
preserve_connectivity = true                # NOTE 12
min_volume_ratio = 0.30                      # NOTE 12
backoff_factor = 0.5                        # NOTE 12
max_backoff_steps = 6                       # NOTE 12

[reassignment]
mode = stiffness                            # NOTE 11
allowed_tissues =                           # NOTE 11: stiffness governs all categories
max_distance_mm = 3                        # NOTE 11
unresolved = preserve                       # NOTE 11

[stiffness]
default = 0.05                              # NOTE 11
bone = 1.0                                  # NOTE 11: protected
skin = 0.95                                 # NOTE 11: strongly resistant
soft_tissue = 0.05                           # NOTE 11
artery = 0.05                               # NOTE 11

[train]
stage = preview                             # NOTE 13: generation stages
preflight_directory = {case_output}/preflight-r1 # NOTE 13
freeze_directory = {case_output}/freeze-r1   # NOTE 13
dataset_directory = {case_output}/pairs-r1   # NOTE 13
anatomy_family = synthetic-{case_id}         # NOTE 14: software example only
target_scope = selected_lineage             # NOTE 8
include_baseline = true                      # NOTE 13
max_variants = 16                           # NOTE 15: bounded Cartesian sweep
image_method = attenuation_copy_proxy        # NOTE 16: not physical CT reconstruction
parameters_reviewed = false                 # NOTE 6

[sweep.ascending_expand]
distance_mm = 0,2                            # NOTE 15
[sweep.arch_narrow]
distance_mm = 0,2                            # NOTE 15
[sweep.coa_narrow]
distance_mm = 0,2                            # NOTE 15

[output]
directory = {case_output}/review-r1          # NOTE 13: new directory for each preview

# NOTES
# 1. One INI describes source, target, ROI and all sibling edits. Model fitting
#    uses model.ini separately and cannot regenerate or modify published data.
# 2. Source arrays are float32 in k,j,i order; coordinates are native i,j,k.
#    The audit pins source geometry. Use matched ACT/ATN frames for real XCAT.
# 3. Choose a tissue category without knowing original surface IDs. Optional
#    source_ids/anatomical selection can refine a crowded target in real data.
# 4. First point starts the tube. Do not sort by k. Inspect each control's three
#    native planes and perpendicular cross-section before adjusting its radius.
#    Semicolons separate controls; commas separate coordinates or radii.
# 5. Context expands the source crop, not the original selected target. It must
#    cover edit distance and label-reassignment halo; source bounds remain fixed.
# 6. Review flags are explicit assertions, not automated anatomical approval.
#    Set coordinate_reviewed after ROI inspection; parameters_reviewed after
#    checking native preflight. Never use the smoke fixture as clinical evidence.
# 7. Run prepare_cohort.py --stage preview --preview-mode roi-selection for the
#    simple four-panel report. --preview-mode full shows before/after edits.
#    Choose a new output.directory each time; display settings never edit data.
# 8. ROI selects original artery voxels. Lineage tracks surviving target voxels
#    and permitted descendants outside that ROI. Every sibling starts from the
#    same original; steps within a sibling execute serially.
# 9. path_percent selects a physical arc-length interval on the main tube, so
#    multiple edits can reuse the same path without duplicating ROI definitions.
# 10. distance_mm is a budget, not guaranteed displacement or disease severity.
#     Profiles, stiffness, native voxelization and safeguards determine outcome.
#     Gaussian/inner/outer options are available after the simple example works.
# 11. Dilation borrows permitted voxels; erosion releases them to eligible
#     neighbors. Copying attenuation from the selected donor is an explicit proxy.
#     Bone cannot be borrowed. Diagnostic released labels are for debugging only.
# 12. Safeguards are per edit. They reduce requested erosion when local volume
#     or connectivity fails; inspect the accepted distance in preflight output.
# 13. Validate metadata, execute every combination with preflight, review, freeze,
#     then prepare pairs. Freeze pins exact input bytes and generation dependencies.
#     Any changed frozen input requires new revision directories.
# 14. These three mathematical geometries illustrate family-isolated software
#     splits. They do not establish biological independence or model performance.
# 15. The 2x2x2 sweep gives eight edited recipes plus baseline. Zero/identical
#     results are reported and remain related; do not count them as new patients.
# 16. Paired inputs are attenuation in cm^-1 and binary target masks. Changed
#     masks, edited IDs, ancestry and per-step counts remain in the export.
#     Compare sibling and baseline target masks to derive net addition/removal.
