# Run from the fakect.26.09.16 worktree. Numbered notes explain each setting.
# python3 scripts/train_coa_pilot_control.py --config configs/models/coa-focused-pilot-lr-control.ini --validate-only
# python3 scripts/train_coa_pilot_control.py --config configs/models/coa-focused-pilot-lr-control.ini --stage plan
# sbatch scripts/slurm/fakect_coa_pilot_control_gpu.sh configs/models/coa-focused-pilot-lr-control.ini

[experiment]
schema_version = fakect.coa-focused-pilot-control/1 # NOTE 1
output_directory = outputs/experiments/coa/focused-pilot-lr-control-r1 # NOTE 1

[reference]
experiment_directory = outputs/experiments/coa/focused-pilot-r1 # NOTE 2

[training]
epochs = 50                                # NOTE 3
learning_rate = 0.0003                      # NOTE 4
seed = 42                                  # NOTE 5
cache_limit_mb = 5120                       # NOTE 6
host_memory_limit_mb = 12288                # NOTE 7
gpu_memory_limit_mb = 12288                 # NOTE 7
require_gpu = true                         # NOTE 7

# NOTE 1 — This separate immutable revision changes exactly one training factor.
# Planning verifies the completed reference, copies runtime sources and pins
# model, data, history, predictions and integrity checks. report.html is the
# report entry point. Frozen changes require a new revision and new planning.
#
# NOTE 2 — The completed 50-epoch pilot supplies the exact 32 training images
# and eight validation images, family assignments, normalization, architecture,
# regression weighting, frozen locator and reviewed native crop origins.
# Reference validation need not pass an accuracy gate: this run is designed to
# assess that limitation. Both references inherit the passed 200-epoch training
# diagnostic. Reserved test phantoms and siblings remain entirely excluded.
#
# NOTE 3 — The budget is fixed to 50 epochs, 16 balanced same-phantom batches of
# two per epoch, 800 optimizer updates and 1600 training image presentations.
# The minimum VALIDATION BCE selects the checkpoint, as in the reference.
# These are development results; the eight validation images are not independent
# patients. CoA-positive still means at least 20% achieved local target-volume
# loss, a provisional engineering definition rather than a clinical threshold.
#
# NOTE 4 — The only intentional training difference is Adam learning rate:
# 0.001 in the reference, 0.0003 here. The contract rejects a different rate or
# budget and any change to other training settings. Classification BCE and
# weighted Huber severity loss, clipping and model width remain identical.
#
# NOTE 5 — Fresh weights and a fresh seeded shuffle are required. Initial weights
# must match the reference's fingerprint; no trained classifier checkpoint or
# optimizer state is reused. Training pairs remain balanced; inference requires
# just one scan. Predictors are two 0.6-mm attenuation/validity crops only.
#
# NOTE 6 — The same 40 normalized samples require 4860 MiB in the 5120 MiB cache.
# It is transient RAM; no extra whole-body or high-resolution training datasets
# are exported. The new production-size GPU smoke holds a full physically
# touched cache while exercising gradient updates and classifier reload before
# the separate fit process replays all 40 crop origins and loads the real cache.
#
# NOTE 7 — The same 12 GiB application limits and one-GPU, four-CPU, 16 GiB host,
# four-hour Slurm request are retained. Source, resource, reload, crop and cache
# gates must pass for this control's own lock before training starts.
