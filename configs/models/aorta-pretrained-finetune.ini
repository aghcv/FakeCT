# Controlled population comparison after a known thoracic-aorta region is supplied.
[experiment]
schema_version = fakect.pretrained-finetune/1        # NOTE 1
output_directory = outputs/experiments/aorta/pretrained-finetune-r1 # NOTE 1
target_review_status = engineering_proxy             # NOTE 1

[population]
manifest = outputs/cohorts/aorta/diversity-r2/dataset-manifest.json # NOTE 2
core_census = outputs/analysis/aorta/pretrained-core-census-r1/census.json # NOTE 2
train_siblings_per_case = 16                         # NOTE 3
evaluation_siblings_per_case = 12                    # NOTE 3
family_reference = outputs/experiments/aorta/focused-change-r1/experiment-lock.json # NOTE 4

[model]
model_lock = outputs/pretrained/totalseg-2.18.0/model-lock.json # NOTE 5
environment_directory = outputs/environments/totalseg-r1 # NOTE 5

[input]
spacing_mm = 1.5                                    # NOTE 6
padding_xy_mm = 40                                  # NOTE 6
context_z_mm = 50                                   # NOTE 6

[training]
updates = 2000                                     # NOTE 7: patch updates, not whole-cohort epochs
learning_rate = 0.0001                              # NOTE 7
weight_decay = 0.0001                               # NOTE 7
seed = 42                                          # NOTE 7
control_fraction = 0.25                             # NOTE 8: original controls in the sibling arm
foreground_fraction = 0.75                          # NOTE 8: shared baseline-derived patch schedule
report_every = 100                                  # NOTE 7

[evaluation]
surface_tolerance_mm = 1                            # NOTE 9
boundary_margin_mm = 2                              # NOTE 9
local_context_mm = 5                                # NOTE 9

[runtime]
maximum_gpu_allocated_mib = 14000                   # NOTE 10: V100 16 GB
maximum_host_rss_mib = 24576                        # NOTE 10

# NOTE 1 — This is a region-assisted development comparison with provisional
# atlas boundaries. Original studies/data/weights remain immutable. Plan a new
# output revision before changing a frozen input. No clinical disease grading
# is inferred from synthetic voxel counts.
# NOTE 2 — Shared native attenuation and sparse sibling overlays remain the
# source. The census contains EXACT added/removed AORTA CORE voxel counts,
# excluding proximal branch segments and original disconnected label islands.
# Native counts are shown directly, alongside spacing and physical mm3.
# NOTE 3 — The sibling arm adds 16 distinct variants per TRAIN phantom, spanning
# addition-only, removal-only and mixed changes. Each held-out phantom supplies
# its original plus 12 fixed burden-spanning siblings. Unchanged/duplicate
# siblings do not replace positive morphological diversity. Rosters are frozen
# before predictions. Histograms can include the complete generated population.
# NOTE 4 — Reuse five conservative anatomy-family assignments. Every sibling
# stays with its source phantom, and paired age families stay together. These
# folds are development cross-validation, not a pristine clinical test.
# NOTE 5 — Strictly load the complete original 19-channel cardiac nnU-Net,
# including ALL pretrained heads; aorta is channel 2. Both training arms start
# from identical complete weights with fresh AdamW. CT is the only input.
# NOTE 6 — Fixed original atlas region +40 mm XY and thoracic slab +50 mm Z;
# identical for unmodified weights and both fine-tuned arms. Native L/P/S arrays
# become canonical R/A/S model tensors. Audit native-to-model-to-native target
# fidelity before training. Normalization uses the checkpoint's original CT
# statistics. Returning native predictions cannot restore erased thin lumens.
# NOTE 7 — Fixed 2,000 batch-one 128-cubed patch updates in each arm/fold.
# This preserves a 192 mm physical patch at 1.5 mm. No held-out checkpoint
# selection or early stopping. A production gradient/reload smoke determines
# memory feasibility before any study fits. Unmodified weights are evaluated
# under the SAME new preprocessing/tiling protocol, not the old automatic crop.
# NOTE 8 — Both arms share case order, baseline-derived patch positions and
# augmentation policy. Only image/anatomy variation changes. Sibling-arm
# controls retain 25% of updates. Known change masks never enter inference.
# Loss supervision ignores visible context outside the annotated thoracic slab.
# NOTE 9 — Show whole-core and change-local Dice/recall/surface error plus
# component statistics, and same-scan zooms of reference/pretrained/both tuned
# outputs. Separate removed-voxel and added-voxel performance profiles and
# histograms; average within phantom before aggregating correlated siblings.
# NOTE 10 — Sparse MODEL-grid delta caches share each case's baseline volume.
# No complete whole-body sibling images are generated. All large artifacts
# remain outside Git. Host/GPU guards are checked on actual production patches.
