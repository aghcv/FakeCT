# First check: can the new image-only model learn a known training patch?
# python3 scripts/train_context_aorta.py --config THIS_FILE --validate-only
# Run fitting through scripts/slurm/fakect_context_gpu.sh on an allocated GPU.

[experiment]
schema_version = fakect.context-experiment/1 # NOTE 1
scope = engineering                         # NOTE 1
mode = diagnostic                           # NOTE 2
output_directory = outputs/experiments/coa/context-diagnostic-r3 # NOTE 3

[data]
manifest = outputs/datasets/coa/context-aorta-r1/dataset-manifest.json # NOTE 4
allow_provisional_anatomy = true             # NOTE 4

[split]
strategy = holdout                          # NOTE 5
case_counts = 8,2,2                         # NOTE 5
seed = 42                                  # NOTE 5

[model]
architecture = unet3d                      # NOTE 6
patch_size_kji = 128,96,96                  # NOTE 6
target_spacing_mm = 1,1,1                  # NOTE 6: physical i,j,k spacing
base_filters = 8                          # NOTE 7
depth = 3                                 # NOTE 7
batch_size = 1                            # NOTE 7
epochs = 40                               # NOTE 8
learning_rate = 0.001                      # NOTE 8
seed = 42                                 # NOTE 8
patches_per_volume = 4                     # NOTE 9: cohort mode only
foreground_fraction = 0.5                  # NOTE 9
augmentation_flip = false                 # NOTE 10
intensity_scale_range = 1,1                # NOTE 10
clip_min = 0                              # NOTE 11
clip_max = 0.5                            # NOTE 11
threshold = 0.5                           # NOTE 12
save_predictions = false                  # NOTE 12: diagnostic patch still saved
diagnostic_steps_per_epoch = 8             # NOTE 2
diagnostic_sample_id = 260613:baseline     # NOTE 2: must be in training partition

# NOTE 1 — Attenuation -> broader atlas-defined thoracic aorta and proximal
# branches. This is a new Model 1 experiment, independent of shape recovery.
# No original data, prior models or old experiment implementation is replaced.
#
# NOTE 2 — Diagnostic mode repeatedly fits one fixed patch from a TRAINING
# sample and evaluates that same patch. High Dice here only verifies learning
# and geometry plumbing; it is not an unseen-anatomy accuracy result. Held-out
# images are not inputs to fitting. Forty epochs x eight updates = 320 updates.
#
# NOTE 3 — Use a fresh experiment directory for changed inputs or code. The
# plan freezes this INI, source identities, family split and implementation.
# Partial outputs are preserved for inspection, not silently overwritten.
#
# NOTE 4 — First run prepare_context_cohort.py. Its manifest references original
# whole-body attenuation, existing edited crops and new compact target masks.
# Source ACT/ATN binaries remain immutable. Thoracic boundaries currently use
# the explicit provisional T12-midpoint/T1-upper policy and proximal branches;
# this flag permits an engineering diagnostic before anatomical review.
#
# NOTE 5 — All related phantom IDs and their siblings stay together. This
# preserves the prior 8/2/2 case split, with provisional families grouped.
# A diagnostic never turns a test sample into a training sample.
#
# NOTE 6 — k is the slice direction, then j rows, i columns. At 1 mm spacing
# this patch sees 128 x 96 x 96 mm, versus the old 38.4 mm cube. The source
# volume is sampled by physical coordinates with a native edit overlay. No
# full-body copy is created per sibling. Image interpolation is linear and
# labels nearest-neighbor; voxel centers outside the scan are excluded.
#
# NOTE 7 — Three-level volumetric encoder/decoder with skip connections.
# More context increases memory use. Validate patch divisibility, and profile
# on the GPU before a full cohort run. This is not yet a coarse/fine cascade.
#
# NOTE 8 — Optimizer controls affect fitting only, never cohort geometry.
# Diagnostic checkpoint selection uses its training diagnostic criterion;
# ordinary cohort runs select checkpoints on separate validation cases.
#
# NOTE 9 — Cohort training balances target-centered and uniformly positioned
# whole-scan patches. It does not preferentially sample lesion edit masks.
# Validation/testing tile the full available scan with the same protocol.
#
# NOTE 10 — Disable augmentation for the first fit diagnostic. Paired flips
# and bounded intensity scaling are available in the cohort example. These
# operations do not make synthetic attenuation into realistic clinical CT.
#
# NOTE 11 — Stored images are attenuation in cm^-1, not HU. Fixed clipping
# and scaling are applied after source/crop units are reconciled.
#
# NOTE 12 — Threshold applies to predicted aorta occupancy. Full-body
# probability files are disabled to avoid unnecessary storage; evaluation
# accumulates voxel counts. The diagnostic saves one small prediction bundle.
