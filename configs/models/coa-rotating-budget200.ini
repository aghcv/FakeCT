# Fixed-budget control for the completed five-family CoA evaluation.
# python3 scripts/train_coa_budget.py --config configs/models/coa-rotating-budget200.ini --validate-only
# python3 scripts/train_coa_budget.py --config configs/models/coa-rotating-budget200.ini --stage plan

[experiment]
schema_version = fakect.coa-budget-control/1  # NOTE 1: independent frozen experiment
output_directory = outputs/experiments/coa/rotating-budget200-r1 # NOTE 1: preserve previous results

[reference]
experiment_directory = outputs/experiments/coa/rotating-evaluation-r2 # NOTE 2: exact completed folds and crops

[training]
classifier_epochs = 200                     # NOTE 3: fresh fitting; final epoch is evaluated
checkpoint_interval = 50                    # NOTE 4: archive 50, 100, 150, 200

# NOTE 1 — Plan freezes the input, code, parent metadata, fold locators and crop
# audits. After planning, use a new output_directory for any changed input.
# Arrays and model files remain outside Git. No whole-body siblings are copied.
#
# NOTE 2 — This control uses only the five primary family-holdout refits. Each
# retains its completed locator and exact training/evaluation crop coordinates.
# All sibling exclusions and the unopened infant family are inherited. The
# classifier starts from the same seed and initial weights, with a fresh Adam
# optimizer. No previous trained classifier or optimizer state is loaded.
# Learning rate, loss weights, architecture, resolution, labels and paired
# sample order stay fixed. This input changes only the final epoch budget.
#
# NOTE 3 — Epoch 200 is declared before this run. There is no early stopping,
# intermediate held-out scoring, or selection of an epoch from the outer folds.
# These folds have already informed development; they are development cross-
# validation, not an untouched final test. The reserved infant pair stays closed.
# More training may improve fitting without improving unseen-anatomy results.
#
# NOTE 4 — The interval must divide classifier_epochs. Archived .keras files
# preserve model weights for inspection; they are not optimizer-resume states.
# Training metrics are recorded every epoch. The final report compares the
# previous budget with epoch 200 on the identical selected scenarios.
