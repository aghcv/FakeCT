# Bounded engineering pilot: shared coarse anatomy + image-selected fine detail.
# python3 scripts/train_multiscale_coa_v2.py --config configs/models/coa-multiscale-pilot-v2.ini --validate-only
# python3 scripts/train_multiscale_coa_v2.py --config configs/models/coa-multiscale-pilot-v2.ini --stage plan
# sbatch scripts/slurm/fakect_multiscale_v2_gpu.sh configs/models/coa-multiscale-pilot-v2.ini

[experiment]
schema_version = fakect.multiscale-pilot/2 # NOTE 1
output_directory = outputs/experiments/coa/multiscale-pilot-r2 # NOTE 2

[data]
manifest = outputs/datasets/coa/context-aorta-r1/dataset-manifest.json # NOTE 3
annotations = outputs/labels/coa/provisional-volume-r1/labels.json # NOTE 4
annotation_use = accepted_engineering_proxy # NOTE 4
allow_provisional_anatomy = true             # NOTE 3

[split]
case_counts = 8,2,2                         # NOTE 5
seed = 42                                  # NOTE 5

[input.overview]
shape_kji = 160,96,96                       # NOTE 6
cache_directory = outputs/cache/multiscale-overview-r1 # NOTE 6
max_chunk_voxels = 4000000                  # NOTE 6

[input.detail]
shape_kji = 216,160,160                     # NOTE 7
spacing_ijk_mm = 0.6,0.6,0.6                # NOTE 7
proposals = 2                              # NOTE 7

[model]
base_filters = 4                           # NOTE 8
learning_rate = 0.001                       # NOTE 8
seed = 42                                  # NOTE 8
clip_min = 0                               # NOTE 9
clip_max = 0.5                             # NOTE 9

[pilot]
locator_epochs = 120                        # NOTE 10
classifier_epochs = 10                     # NOTE 11
minimum_changed_coverage = 0.90             # NOTE 12
gpu_memory_limit_mb = 12288                 # NOTE 13
require_gpu = true                         # NOTE 13

# NOTE 1 — This first implementation tests loading, anatomy localization and
# multi-case learning. It is not the final virtual-population comparison.
# No test images or masks are read by prepare/fit. No synthetic data are generated.
#
# NOTE 2 — Freeze an unused output directory with --stage plan before submitting.
# Input, cohort, annotation and source-code hashes are pinned. A change needs a
# new revision. A failed stage leaves its artifacts available for diagnosis.
#
# NOTE 3 — Whole-body attenuation stays shared. Only existing edited crops are
# overlaid. Anatomical mask boundaries and family assignments remain provisional.
#
# NOTE 4 — Explicitly accept the reviewed 20% LOCAL TARGET VOLUME LOSS proxy
# for this engineering pilot. The source labels stay immutable and draft; this
# setting does not assert clinical CoA diagnosis. The 18–22% review flag remains.
# Below-threshold edited cases contain mild induced narrowing and other edits.
#
# NOTE 5 — All relatives and siblings stay together. Seed42 reserves infant
# anatomy for future testing, adult anatomy for validation, and the remaining
# four families for training. The pilot takes four balanced scenarios per
# development case: original, lowest edited negative, lowest and highest positive.
# The three edited samples share the lowest dilation and all companion settings.
# Test predictions are deliberately absent from this engineering runner.
#
# NOTE 6 — The maximum array is padded to this shape, without stretching anatomy.
# Integer box averaging streams native voxels in bounded chunks, with exact
# partial-cell averaging. One shared base cache is used per native source/grid;
# sibling changes are composed before clipping. This is a box antialias filter,
# not a claim of ideal frequency rejection. Feature activations are not cached.
#
# NOTE 7 — An attenuation-trained locator predicts thoracic-aorta bounds. Two
# patches are centered at25%/75% of their longitudinal extent. The physical
# patch spans129.6x96x96mm. Masks/ROIs NEVER move the model's predicted crops.
# The classifier consumes images and coarse features aligned to actual crops.
#
# NOTE 8 — Compact 3D encoders, frozen locator context, shared detail weights,
# binary logit and continuous local-volume-loss heads. Batch size is one scan
# (two detail proposals). The initial pilot has no stochastic augmentation;
# first demonstrate learning on a fixed multi-case panel before expanding it.
#
# NOTE 9 — Attenuation cm^-1, not HU. Identical fixed scaling at both resolutions.
# Validity is a second image channel, distinguishing real zero values from pad.
#
# NOTE 10 — Train locator on ORIGINAL training scans only. Choose its checkpoint
# by validation bounding-box loss, freeze it, and propose crops independently
# for every selected sibling. Label-derived bounds are supervision/QA only.
#
# NOTE 11 — Choose classifier checkpoint by validation BCE, retain continuous
# error and edited-negative metrics. Training-panel separation is an explicit
# readiness check; training loss alone or a one-patch fit is insufficient.
#
# NOTE 12 — Coverage is measured on native masks using the union of predicted
# patches. Every changed case must meet this fraction, and all net-removed
# voxels must be covered. A failure stops the classifier and saves a report;
# net-versus-per-step count identities must prove no canceled edits are hidden.
# missing locations are not silently replaced by ground-truth crop coordinates.
#
# NOTE 13 — Apply TensorFlow's GPU allocation cap before initialization. The
# initial job requests16GiB host memory and oneGPU. Report observed GPU/host
# peaks; the configured GPU limit is a cap, not a measured memory requirement.

[training]
locator_learning_rate = 0.0003             # NOTE 14
minimum_target_coverage = 0.90             # NOTE 15
host_memory_limit_mb = 12288                # NOTE 16
maximum_traces = 1                         # NOTE 16

# NOTE 14 — Stable raw-parameter loss and original-training-only mean bounds
# initialize the locator. Validation never contributes to that prior.
# Compare learned localization with the constant prior in the report.
#
# NOTE 15 — Require this fraction of BOTH before and after anatomical masks
# in every scenario, including unmodified originals. Other change gates remain.
#
# NOTE 16 — Train with fixed-signature tensor functions, one trace per function.
# Sample Linux resident memory before/after each training batch and fail above
# this cap. This is an application guard; it cannot prevent one transient large
# allocation between samples. Slurm still requests16GiB; do not increase it to
# hide a growing trace cache. GPU allocation remains capped separately.
