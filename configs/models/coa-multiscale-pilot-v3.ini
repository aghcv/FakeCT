# Run from the fakect.26.09.16 worktree. Detailed numbered notes follow the inputs.
# python3 scripts/train_multiscale_coa_v3.py --config configs/models/coa-multiscale-pilot-v3.ini --validate-only
# python3 scripts/train_multiscale_coa_v3.py --config configs/models/coa-multiscale-pilot-v3.ini --stage plan
# sbatch scripts/slurm/fakect_multiscale_v3_gpu.sh configs/models/coa-multiscale-pilot-v3.ini

[experiment]
schema_version = fakect.multiscale-pilot/3   # NOTE 1
output_directory = outputs/experiments/coa/multiscale-pilot-r3 # NOTE 1

[data]
manifest = outputs/datasets/coa/context-aorta-r1/dataset-manifest.json # NOTE 2
annotations = outputs/labels/coa/provisional-volume-r1/labels.json # NOTE 2
annotation_use = accepted_engineering_proxy # NOTE 2
allow_provisional_anatomy = true            # NOTE 2

[split]
case_counts = 8,2,2                         # NOTE 3
seed = 42                                  # NOTE 3

[input.overview]
shape_kji = 160,96,96                       # NOTE 4
cache_directory = outputs/cache/multiscale-overview-r1 # NOTE 4
max_chunk_voxels = 4000000                  # NOTE 4

[input.detail]
shape_kji = 216,160,160                     # NOTE 5: base block before margins
spacing_ijk_mm = 0.6,0.6,0.6                # NOTE 5
margin_mm_ijk = 9.6,9.6,0                   # NOTE 5: added on EACH side
proposals = 2                              # NOTE 5

[model]
base_filters = 4                           # NOTE 6
learning_rate = 0.001                       # NOTE 6: CoA classifier
seed = 42                                  # NOTE 6
clip_min = 0                               # NOTE 7
clip_max = 0.5                             # NOTE 7

[pilot]
locator_epochs = 120                        # NOTE 8
classifier_epochs = 10                     # NOTE 9
minimum_changed_coverage = 0.90             # NOTE 10
gpu_memory_limit_mb = 12288                 # NOTE 11
require_gpu = true                         # NOTE 11

[training]
locator_learning_rate = 0.0003             # NOTE 8
minimum_target_coverage = 0.90              # NOTE 10
host_memory_limit_mb = 12288                # NOTE 11
maximum_traces = 1                         # NOTE 11

[augmentation]
translate_fraction_kji = 0.08,0.06,0.06     # NOTE 12
scale_range = 0.85,1.15                     # NOTE 12
crop_fraction_max = 0.12                   # NOTE 12
samples_per_case = 2                       # NOTE 12: in addition to original

[robustness]
translation_fraction = 0.04                # NOTE 13: fixed +/- probes per axis
maximum_relative_error = 0.50              # NOTE 13

# NOTE 1 — New immutable experiment revision. Planning pins input, dataset,
# annotations and implementation hashes. Changed inputs require a new output
# directory. Existing r1/r2 experiments and frozen source remain available.
#
# NOTE 2 — Shared whole-body attenuation plus immutable native crop overlays.
# No new full-body sibling arrays are written. Positive CoA means at least20%
# achieved local target-volume loss in the CoA edit region. This is a provisional
# engineering label, not a clinical diagnosis or minimum cross-sectional area.
#
# NOTE 3 — The same family-preserving split and40-scenario panel as r2:
# eight training phantoms, two validation phantoms, two reserved test phantoms.
# Each development case has original, edited negative, low/high positive.
# No test image, mask or prediction is consumed by this pilot. Validation is
# used for development and checkpoint selection, not independent evaluation.
#
# NOTE 4 — Streamed antialiased whole-body overview with fractional acquisition
# validity as the second channel. Physical spacing is retained; padding does
# not stretch anatomy. Existing shared caches are reused across siblings.
#
# NOTE 5 — k,j,i is array order; i,j,k is physical spacing/margin order.
# margin_mm_ijk adds the requested distance on BOTH sides of each base block.
# Outward rounding to four voxels per side keeps dimensions divisible by8.
# These settings give216x192x192 voxels, or129.6x115.2x115.2mm. The final shape,
# including margins, must stay within8,388,608voxels. Blocks remain centered
# at25%/75% of the image-predicted longitudinal bounds. No target labels move
# inference crops. Pink report outlines show the actual high-resolution blocks.
#
# NOTE 6 — Spatial heatmap localization with a stride-four 3D encoder; center
# coordinates are derived from the heatmap. Only initial box EXTENTS use the
# mean original training anatomy. Fine CoA branches share weights and reuse
# frozen coarse features sampled at the correct stride-four physical grid.
#
# NOTE 7 — Attenuation in cm^-1, not HU; same scaling at coarse/fine resolutions.
# Anatomy labels are supervision and QA only, never predictor input channels.
#
# NOTE 8 — Train on original training scans and their augmented views only.
# Checkpoint score is0.5*identity validation loss +0.5*mean fixed translation
# validation loss. Probe settings are fixed before training. The120epoch limit
# is an engineering budget, not a promise of adequate localization.
#
# NOTE 9 — If coverage AND robustness pass, train binary CoA and continuous
# local-volume-loss heads. Use validation BCE for checkpoint selection. Report
# edited-negative discrimination separately to avoid original-vs-edited shortcuts.
#
# NOTE 10 — Every scenario must cover at least90% of before AND after anatomy.
# Edited cases additionally require90% combined changes and100% net removals.
# The no-cancellation proof ensures the CoA removals are included. These gates
# remain unchanged from r2; failed coverage stops classifier training.
#
# NOTE 11 — OneGPU,16GiB Slurm host request,12GiB application host/GPU caps.
# Fixed TensorSpecs must retain one trace per train/predict function. The job
# first runs synthetic GPU checks at BOTH the real overview and padded detail
# sizes, including gradients and checkpoint reload, then starts a fresh process.
# Host samples cannot prevent a transient allocation between checks.
#
# NOTE 12 — Train-only transform: u_out=0.5+scale*(u_in-0.5)+translation.
# u is normalized voxel-face position. Image and validity share interpolation;
# supervised centers and extents use the exact affine. Two augmented views plus
# one original are used per training case per epoch. Axial truncation zeros the
# image and validity at the ends, retaining the full target and safety context.
# These geometric views are generated on demand and are not stored as cohorts.
#
# NOTE 13 — Fixed +/-4% translations along k,j,i on development originals.
# Selection uses these probes; they are not held-out test results. The selected
# model must have validation mean relative shift error<=0.5 on EACH axis and
# no individual probe>1. A stationary predictor scores1. Real-image mean center
# error must also be<=75% of the matched blank-attenuation error with validity
# retained. All fixed validation probes must be eligible and pass native anatomy
# coverage after inverse-mapping; labels never recenter a prediction.
