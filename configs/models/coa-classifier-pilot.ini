# Run from the fakect.26.09.16 worktree. Detailed notes follow the parameters.
# python3 scripts/train_coa_classifier.py --config configs/models/coa-classifier-pilot.ini --validate-only
# python3 scripts/train_coa_classifier.py --config configs/models/coa-classifier-pilot.ini --stage plan
# sbatch scripts/slurm/fakect_coa_classifier_gpu.sh configs/models/coa-classifier-pilot.ini

[experiment]
schema_version = fakect.coa-classifier/1     # NOTE 1
output_directory = outputs/experiments/coa/classifier-pilot-r1 # NOTE 1

[locator]
experiment_directory = outputs/experiments/coa/multiscale-pilot-r3 # NOTE 2
review_directory = outputs/experiments/coa/multiscale-pilot-r3-review-r1 # NOTE 3

[training]
epochs = 10                                # NOTE 4
learning_rate = 0.001                       # NOTE 4
seed = 42                                  # NOTE 5
host_memory_limit_mb = 12288                # NOTE 6
gpu_memory_limit_mb = 12288                 # NOTE 6
require_gpu = true                         # NOTE 6

# NOTE 1 — This is a separate, immutable classifier-only experiment. It reuses
# the existing locator and paired dataset. A changed input needs a new output
# directory. Planning pins this INI, source files, parent/review metadata and
# the locator checkpoint. --validate-only performs metadata checks without
# training or reading reserved test images. Stage fit never overwrites a model.
#
# NOTE 2 — Inherit the exact data, annotations, family split, intensity scaling,
# overview, padded fine-block geometry and model architecture from the frozen
# parent. The selected epoch-99 locator and its coarse encoder remain frozen.
# Two 216x192x192 blocks at 0.6 mm provide detail alongside whole-body context.
# No full-body sibling volumes are duplicated and the locator is not retrained.
#
# NOTE 3 — Require the successful numerical review and every original coverage
# and robustness check. Before gradients, recompute each locator prediction and
# require the same image-derived sampled crops. Masks never recenter crops or
# become predictor input channels. Any changed source or review stops the run.
#
# NOTE 4 — Use the same 32 training and 8 validation scenarios, with 16/16 and
# 4/4 positive/negative class counts. Each case supplies an original, mildly
# edited negative, lower positive and higher positive. CoA-positive means at
# least 20% achieved LOCAL TARGET VOLUME LOSS, a provisional engineering label.
# The continuous head estimates that loss fraction, not a clinical severity
# grade or minimum lumen area. The report flags 18–22% threshold-near samples.
# Select the classifier checkpoint using minimum validation binary cross-entropy.
# Report discrimination of edited negatives separately from unmodified originals.
#
# NOTE 5 — Start fresh classifier weights and a fresh shuffle generator with
# this seed. This continues the staged experiment from a frozen locator; it does
# not restore the interrupted training optimizer or augmentation RNG state.
# Related phantoms and all their siblings keep their original family partition.
# The reserved infant test family is not read or predicted in this pilot.
#
# NOTE 6 — One GPU, four CPUs, four-hour Slurm cap and 16 GiB host request.
# Apply the existing 12 GiB GPU allocation cap and sampled host-memory guard.
# Fixed TensorSpecs must keep one train/predict trace. The inherited geometry
# already passed full-size GPU training/checkpoint checks; this run records
# actual cohort memory and verifies that the coarse encoder weights stay fixed.
