# Two-model engineering pilot. Paths are relative to the integration checkout.
# First extract frozen pairs; then use scripts/train_two_stage.py --config THIS_FILE.

[experiment]
schema_version = fakect.two-stage-experiment/1 # NOTE 1: two separately trained models
scope = engineering                         # NOTE 2: provisional families, reviewed crop
output_directory = outputs/experiments/coa/two-stage-r2 # NOTE 3: immutable run revision

[data]
project = configs/cohorts/coa/project-radius115.json # NOTE 4: all twelve frozen phantoms
directory = outputs/datasets/coa/two-stage-radius115-r1 # NOTE 4: shared paired manifest
write_change_masks = true                   # NOTE 5: export added/removed companions

[split]
strategy = holdout                          # NOTE 6: same split for both models
case_counts = 8,2,2                          # NOTE 6: train,validation,test phantom IDs
seed = 42                                   # NOTE 6: deterministic family assignment

[model]
architecture = unet3d                        # NOTE 7: compact 3D encoder/decoder
patch_size_kji = 64,64,64                    # NOTE 7: voxel counts after resampling
target_spacing_mm = 0.6,0.6,0.6              # NOTE 8: physical i,j,k model grid
base_filters = 4                            # NOTE 7: channels at first level
depth = 2                                   # NOTE 7: two downsampling levels
batch_size = 1                              # NOTE 9: bounded GPU memory
epochs = 5                                  # NOTE 9: initial engineering budget
learning_rate = 0.001                        # NOTE 9: Adam learning rate
seed = 42                                   # NOTE 9: model initialization and sampling
patches_per_volume = 4                       # NOTE 10: sampled training patches per epoch
max_train_batches_per_epoch = 0              # NOTE 10: all sampled patches from every training case
change_weight = 5.0                         # NOTE 11: reconstruction emphasis on actual edits
threshold = 0.5                             # NOTE 12: fixed mask probability cutoff
clip_min = 0.0                              # NOTE 13: attenuation cm^-1
clip_max = 0.5                              # NOTE 13: fixed clipping for Model 1
save_predictions = true                     # NOTE 14: held-out volume outputs and report

[model.segmentation]
change_weight = 1.0                         # NOTE 11: CT -> observed aorta

[model.reconstruction]
change_weight = 5.0                         # NOTE 11: observed mask -> reference mask

# NOTE 1 — Model 1 learns image -> final mask. Model 2 learns final mask ->
# original mask. Added/removed regions are derived by comparing its reference
# prediction with the input mask; these are not independently contradictory heads.
# Both models have separate checkpoints and can be fitted separately.
#
# NOTE 2 — The selected-aorta crop is the reviewed target, including branch
# junctions. Full thoracic-aorta coverage and automatic whole-CT localization
# have not been established. The six provisional paired anatomy groups retain
# known duplicates together; they do not prove independent patient ancestry.
# This explicit pilot leaves the verified registry/model workflow unchanged.
#
# NOTE 3 — --stage plan locks this input, paired metadata, splits and model
# implementation. --stage fit-segmentation and --stage fit-reconstruction train
# separately. --stage test evaluates both plus the chained pipeline. --stage
# all prepares the companion manifest, plans, fits both, tests and writes HTML.
# Use a new output directory after changing the locked input or implementation.
# Existing partial model output requires inspection, not an implicit restart.
#
# NOTE 4 — Existing prepare_cohort.py --stage prepare extracts each frozen case.
# --stage prepare here builds a manifest over those arrays; it does not edit
# anatomy or re-freeze generation. Baseline masks are referenced once per case.
# All native data stay on disk outside Git. The manifest pins their checksums.
#
# NOTE 5 — Added = final AND NOT original; removed = original AND NOT final.
# Changes later canceled are absent from these net masks. Removed voxels remain
# outside the surviving aorta; they must not be clipped to the final mask.
#
# NOTE 6 — Related phantom IDs and every synthetic sibling stay together.
# Validation selects model checkpoints; held-out test data never select them.
# This first two-stage runner implements one holdout. Existing binary-model
# cross-validation remains available through model_experiment.py; extending
# the new reconstruction task to all folds follows the engineering pilot.
#
# NOTE 7 — U-Net uses 3D convolutional blocks, stride-2 downsampling, skip connections and a
# sigmoid foreground output. Patch dimensions must be divisible by 2**depth.
# Strided convolution and disabled XLA JIT support deterministic TF2.17 GPU fitting.
# The current 64-voxel patch spans 38.4 mm at 0.6 mm; shape reconstruction may
# need larger context in a later validation-selected experiment.
#
# NOTE 8 — Explicit physical resampling keeps native arrays unchanged. Before
# and after masks use the same nearest-neighbor grid; image uses linear
# interpolation. Change masks are re-derived there. Report model-grid metrics
# and retained edit counts; these are not automatically native-resolution scores.
#
# NOTE 9 — These settings control fitting, not cohort size. Five epochs provide
# a bounded first trial, not evidence of convergence. Dataset split seed and
# training seed are distinct. A GPU SLURM wrapper is provided for Wahab.
#
# NOTE 10 — Sampling includes target/change and background context. The cap is
# recorded explicitly. Validation/testing cover complete volumes, never just
# favorable foreground patches; tiled inference overlaps and blends patches.
#
# NOTE 11 — Reconstruction predicts baseline occupancy, with extra training
# weight on changed regions. Include unchanged controls so normal anatomy is
# preserved. Compare with copying the input mask as an identity baseline.
#
# NOTE 12 — This is a prediction cutoff, not a clinical severity threshold.
# Model 2's estimate is a plausible reference, not recovered historical anatomy.
# Oracle-mask testing isolates shape reconstruction. Chained predictions also
# contain Model 1 segmentation errors, reported separately from true edit masks.
#
# NOTE 13 — Fixed bounds require no held-out image statistics. Current images
# are attenuation-copy proxies, not HU patient CT or physical reconstruction.
# Model 2 takes binary masks and does not use these attenuation clipping bounds.
#
# NOTE 14 — Outputs include model-grid reference and change predictions, metrics,
# histories and an HTML review. New patient deployment/clinical validation and
# centerline/area/severity targets remain separate later phases.
