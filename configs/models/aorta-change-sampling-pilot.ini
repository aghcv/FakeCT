# TRAIN-only check before any larger localization retraining.
[experiment]
schema_version = fakect.change-sampling-pilot/1 # NOTE 1: fresh frozen diagnostic
output_directory = outputs/experiments/aorta/change-sampling-pilot-r1 # NOTE 1

[reference]
experiment_directory = outputs/experiments/aorta/diverse-change-r2 # NOTE 2: completed population control
fold = xcat_reference_10yr                  # NOTE 2: reuse exact frozen TRAIN crops

[diagnostic]
case_ids = 260602,260613                    # NOTE 3: adult and child from this fold's TRAIN partition
burden_quantiles = 3                       # NOTE 3: low/middle/high actual net change burden

[training]
epochs = 64                               # NOTE 4: fixed small-panel training exercise
steps_per_epoch = 28                       # NOTE 4: 1,792 total optimizer updates
patch_shape_kji = 96,96,96                 # NOTE 5: same 57.6mm patch geometry
base_filters = 4                          # NOTE 5: same volumetric U-Net
learning_rate = 0.001                      # NOTE 5: fresh Adam, unchanged learning rate
change_weight = 8                         # NOTE 5: retain current sparse-change loss
dice_weight = 1                           # NOTE 5
changed_fraction = 0.75                   # NOTE 6: choose only present classes on edited draws
inference_overlap = 24                    # NOTE 5
seed = 42                                # NOTE 5

[validation]
minimum_dice = 0.60                       # NOTE 7: per-class training localization requirement
minimum_precision = 0.50                  # NOTE 7
minimum_recall = 0.50                     # NOTE 7
maximum_control_change_fraction = 0.01    # NOTE 7: unchanged training controls

# NOTE 1 — Preserve existing outputs. Changing inputs or pinned implementation
# requires a fresh output revision. Freeze with --stage plan, then production
# GPU smoke before --stage fit. No held-out checkpoint selection is permitted.
# NOTE 2 — Existing source siblings and their image-predicted crop origins are
# reused exactly. The diagnostic never reads validation, final-test or reserved
# image/mask payloads and does not rerun or target-recenter the locator.
# NOTE 3 — Deterministically select six unique edited siblings per anatomy:
# three burden strata each for net enlargement and net narrowing. Single-class
# and mixed siblings are represented where available. Include one unchanged
# original per anatomy. Burden uses verified net mask counts, not requested
# distance. This selection is explicitly supervised TRAIN diagnostics only.
# NOTE 4 — The small panel tests whether sampling can learn both change classes.
# It is not a controlled comparison of generalization or a new population-size
# experiment. Training stays finite and does not automatically launch five folds.
# NOTE 5 — Architecture, loss, intensity normalization and resolution match the
# completed source run. Do not change the loss or learning budget simultaneously
# with sampling corrections when interpreting this diagnostic.
# NOTE 6 — Positive sampling balances present change classes and burden strata;
# an absent class must never silently become a uniform positive draw. Original
# controls and intentional uniform context draws remain separately audited.
# NOTE 7 — Passing the TRAIN-only diagnostic supports a later full held-out
# experiment; it does not establish reliability for the severity classifier.
