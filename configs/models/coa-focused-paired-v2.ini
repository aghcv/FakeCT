# Run from the fakect.26.09.16 worktree. Numbered notes follow the parameters.
# python3 scripts/train_coa_paired_v2.py --config configs/models/coa-focused-paired-v2.ini --validate-only
# python3 scripts/train_coa_paired_v2.py --config configs/models/coa-focused-paired-v2.ini --stage plan
# sbatch scripts/slurm/fakect_coa_paired_v2_gpu.sh configs/models/coa-focused-paired-v2.ini

[experiment]
schema_version = fakect.coa-paired/2        # NOTE 1
output_directory = outputs/experiments/coa/focused-paired-r2 # NOTE 1

[locator]
experiment_directory = outputs/experiments/coa/multiscale-pilot-r3 # NOTE 2
review_directory = outputs/experiments/coa/multiscale-pilot-r3-review-r1 # NOTE 2
focused_experiment_directory = outputs/experiments/coa/focused-classifier-r1 # NOTE 3
paired_experiment_directory = outputs/experiments/coa/focused-paired-r1 # NOTE 4

[diagnostic]
case_ids = 260613,260616                    # NOTE 5
epochs = 200                               # NOTE 6
learning_rate = 0.001                       # NOTE 6
cache_limit_mb = 2048                       # NOTE 7
minimum_probability_gap = 0.30              # NOTE 8
maximum_bce = 0.30                          # NOTE 8

[model]
base_filters = 4                           # NOTE 9
regression_weight = 1.0                     # NOTE 10

[training]
epochs = 10                                # NOTE 11
learning_rate = 0.001                       # NOTE 11
seed = 42                                  # NOTE 12
host_memory_limit_mb = 12288                # NOTE 13
gpu_memory_limit_mb = 12288                 # NOTE 13
require_gpu = true                         # NOTE 13

# NOTE 1 — This is a separate immutable experiment. Planning copies this INI and
# all runtime sources, verifies prior locks and pins the completed reference
# diagnostic. Its report.html links the diagnostic and any later pilot reports.
# Frozen parameters require a new revision and output directory when changed.
#
# NOTE 2 — Retain the reviewed epoch-99 image-only locator and its exact crop
# origins. Each sample provides two 216x192x192 blocks at 0.6 mm. The classifier
# receives attenuation and acquisition validity; anatomy masks and edit labels
# remain supervision/review metadata rather than additional predictor channels.
#
# NOTE 3 — The original focused experiment defines the unchanged classifier
# architecture and starting weights. Its immutable reference remains accessible.
#
# NOTE 4 — Require the completed 100-epoch paired diagnostic. Validate its source
# lock, selected checkpoint, history, prediction identities, initialization,
# frozen locator and passing batch-two GPU smoke. A completed failed learning
# gate is an accepted reference for this new training diagnostic. It cannot
# authorize the later pilot. Reference artifacts are pinned and preserved.
#
# NOTE 5 — Use the same four edited training siblings as the reference: one
# edited negative and one highest-positive sibling from each training phantom.
# Companion edits and image-predicted origins match within each pair. Validation
# and reserved test images are outside this diagnostic and remain unconsumed.
#
# NOTE 6 — The only experimental change is the fresh diagnostic budget:
# 100 reference epochs versus 200 new epochs. All other normalized settings must
# equal the completed reference. Planning requires exactly 200 for this arm.
# Two balanced sibling batches per epoch give 400 combined optimizer updates
# and 800 individual image presentations. Mean BCE and regression loss for both
# siblings use the same weights, followed by one combined gradient clip/update.
# Minimum TRAINING BCE selects the checkpoint. The reference optimizer state
# and its selected checkpoint are not used to initialize this run.
#
# NOTE 7 — The four normalized samples occupy approximately 486 MiB in RAM.
# A bounded transient cache reuses them. Native whole-body attenuation and
# immutable edit crops remain shared; this run writes models and metadata.
#
# NOTE 8 — Keep the original gates: BOTH siblings classified correctly at 0.5,
# positive-minus-negative probability gap at least 0.30 and BCE at most 0.30
# for EVERY training phantom pair. These are learning feasibility checks; they
# do not establish generalization or clinical severity prediction.
#
# NOTE 9 — Retain the same width and maximum encoder stride four: 2.4 mm feature
# spacing, local evidence and ordered spatial bins. The architecture is unchanged
# from the 100-epoch reference. A new batch-two production-size GPU smoke check
# runs before this cohort diagnostic, including gradients, trace/reload checks.
#
# NOTE 10 — Use the inherited 20% achieved local target-volume-loss threshold
# for the binary target and weighted Huber loss for its continuous fraction.
# These remain the provisional engineering definitions used by the reference.
#
# NOTE 11 — These unchanged settings are reserved for an explicitly requested
# --stage fit development pilot: fresh weights, 32 training / 8 validation
# scenarios and minimum validation BCE checkpoint selection. The pilot requires
# this new diagnostic to pass. It is not launched by the default Slurm command.
# sbatch scripts/slurm/fakect_coa_paired_v2_gpu.sh configs/models/coa-focused-paired-v2.ini fit
#
# NOTE 12 — Fresh classifier initialization and shuffle generator use seed 42.
# Before gradients, verify that the initial weight fingerprint exactly matches
# the completed paired reference. Related anatomy families keep their partitions.
# Individual scans can still be predicted independently after paired training.
#
# NOTE 13 — Request one GPU, four CPUs, 16 GiB host RAM and a four-hour cap.
# Application guards retain the reference 12 GiB host/GPU limits. GPU smoke and
# diagnostic run in separate processes to release smoke allocations first.
