# Model-only experiment. No phantom generation or ROI settings belong here.
# Validate: python3 scripts/model_experiment.py --config configs/models/coa.ini --validate-only
# This draft remains blocked until the listed datasets and family provenance are ready.

[experiment]
schema_version = fakect.model-experiment/1  # NOTE 1
registry = data/cohorts/coa/registry  # NOTE 2
datasets = coa-260602-r1, coa-260611-r1, coa-260612-r1, coa-260613-r1, coa-260614-r1, coa-260615-r1, coa-260616-r1, coa-260617-r1, coa-260618-r1, coa-260619-r1, coa-260620-r1, coa-260621-r1  # NOTE 3
output_directory = outputs/experiments/coa/model-r1  # NOTE 4

[split]
mode = anatomy_family  # NOTE 5
validation_fraction = 0.2  # NOTE 5
test_fraction = 0.2  # NOTE 5
seed = 42  # NOTE 5

[preprocess]
target_spacing_mm = 1,1,1  # NOTE 6

[model]
architecture = unet2d  # NOTE 7
patch_size = 64,64  # NOTE 7
slice_axis = k  # NOTE 7
normalization = fixed_clip  # NOTE 8
clip_min = 0.0  # NOTE 8
clip_max = 0.5  # NOTE 8
epochs = 5  # NOTE 9
batch_size = 4  # NOTE 9
learning_rate = 0.001  # NOTE 9
seed = 42  # NOTE 9

# NOTE 1 — This file selects already published datasets. It does not open raw
# XCAT inputs, call editing tools, regenerate pairs, or depend on the current
# generator's code fingerprint. Changes require a new experiment revision.
#
# NOTE 2 — The registry contains immutable dataset objects and named receipts.
# It is dataset storage, excluded from Git. Back it up independently and retain
# the complete directory tree, including checksums, labels and input snapshots.
# A receipt pins a particular manifest; it never means 'whichever is latest'.
#
# NOTE 3 — Explicit comma-separated registry names define the cohort. All cases
# here use frame 1. Other frames, edit ranges or ROI revisions must be registered
# with new names and the same source anatomy family when appropriate. The
# existing reviewed 260602 v2 preparation is published as coa-260602-r1. The
# other eleven names are planned; validation lists missing/unverified entries.
#
# NOTE 4 — --stage plan writes the exact input and an experiment lock after all
# dataset, family and geometry checks pass. --stage fit uses that frozen lock.
# Never edit a locked INI in place or reuse a populated output directory for a
# different experiment. No fitting is performed by --validate-only or --stage plan.
#
# NOTE 5 — Fractions apply to whole anatomy families, not variants or slices.
# At least three verified independent families are required by this protocol.
# Case IDs, sex and age alone do not prove independence: confirm template
# ancestry before registering a family as verified. All variants/revisions of
# a family stay together. Legacy per-dataset scenario splits are ignored here.
# Validation selects checkpoints; test data are held out from fitting.
#
# NOTE 6 — Explicit model-time i,j,k voxel spacing in mm. Native data span
# 0.4–1.0 mm; this provisional 1 mm grid makes patch scale comparable. Images
# use linear interpolation; binary masks use nearest-neighbor sampling. Stored
# native arrays are unchanged. Grid lower faces align; a partly covered final
# output cell uses the nearest source boundary. Review small pediatric vessels
# before adopting this resolution; coarse sampling can erase small features.
# A finer setting changes memory/patch counts and requires a new experiment.
# Omitting [preprocess] permits only datasets with compatible native spacing.
#
# NOTE 7 — The current model is a 2D U-Net on native axial k slices after any
# requested grid conversion. patch_size gives j,i pixel counts, divisible by 4.
# The input remains attenuation in cm^-1 and the target remains the reviewed
# ROI-selected artery lineage, including growth outside its original selector.
#
# NOTE 8 — Fixed clipping and [0,1] scaling use no held-out image statistics.
# Bounds are attenuation in inverse centimetres, not HU. These provisional
# values need review before model experiments; the images are an attenuation-
# copy proxy and are not learned background recovery or physical CT simulation.
#
# NOTE 9 — Model fitting controls only. They do not change published pairs.
# Keep the final test partition reserved while using validation for tuning.
