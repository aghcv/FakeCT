# Focused CoA family evaluation and paired age/sex validation comparisons.
# Run the metadata plan before fitting; each stage learns a fresh image locator.

[experiment]
schema_version = fakect.coa-rotation-design/1 # NOTE 1: independent experiment revision
output_directory = outputs/experiments/coa/rotating-evaluation-r1 # NOTE 1: never overwrite a frozen experiment

[data]
project = configs/cohorts/coa/project-radius115.json # NOTE 2: explicit template age/sex metadata
manifest = outputs/datasets/coa/context-aorta-r1/dataset-manifest.json # NOTE 2: immutable shared sources and sibling edits
annotations = outputs/labels/coa/provisional-volume-r1/labels.json # NOTE 3: achieved morphology, not requested edit strength

[reference]
geometry_config = configs/models/coa-multiscale-pilot-v3.ini # NOTE 4: reuse reviewed sampling geometry
experiment_directory = outputs/experiments/coa/focused-pilot-r1 # NOTE 4: architecture reference; no trained locator reused

[evaluation]
protocols = family_holdout, same_age_other_sex, nearest_age_same_sex # NOTE 5: primary and two secondary analyses
seeds = 42                                  # NOTE 6: repeated training seeds share the same partitions
reserved_case_ids = 260612,260617            # NOTE 7: entire infant pair remains unopened
scenarios_per_case = 6                       # NOTE 8: three distinct companion-matched negative/positive pairs
label_threshold = 0.20                      # NOTE 3: engineered reference class from achieved local volume loss
prediction_threshold = 0.5                  # NOTE 9: fixed operating point, separate from the reference label
nearest_age_tie_break = younger_then_case_id # NOTE 10: deterministic rule declared before any results

[training]
locator_epochs = 120                        # NOTE 11: locator fits only each stage's training phantoms
classifier_epochs = 50                      # NOTE 12: inner validation selects the outer refit budget
locator_learning_rate = 0.0003              # NOTE 11: independent fresh locator training
classifier_learning_rate = 0.001            # NOTE 12: focused paired classifier training
regression_weight = 1.0                     # NOTE 12: secondary local-volume-loss proxy head
cache_limit_mb = 6144                       # NOTE 13: bounded image cache, MiB
host_memory_limit_mb = 16384                 # NOTE 13: runtime guard, MiB
gpu_memory_limit_mb = 12288                  # NOTE 13: runtime guard, MiB
require_gpu = true                          # NOTE 13: production fitting requires a GPU

# NOTE 1 — Each plan freezes exact metadata, case/sample partitions, source
# identities, settings and code. Use a new output directory after changing any
# locked input. Planning does not train or read phantom image payloads.
#
# NOTE 2 — Twelve IDs form six conservative age/sex groups. The grouping is
# provisional and does not prove template independence or shared ancestry.
# Raw attenuation remains the inference input; masks and annotations supervise
# training and QA rather than becoming classifier channels.
#
# NOTE 3 — Positive means achieved local CoA target-volume loss >=20%. This is
# an engineering benchmark, not a clinical diagnosis or a lumen-area severity
# threshold. Original references are assumed non-CoA; mildly edited negatives
# are not described as unmodified anatomy. Keep accepted safeguard outcomes.
#
# NOTE 4 — Reuse the reviewed physical overview/detail sampling convention and
# focused classifier design. Every rotation trains a NEW locator and classifier
# on its permitted training cases. Previous locator weights or predictions may
# not select held-out crops, because they have seen some rotating test cases.
#
# NOTE 5 — family_holdout is primary: five outer development-family folds,
# four inner family-validation runs per fold, then a fresh outer refit using
# an inner-selected fixed budget. same_age_other_sex and nearest_age_same_sex
# are secondary phantom-heldout analyses: V is model-selection validation;
# P and every sibling are final-test predictions only. P has identical selected
# scenarios in both comparisons. Secondary splits are not ancestry-isolated.
#
# NOTE 6 — Seeds are optimization repeats, not independent patients. Results
# summarize within phantom then family. They do not count siblings or seed
# repetitions as new originating anatomy. Add seeds as a comma-separated list.
#
# NOTE 7 — The two infant cases remain outside all development fitting,
# validation and final prediction. With ten available development IDs, each
# secondary run is 8 train /1 validation /1 final test, plus two reserved IDs.
# Primary inner runs are 6/2/2, followed by 8/0/2 outer refits. A future protocol
# using all twelve must explicitly retire this reserved-test policy.
#
# NOTE 8 — Six edited scans per case are three distinct matched pair blocks.
# A pair shares ascending-dilation and arch-edit settings while varying CoA.
# Choose negative achieved loss closest below the fixed class threshold; choose
# low, middle and high positives across sorted companion configurations. This
# uses generation metadata only. Baselines remain separate locator references.
# Every OTHER sibling of P and V is also excluded from training even when it is
# not among these six selected scenarios. Smaller values must be 2 or 4, meaning
# complete pair blocks; distinct scenarios never include repeated presentations.
#
# NOTE 9 — This probability cutoff applies after prediction; it does not define
# the disease reference label. Any tuned operating point needs a new protocol
# and must be selected only from inner/model-selection validation data.
#
# NOTE 10 — Nearest available same-sex age uses known development ages, first
# minimum absolute year difference, then younger age, then case ID. At 10 years
# the 5-year and 15-year candidates tie, so this rule chooses 5 years. Adult age
# is 50 from the explicit template name; infant age remains unknown and reserved.
# Nearest available does not imply clinically close (adult versus 15 years).
#
# NOTE 11 — Locator supervision comes from training cases only. Held-out
# predictions must derive crops from attenuation, and locator misses must remain
# visible as pipeline failures. No atlas/edit coordinates choose test crops.
#
# NOTE 12 — Inner runs use model-selection validation BCE. Final-test labels
# may never choose checkpoint, architecture, training budget or probability
# threshold. The outer model starts fresh; its budget is selected from completed
# inner runs rather than early-stopping on the outer test family. Proxy regression
# is a secondary endpoint and is not currently validated clinical severity.
#
# NOTE 13 — Cache and limits are MiB. The cache must leave at least half the
# host guard for TensorFlow, loaded checkpoints and resampling. Check the full
# largest-stage memory smoke before long fitting. No additional whole-body
# copies are made merely to increase the number of synthetic siblings.
