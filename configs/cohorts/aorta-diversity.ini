# Native sibling population; generation and model training remain separate.
# python3 scripts/prepare_sibling_population.py --config configs/cohorts/aorta-diversity.ini --validate-only

[population]
schema_version = fakect.sibling-population/1 # NOTE 1: additive generation contract
output_directory = outputs/cohorts/aorta/diversity-r1 # NOTE 1: new immutable revision
source_manifest = outputs/datasets/coa/context-aorta-r1/dataset-manifest.json # NOTE 2
prepared_root = outputs/cohorts/coa/radius115 # NOTE 2: reuse pinned native sources
case_ids = 260602,260611,260613,260614,260615,260616,260618,260619,260620,260621 # NOTE 3
variants_per_case = 256                     # NOTE 4: new edited recipes per anatomy
seed = 20261006                            # NOTE 4: reproducible population

[variation]
distance_fraction = 0.25,1.0                # NOTE 5: fraction of each original maximum
shape_k = 4,12                             # NOTE 6: Gaussian longitudinal concentration
window_length_fraction = 0.55,0.95          # NOTE 6: local active longitudinal window
directions = inner,outer,all                # NOTE 7: curvature-relative or symmetric
angular_width_deg = 45,90,135,180           # NOTE 7: full asymmetric sector width

[region.arch_outer_expand]
path_percent = 5,55                        # NOTE 8: ascending/proximal region
length_percent = 12,50                     # NOTE 8: length as percentage of full parent path
symmetric_distance_scale = 1.0             # NOTE 9: symmetric dilation budget

[region.arch_inner_narrow]
path_percent = 20,65                       # NOTE 8: broad arch region
length_percent = 10,45                     # NOTE 8: localized to elongated narrowing
symmetric_distance_scale = 0.5             # NOTE 9: conservative peak for broader circumferential erosion

[region.coa_narrow]
path_percent = 55,95                       # NOTE 8: isthmus/descending region
length_percent = 8,40                      # NOTE 8: discrete to elongated narrowing
symmetric_distance_scale = 1.0             # NOTE 9: inherited safeguarded CoA budget

# NOTE 1 — Plan captures this INI, source metadata and implementation hashes.
# Each case is published only if every requested sibling passes native checks.
# Existing outputs are preserved, including failures; use a new revision when
# changing settings. This references original full-body ATN and native crops,
# writes compact variants and paired masks, and never copies full-body siblings.
# NOTE 2 — ROI, atlas selection, label IDs, stiffness and original erosion guards
# come from each completed radius115/pairs-r2 snapshot. Original coordinates,
# crop bounds and maximum distances remain unchanged. Label-4 interior proof
# covers the entire original main ROI plus its maximum dilation envelope.
# NOTE 3 — These are ten development phantoms in five related anatomy families.
# Reserved infant cases260612/260617 remain unopened. More siblings increase
# controllable morphology diversity, not the number of independent patients.
# NOTE 4 — Requested siblings balance enlargement-only, narrowing-only and
# mixed groups. Narrowing and mixed groups cycle all combinations of the two
# erosion steps. Inactive steps use distance0/operation none. One original
# baseline is reused per anatomy; training can oversample it without storing
# duplicates. Requested variants can collapse to identical final geometries;
# those outcomes are recorded and must not be counted as new anatomy.
# NOTE 5 — Distances vary independently up to original per-case swept maxima.
# A single pass is used. The achieved change can be smaller owing to resistance,
# profiles, directional reliability and inherited erosion backoff safeguards.
# NOTE 6 — Profiles use physical parent-tube coordinates. Local shape windows
# are centered within each chosen interval; they do not change the source ROI.
# NOTE 7 — Inner/outer use reliable centerline normals. Existing engine sectors
# support at most180degrees; direction all denotes symmetric360degrees and
# omits angular_width_deg. Unreliable curved-frame portions are skipped by the
# existing engine. Width270 is not supported or silently approximated.
# NOTE 8 — Choose both location and length inside the stated parent arc interval.
# Longer narrowing and smaller focal lesions are mixed reproducibly. These
# percentages denote full ROI physical length, not native slice index or number
# of nodes. Metadata halo validation must pass before any population is frozen.
# NOTE 9 — Symmetric arch erosion is capped at half the original maximum while
# covering a larger circumferential sector. Original arch and CoA connectivity
# safeguards remain intact; the original arch has no retained-volume floor.
# Every final native result is checked for continuity of the original main
# trunk, allowing existing small ROI-clipped fragments. Native connectivity is
# an engineering check; it does not establish clinically realistic lumen size.
