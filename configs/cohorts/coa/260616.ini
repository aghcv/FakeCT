# NOTES — practical editing instructions

# NOTE 1 — Generation-only schema. This INI describes one phantom revision; model settings and experiment splits belong in configs/models/coa.ini.
#
# NOTE 2 — Native XCAT case and frame. Geometry comes from the audited .par/log pair; keep ACT and ATN in the same frame. All relative paths resolve from this checkout.
#
# NOTE 3 — Select the artery tissue category. Leave source_ids blank; original surface/voxel IDs are optional refinements, not required user knowledge.
#
# NOTE 4 — Ordered i,j,k tube points run from ascending aorta through the arch to descending aorta. Radii in mm select original target voxels. Growth can leave the selector. New case coordinates are provisional: inspect global and local report tabs, edit, rerun, then set coordinate_reviewed=true.
#
# NOTE 5 — Preview planes are native i,j,k. Opacities affect display only; volume_stride pools display cells and does not change source/edit resolution. Increase it if the report exceeds its display budget.
#
# NOTE 6 — The smoothed physical centerline provides longitudinal distance and inner/outer directions. Smoothing and sampling distances are mm; low-curvature portions may not have a reliable inner/outer direction.
#
# NOTE 7 — Every synthetic variant starts from the original phantom. The named steps execute in this order within that variant, using the previous step result.
#
# NOTE 8 — Edit range path_percent is percentage of physical main-tube length. distance_mm is a requested peak displacement budget before tissue resistance, voxelization and safeguards. Gaussian/window and direction control taper/asymmetry. Unlisted sweep settings stay fixed.
#
# NOTE 9 — Erosion safeguards apply only to this edit. min_volume_ratio is a local retained-volume floor; preserve_connectivity checks the affected target. Failed trials reduce distance by backoff_factor for at most max_backoff_steps. Missing safeguards stay disabled.
#
# NOTE 10 — Training images require assign_surrounding_tissue=true on active erosions. Released diagnostic labels cannot form paired attenuation images. Unresolved recipients preserve original voxels; review achieved removal in native preflight.
#
# NOTE 11 — Editable tissue resistance: 0 permits borrowing/reassignment freely, 1 prevents it. Bone=1 and skin=0.95 remain as requested. max_distance_mm bounds recipient search. Atlas classification still requires review.
#
# NOTE 12 — Generation stages: preview, plan, preflight, freeze, prepare. --validate-only checks every discrete recipe without voxel execution. preflight runs all combinations. After reviewing ROI and achieved changes, set parameters_reviewed=true, freeze, then prepare. Frozen INI bytes and generation dependencies must match. Use new versioned directories for any revision; published outputs are never overwritten. anatomy_family is provisional provenance, not proof of independent subjects.
#
# NOTE 13 — Each sweep names an edit. Use a comma list or exact inclusive start:stop:step. All axes form a Cartesian product. These initial ranges yield 15 edited cases plus a baseline. Non-reference distances were scaled by body height only to seed review; this is not calibrated vessel severity. Change them after inspecting each case.
#
# NOTE 14 — This output directory holds the interactive preview or plan. Choose a fresh preview directory for each iteration; changing the path after freezing also changes the exact input snapshot, so finish preview edits before freeze.
#
# Draft initialization: crop bounded to 1,814,384 native voxels; initial edit distances multiplied by 0.85000000 after body-height scaling so conservative edit/search halos fit. Review severity manually.
