# python3 scripts/prepare_context_cohort.py --config configs/cohorts/coa/context-aorta.ini --validate-only
# python3 scripts/prepare_context_cohort.py --config configs/cohorts/coa/context-aorta.ini --stage prepare

[cohort]
schema_version = fakect.context-dataset/1               # NOTE 1
source_manifest = outputs/datasets/coa/two-stage-radius115-r1/dataset-manifest.json # NOTE 2
anatomy_template = configs/anatomy/thoracic-aorta-260602.ini # NOTE 3
cases = all                                             # NOTE 4
output_directory = outputs/datasets/coa/context-aorta-r1 # NOTE 5
surface_inventory_pattern = outputs/anatomy/coa/radius115/{case_id}-r1/selection.json # NOTE 6

# NOTE 1 — Engineering dataset: automatic anatomical extent and anatomy families
# remain provisional. This is not a reviewed clinical training release. No
# family assignment or anatomical boundary is silently promoted to verified.
# NOTE 2 — The existing frozen variants provide the attenuation overlays and
# native edit deltas. Original whole-body ATN files remain shared read-only
# inputs. This process writes compact masks, not whole-body sibling images.
# NOTE 3 — One common ROI-free atlas selector is applied to each case. Its T12
# midpoint to T1 upper landmark slab and proximal branch reach are approximations
# requiring visual review. Change the template and use a new output revision to
# alter target coverage. No old edit ROI defines the broader segmentation mask.
# NOTE 4 — all selects every source phantom and all its scenarios. A comma list
# such as 260602,260611 restricts cases. No failed scenario is silently dropped.
# NOTE 5 — Existing outputs are never replaced. --resume reuses only artifacts
# with matching input and code fingerprints; it cannot repair partial per-case
# files or bypass failed anatomical transfers. Inspect preparation-status.json
# when an INCOMPLETE marker remains, then use a new revision after corrections.
# NOTE 6 — Optional cache of each full RAW surface inventory. The cached old ROI
# and old selected labels are not reused. Blank inventories current RAW files.
