# NOTES — practical editing instructions

# NOTE 1 — Generation-only schema. This INI describes one phantom revision; model settings and experiment splits belong in archive/research/configs/models/coa.ini.
#
# NOTE 2 — Native XCAT case and frame. Geometry comes from the audited .par/log pair; keep ACT and ATN in the same frame. All relative paths resolve from this checkout.
#
# NOTE 3 — Select the artery tissue category. Leave source_ids blank; original surface/voxel IDs are optional refinements, not required user knowledge.
#
# NOTE 4 — Ordered i,j,k tube points run from ascending aorta through the arch to descending aorta. Radii in mm select original target voxels. Growth can leave the selector. New case coordinates are provisional: inspect global and local report tabs, edit, rerun, then set coordinate_reviewed=true.
#
# NOTE 5 — Preview planes are native i,j,k. Opacities affect display only; volume_stride pools display cells and does not change source/edit resolution. Increase it if the report exceeds its display budget.
#
# NOTE 6 — The smoothed physical centerline provides longitudinal distance and inner/outer directions. Smoothing and sampling distances are mm; low-curvature portions may not have a reliable inner/outer direction.
#
# NOTE 7 — Every synthetic variant starts from the original phantom. The named steps execute in this order within that variant, using the previous step result.
#
# NOTE 8 — Edit range path_percent is percentage of physical main-tube length. distance_mm is a requested peak displacement budget before tissue resistance, voxelization and safeguards. Gaussian/window and direction control taper/asymmetry. Unlisted sweep settings stay fixed.
#
# NOTE 9 — Erosion safeguards apply only to this edit. min_volume_ratio is a local retained-volume floor; preserve_connectivity checks the affected target. Failed trials reduce distance by backoff_factor for at most max_backoff_steps. Missing safeguards stay disabled.
#
# NOTE 10 — Training images require assign_surrounding_tissue=true on active erosions. Released diagnostic labels cannot form paired attenuation images. Unresolved recipients preserve original voxels; review achieved removal in native preflight.
#
# NOTE 11 — Editable tissue resistance: 0 permits borrowing/reassignment freely, 1 prevents it. Bone=1 and skin=0.95 remain as requested. max_distance_mm bounds recipient search. Atlas classification still requires review.
#
# NOTE 12 — Generation stages: preview, plan, preflight, freeze, prepare. --validate-only checks every discrete recipe without voxel execution. preflight runs all combinations. After reviewing ROI and achieved changes, set parameters_reviewed=true, freeze, then prepare. Frozen INI bytes and generation dependencies must match. Use new versioned directories for any revision; published outputs are never overwritten. anatomy_family is provisional provenance, not proof of independent subjects.
#
# NOTE 13 — Each sweep names an edit. Use a comma list or exact inclusive start:stop:step. All axes form a Cartesian product. These initial ranges yield 15 edited cases plus a baseline. Non-reference distances were scaled by body height only to seed review; this is not calibrated vessel severity. Change them after inspecting each case.
#
# NOTE 14 — This output directory holds the interactive preview or plan. Choose a fresh preview directory for each iteration; changing the path after freezing also changes the exact input snapshot, so finish preview edits before freeze.
#
# Draft initialization: crop bounded to 1,865,084 native voxels; initial edit distances multiplied by 1.00000000 after body-height scaling so conservative edit/search halos fit. Review severity manually.

# NOTE 15 — Optional high-level anatomy, resolved once from original ACT IDs, native ROI contact, atlas hierarchy and case/frame RAW evidence. Run resolve_anatomy.py before preview. It streams surfaces and extracts verified pole/ring centerlines without voxelizing meshes; ATN supplies attenuation, not anatomical IDs. A saved selection is required and checked against its sources. After changing ROI/crop/selection, use a new anatomy_file folder (e.g. radius115/260602-r2) and resolve again. Edit settings can reuse it when the recorded crop stays identical.
#
# NOTE 16 — Thoracic aorta uses the atlas aorta as an anchor. include_branches=true permits atlas systemic, coronary and cerebrovascular branches with native contact to that anchor inside this bounded crop and voxels in the ROI. Pulmonary circulation is excluded first. Connectivity=6 requires face contact; 26 also permits edge/corner contact. Contact is not proof of physiological connectivity. The result filters whole original IDs, so disconnected pieces with an admitted ID may remain: inspect counts and warnings in the report. Generic arteries remain generically named.
#
# NOTE 17 — Keep arteries excluded by anatomy protected from dilation borrowing and erosion reassignment. Set false only when intentionally allowing edits to consume those neighboring arterial labels. Other tissue stiffness settings still apply.
#
# NOTE 18 — Optional comma-separated exact original or atlas canonical names. Blank imposes no additional name restriction. When supplied, these names intersect the optional explicit IDs and automatic anatomy result. Names alone can filter IDs without automatic anatomy or RAW processing; they do not prove connectivity. Omit all anatomy-related settings to retain the original tissue-category workflow.
#

# NOTE 19 — All selector radii are exactly 1.15 times this phantom's original cohort input, increasing every tube diameter by 15%. The initial expansion preserved centerline points, edit distances, ranges and sweep axes; subsequent manual corrections are documented in NOTEs 20 and 21. Crop context is enlarged to preserve edit/search halos; any volume_stride increase changes display sampling only. Anatomy filtering excludes pulmonary labels before selection; excluded arterial IDs remain protected during editing. Review this revision before setting coordinate_reviewed or parameters_reviewed true.
#

# NOTE 20 — Case-specific interior-fill exception. ID 4 is chest_surface: its coarse material is soft tissue, but an atlas naming heuristic gives it skin stiffness. Native evidence in archive/research/docs/integration/2026-09-28/radius115-internal-fill-review-r2.json verifies the entire main ROI expanded by maximum cumulative swept dilation stays more than 3 mm from ACT background and crop boundaries wherever ID 4 can be borrowed. This override is justified only for the recorded geometry and edit budgets; changing ROI/radii/dilation ranges requires rechecking that evidence. Bone=1.0 and skin=0.95 remain unchanged. This is not a global skin reclassification.
#
# NOTE 21 — Arch erosion now preserves every affected native arterial connection. No retained-volume floor is added to this edit; strength is reduced only if connectivity would fail. CoA keeps its separate existing connectivity and local volume safeguards. Review achieved geometry and any reduction before freezing.
#
