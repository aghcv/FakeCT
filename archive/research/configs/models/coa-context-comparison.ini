# Matched attenuation-to-aorta comparison. Freeze this plan before submitting arms.
# python3 scripts/research/compare_context_aorta.py --config archive/research/configs/models/coa-context-comparison.ini --validate-only
# python3 scripts/research/compare_context_aorta.py --config archive/research/configs/models/coa-context-comparison.ini --stage plan
# sbatch scripts/research/slurm/fakect_context_comparison_gpu.sh archive/research/configs/models/coa-context-comparison.ini

[experiment]
schema_version = fakect.context-comparison/1 # NOTE 1
scope = engineering                        # NOTE 1
output_directory = outputs/experiments/coa/context-comparison-r1 # NOTE 2

[data]
manifest = outputs/datasets/coa/context-aorta-r1/dataset-manifest.json # NOTE 3
allow_provisional_anatomy = true            # NOTE 3

[split]
strategy = holdout                         # NOTE 4
case_counts = 8,2,2                         # NOTE 4
seed = 42                                  # NOTE 4

[comparison]
updates_per_epoch = 512                    # NOTE 5
validation_every_epochs = 5                # NOTE 6
volume_cache_size = 2                      # NOTE 7

[model]
architecture = unet3d                      # NOTE 8
patch_size_kji = 216,160,160                # NOTE 8
target_spacing_mm = 0.6,0.6,0.6             # NOTE 8
base_filters = 8                          # NOTE 8
depth = 3                                 # NOTE 8
batch_size = 1                            # NOTE 8
epochs = 20                               # NOTE 5
learning_rate = 0.001                      # NOTE 5
seed = 42                                 # NOTE 5
foreground_fraction = 0.5                  # NOTE 9
augmentation_flip = true                  # NOTE 9
intensity_scale_range = 0.9,1.1             # NOTE 9
clip_min = 0                              # NOTE 10
clip_max = 0.5                            # NOTE 10
threshold = 0.5                           # NOTE 11
save_predictions = false                  # NOTE 11

# NOTE 1 — Compare baseline_only (8 training scans) with
# baseline_plus_siblings (128 training scenarios from the same 8 cases).
# The previous single-patch Dice confirms learning, not generalization.
# This experiment measures segmentation of unseen synthetic anatomy only.
#
# NOTE 2 — Every revision freezes this INI, data manifest, split and code.
# Use a fresh output_directory for any change. Existing runs are never resumed
# implicitly or overwritten. The two arms share one frozen experiment lock.
#
# NOTE 3 — Compact target masks and edited attenuation crops are referenced;
# whole-body copies are not created. Target extent is a provisional atlas-based
# T12-midpoint/T1-upper slab plus proximal branches. Engineering review does
# not mark these boundaries as clinically reviewed.
#
# NOTE 4 — All siblings and related baseline IDs stay in the same partition.
# With seed 42, 8/2/2 cases correspond to 4/1/1 provisional anatomy families:
# train ages 1,5,10,15 years; validate adult; test infant. One test family is
# insufficient for population-level inference; family cross-validation follows.
#
# NOTE 5 — Both arms start with the same weights and take exactly 512 optimizer
# updates per epoch, 64 per training case. Each of 16 sibling variants receives
# four patches per epoch in the augmented arm. The baseline arm receives all
# 64 on its baseline. Changing cohort sizes requires a divisible update count.
# Architecture, optimizer, physical patch coordinates and augmentation seeds
# are matched. The variant choice is the experimental difference.
#
# NOTE 6 — At epochs 5,10,15,20 score all 32 validation scenarios over the
# whole scan. Select the checkpoint by validation family-macro Dice, then
# test once on all 32 held-out scenarios. Unchanged sibling tiles are reused
# only after proving equality of both attenuation and target, including the
# interpolation halo. Changed tiles are always inferred again. No target-box
# cropping limits inference, and no evaluation cache crosses models or epochs.
#
# NOTE 7 — Maximum two verified native-crop volumes held at a time during
# training. Whole-body ATN stays memory-mapped and is sampled in bounded slabs.
#
# NOTE 8 — 3D U-Net sees 129.6 x 96 x 96 mm. The 0.6 mm grid passed all 192
# target-connectivity checks; coarser grids broke severe infant coarctations.
# The successful single-patch diagnostic used this architecture and geometry.
#
# NOTE 9 — Half the patches are baseline-target centered, half sampled over
# the full available scan. Both arms use the same baseline-derived centers,
# paired left/right flip choices and intensity-scale draws. Lesion masks are
# never used to preferentially choose sibling patch locations.
#
# NOTE 10 — Input is attenuation in cm^-1, not HU. Fixed clipping/scaling is
# shared by both arms. These are synthetic attenuation-copy proxies, so success
# does not demonstrate robustness on reconstructed clinical CT images.
#
# NOTE 11 — Fixed occupancy threshold; count every valid full-volume voxel.
# Store per-scenario/case/family metrics and compact provenance. Full-body
# probability outputs are disabled to avoid large redundant files.
