# Run from the fakect.26.09.16 worktree. Numbered notes follow the parameters.
# python3 scripts/research/train_coa_focused.py --config archive/research/configs/models/coa-focused-classifier.ini --validate-only
# python3 scripts/research/train_coa_focused.py --config archive/research/configs/models/coa-focused-classifier.ini --stage plan
# sbatch scripts/research/slurm/fakect_coa_focused_gpu.sh archive/research/configs/models/coa-focused-classifier.ini

[experiment]
schema_version = fakect.coa-focused/1        # NOTE 1
output_directory = outputs/experiments/coa/focused-classifier-r1 # NOTE 1

[locator]
experiment_directory = outputs/experiments/coa/multiscale-pilot-r3 # NOTE 2
review_directory = outputs/experiments/coa/multiscale-pilot-r3-review-r1 # NOTE 2

[diagnostic]
case_ids = 260613,260616                    # NOTE 3
epochs = 40                                # NOTE 4
learning_rate = 0.001                       # NOTE 4
cache_limit_mb = 2048                       # NOTE 5
minimum_probability_gap = 0.30              # NOTE 6
maximum_bce = 0.30                          # NOTE 6

[model]
base_filters = 4                           # NOTE 7
regression_weight = 1.0                     # NOTE 8

[training]
epochs = 10                                # NOTE 9
learning_rate = 0.001                       # NOTE 9
seed = 42                                  # NOTE 10
host_memory_limit_mb = 12288                # NOTE 11
gpu_memory_limit_mb = 12288                 # NOTE 11
require_gpu = true                         # NOTE 11

# NOTE 1 — This is a new immutable experiment. Planning copies the INI and
# runtime sources, pins inherited inputs and checks the dataset/family contract.
# Change output_directory to a new revision before changing frozen parameters.
# The report.html is a single entry point linking the diagnostic and pilot.
#
# NOTE 2 — Reuse the reviewed epoch-99 image-only locator and exact image-derived
# crop origins. Each subject has two 216x192x192 blocks at 0.6 mm. The classifier
# receives only attenuation and acquisition validity from those blocks. Anatomy
# masks, edit coordinates and condition labels do not become predictor channels.
#
# NOTE 3 — Select training cases only. Each supplies its existing edited-negative
# and highest-positive sibling, balanced within that case. Other edit parameters
# and reviewed native crop origins must match. These four samples probe learning
# capacity; they do not provide validation or test performance measurements.
#
# NOTE 4 — The diagnostic trains fresh weights and selects minimum TRAINING BCE.
# It runs at most this many epochs. A failed diagnostic must be examined before
# proceeding to the development pilot. Training sensitivity audits show whether
# image differences survive the encoder and how predictions respond to siblings.
#
# NOTE 5 — The four normalized image pairs occupy approximately 486 MiB in RAM.
# Keep only a bounded transient cache; shared whole-body attenuation and immutable
# native edit crops remain the dataset representation. No new full-body sibling
# images or high-resolution training-set copies are written to disk.
#
# NOTE 6 — Every case must classify BOTH samples correctly at probability 0.5,
# separate positive from negative by at least this probability gap, and achieve
# BCE at or below maximum_bce. These are training feasibility gates. They do not
# establish generalization or clinical accuracy. The pilot refuses a failed gate.
#
# NOTE 7 — The new detail encoder has maximum stride four, giving 2.4 mm feature
# spacing. Local features and an ordered spatial grid preserve focal information.
# This parameter controls network width; increased width requires a new full-size
# GPU check. The successful locator is retained independently from the classifier.
#
# NOTE 8 — CoA uses the inherited 20% achieved local-volume-loss threshold, plus
# a continuous loss-fraction target. Regression is trained with weighted Huber
# loss. This is the existing engineering definition rather than a severity grade.
#
# NOTE 9 — These settings apply to the later --stage fit development pilot:
# fresh weights, 32 training / 8 validation scenarios, minimum validation BCE
# checkpoint selection. The supplied Slurm script runs GPU smoke + diagnostic.
# The pilot becomes available only after the diagnostic passes; test phantoms
# remain excluded. Submit it with the same script and a second argument:
# sbatch scripts/research/slurm/fakect_coa_focused_gpu.sh archive/research/configs/models/coa-focused-classifier.ini fit
#
# NOTE 10 — Initialization and sample shuffling are explicitly seeded. Diagnostic
# weights are never silently reused as the initial pilot weights. Related anatomy
# families retain the original partitions for all siblings.
#
# NOTE 11 — The submitted job requests one GPU, four CPUs, 16 GiB host RAM and
# four hours. Application guards cap host/GPU usage at 12 GiB. A separate process
# tests actual input dimensions, gradients, trace counts and checkpoint reload
# before any cohort training begins.
