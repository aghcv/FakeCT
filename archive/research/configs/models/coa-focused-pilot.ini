# Run from the fakect.26.09.16 worktree. Numbered notes follow the parameters.
# python3 scripts/research/train_coa_pilot.py --config archive/research/configs/models/coa-focused-pilot.ini --validate-only
# python3 scripts/research/train_coa_pilot.py --config archive/research/configs/models/coa-focused-pilot.ini --stage plan
# sbatch scripts/research/slurm/fakect_coa_pilot_gpu.sh archive/research/configs/models/coa-focused-pilot.ini

[experiment]
schema_version = fakect.coa-focused-pilot/1 # NOTE 1
output_directory = outputs/experiments/coa/focused-pilot-r1 # NOTE 1

[reference]
experiment_directory = outputs/experiments/coa/focused-paired-r2 # NOTE 2

[training]
epochs = 50                                # NOTE 3
learning_rate = 0.001                       # NOTE 4
seed = 42                                  # NOTE 5
cache_limit_mb = 5120                       # NOTE 6
host_memory_limit_mb = 12288                # NOTE 7
gpu_memory_limit_mb = 12288                 # NOTE 7
require_gpu = true                         # NOTE 7

# NOTE 1 — This is a separate immutable development pilot. Planning copies the
# input and runtime sources, verifies the successful parent and pins its data,
# model and diagnostic artifacts. Frozen changes require a new output revision.
# report.html records validation metrics, paired learning and resource evidence.
#
# NOTE 2 — The passed 200-epoch diagnostic supplies the classifier architecture,
# normalization, frozen epoch-99 locator, image-derived crop origins, condition
# annotations and family partitions. The pilot uses the same 32 training and
# 8 validation scenarios, with 16/16 and 4/4 positive/negative counts. Related
# siblings stay in their anatomy-family partition; reserved test images remain
# outside this run. Predictor inputs are two 216x192x192 attenuation/validity
# blocks at 0.6 mm. Anatomy masks and edit parameters remain metadata/targets.
#
# NOTE 3 — Train for up to this many epochs, allowed from 1 to 200. Each epoch
# uses 16 balanced same-phantom training batches of two images. Both losses use
# identical model weights, followed by one combined gradient clip/update.
# Minimum VALIDATION BCE selects the checkpoint. This is development evaluation,
# not held-out test performance. The classification target remains at least 20%
# achieved local CoA target-volume loss, a provisional engineering definition.
#
# NOTE 4 — Retain the successful reference learning rate and inherited model
# width/regression weighting. The reference contract rejects changes to these
# inherited settings so this pilot evaluates the expansion across phantoms.
#
# NOTE 5 — Start fresh classifier weights and a fresh seeded shuffle generator.
# The initial weight fingerprint must match the passed diagnostic's initial
# weights. Its trained checkpoint/optimizer state is preserved for reference.
# Each scan can subsequently be predicted alone; pairing is the training policy.
#
# NOTE 6 — Cache all 40 normalized crop samples, approximately 4860 MiB, within
# this 5120 MiB limit. It must hold the complete panel and stay at or below half
# the host budget. The cache is transient RAM; whole-body attenuation remains
# shared with immutable native edit crops. No whole-body sibling copies or new
# high-resolution training-set files are exported. Before fit, a separate GPU
# smoke process keeps the full planned cache resident while exercising the model
# and optimizer, records actual host usage and validates checkpoint reload.
#
# NOTE 7 — Keep the successful reference's application limits: 12 GiB host and
# GPU memory. Slurm requests one GPU, four CPUs, 16 GiB host RAM and four hours.
# The default command runs new full-size GPU/cache smoke and then pilot fit in
# separate processes. Numeric resource checks stop failures before training.
