# Reference-shape model from supplied aorta masks. No learned Model 1 is used.
# python3 scripts/research/train_mask_model.py --config THIS_FILE --validate-only

[experiment]
schema_version = fakect.mask-model-experiment/1 # NOTE 1: independent mask model
scope = engineering                          # NOTE 2: synthetic engineering study
output_directory = outputs/experiments/coa/mask-model-r1 # NOTE 3: new run revision

[data]
manifest = outputs/datasets/coa/two-stage-radius115-r1/dataset-manifest.json # NOTE 4
target_scope = selected_lineage               # NOTE 4: current reviewed crop coverage

[split]
strategy = holdout                            # NOTE 5: keep families together
case_counts = 8,2,2                            # NOTE 5: train,validation,test cases
seed = 42                                     # NOTE 5: reproduce the first experiment

[model]
architecture = unet3d                         # NOTE 6: reuse tested reconstruction backend
patch_size_kji = 64,64,64                      # NOTE 6: dimensions on model grid
target_spacing_mm = 0.6,0.6,0.6                # NOTE 7: physical i,j,k spacing
base_filters = 4                              # NOTE 6: first-level feature count
depth = 2                                     # NOTE 6: downsampling levels
batch_size = 1                                # NOTE 8: bounded GPU memory
epochs = 5                                    # NOTE 8: initial budget
learning_rate = 0.001                          # NOTE 8: Adam rate
seed = 42                                     # NOTE 8: initialization and patch sampling
patches_per_volume = 4                        # NOTE 9: training patches per sample/epoch
max_train_batches_per_epoch = 0               # NOTE 9: no batch cap
change_weight = 5.0                           # NOTE 10: emphasize changed voxels
threshold = 0.5                               # NOTE 11: fixed occupancy probability cutoff
save_predictions = true                      # NOTE 12: held-out masks and probabilities

# NOTE 1 — Input is the final observed binary aorta mask. The model predicts
# the unedited reference mask. Added = observed AND NOT predicted reference;
# removed = predicted reference AND NOT observed. No segmentation model is
# fitted or loaded. Atlas-derived segmentation belongs upstream of this input.
#
# NOTE 2 — The supplied phantoms are reference-normal by study assumption.
# A learned reference and deviations from it are not a clinical diagnosis.
# Native labels and masks are available for these XCAT phantoms. Unlabeled
# patient CT would still require an independently validated segmentation step.
#
# NOTE 3 — --validate-only checks prepared data, family splits and model grids
# without creating an experiment. --stage plan freezes this INI, input manifest,
# partition, and copies/hashes the implementation. --stage fit trains only this
# model; --stage test evaluates it; --stage report writes an interactive HTML
# review. --stage all plans, fits, tests and writes the report. Existing
# completed matching outputs can be reused. Partial or changed runs require
# inspection and a new output_directory; they are never silently overwritten.
#
# NOTE 4 — This immutable manifest references before/after masks and net change
# masks in the already prepared cohort. The current target covers ROI-selected
# aorta lineage, including reviewed branch junctions; it is not a whole-thoracic
# segmentation. Whole-thoracic atlas masks require paired full-coverage data,
# a new adapter/manifest and retraining; do not relabel the current dataset.
# Image arrays remain part of the shared storage contract, but are not input
# features for this model. No attenuation clipping setting is needed here.
#
# NOTE 5 — Related anatomy IDs and all synthetic siblings stay in one split.
# This repeats the prior split: eight training, two validation, two test cases.
# Family assignments remain provisional engineering groups. Validation selects
# checkpoints; test data must not select architecture, settings or thresholds.
#
# NOTE 6 — Compact 3D U-Net with stride-2 Conv3D, skip connections and one
# sigmoid occupancy output. Patch sizes must be divisible by 2**depth. The
# initial 64-voxel patch spans 38.4 mm at 0.6 mm spacing. A larger anatomical
# context is a separate validation-selected experiment, not an automatic fix.
#
# NOTE 7 — Native arrays remain unchanged. Original and observed masks use
# exactly the same nearest-neighbor resampling. Change masks are recomputed
# on that grid. Results describe model-grid voxels and physical volumes.
#
# NOTE 8 — These values affect fitting, not cohort generation. This example
# deliberately preserves the initial reconstruction architecture and settings
# so removing the segmentation stage does not also change the experiment.
#
# NOTE 9 — Training patches include changes, foreground and uniform context.
# Validation/test use whole-volume tiled evaluation, including background and
# unchanged controls. Every training sample is visited when the cap is zero.
#
# NOTE 10 — Weighted BCE plus Dice supervises the original reference mask;
# changed voxels get extra weight. Copying the input unchanged is the identity
# baseline. Reference Dice alone can hide missed lesions and false positives.
#
# NOTE 11 — This is not a disease severity threshold. Binary added/removed
# masks are derived consistently from one reference occupancy prediction.
#
# NOTE 12 — The evaluation writes test-model2/evaluation.json and prediction
# NPZs. oracle_* keys mean exact supplied observed masks in the shared backend;
# there are no chained_* segmentation predictions in this independent run.
