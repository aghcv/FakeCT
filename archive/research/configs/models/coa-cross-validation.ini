# Model-only evaluation: editable study design. No generation is launched here.
# Preview: python3 scripts/model_experiment.py --config archive/research/configs/models/coa-cross-validation.ini --preview-splits
# Validate: replace --preview-splits with --validate-only after publishing pairs.

[experiment]
schema_version = fakect.model-experiment/1   # NOTE 1: prepared datasets only
registry = data/cohorts/coa/registry         # NOTE 1: immutable published pairs
datasets = coa-260602-radius115-r1, coa-260611-radius115-r1, coa-260612-radius115-r1, coa-260613-radius115-r1, coa-260614-radius115-r1, coa-260615-radius115-r1, coa-260616-radius115-r1, coa-260617-radius115-r1, coa-260618-radius115-r1, coa-260619-radius115-r1, coa-260620-radius115-r1, coa-260621-radius115-r1  # NOTE 1: named revisions
output_directory = outputs/experiments/coa/cross-validation-r1  # NOTE 2: new directory for each design

[evaluation]
strategy = leave_one_out                    # NOTE 3: holdout | leave_one_out | nested_leave_one_out
validation_families = 1                     # NOTE 4: only for leave_one_out
seeds = 42                                  # NOTE 5: repeat model fitting; e.g. 42,1729,2026
threshold = 0.5                             # NOTE 6: fixed segmentation probability threshold
planning_project = configs/case-studies/coa/project.json  # NOTE 7: provisional split preview
# case_counts = 8,2,2                       # NOTE 4: activate for holdout; remove validation_families

[split]
mode = anatomy_family                      # NOTE 8: keep every sibling and related case together
validation_fraction = 0.2                   # NOTE 8: legacy base-plan setting
test_fraction = 0.2                         # NOTE 8: evaluation strategy supplies actual fold assignments
seed = 42                                  # NOTE 8: deterministic family ordering

[preprocess]
target_spacing_mm = 1,1,1                   # NOTE 9: provisional common grid; review small vessels

[model]
architecture = unet2d                       # NOTE 10: currently binary aorta segmentation
patch_size = 64,64                          # NOTE 10: j,i pixels, multiples of four
slice_axis = k                             # NOTE 10: axial model
normalization = fixed_clip                 # NOTE 11: no statistics fitted to test data
clip_min = 0.0                              # NOTE 11: attenuation cm^-1, not HU
clip_max = 0.5                              # NOTE 11: review these bounds
epochs = 5                                 # NOTE 12: epoch budget for inner/validation-selected fits
batch_size = 4                             # NOTE 12: memory/training controls
learning_rate = 0.001                       # NOTE 12: fixed across folds in this experiment
seed = 42                                  # NOTE 5: evaluation.seeds overrides this for every repeat

# NOTE 1 — These radius115 dataset names are planned registry receipts. Their
# native scenarios are reviewed/frozen, but paired arrays are not published yet.
# --validate-only must pass before --stage plan can lock a runnable experiment.
# Future disease-condition targets need a new annotated cohort revision and
# new receipt names. This file currently exercises binary aorta segmentation.
#
# NOTE 2 — Stages: plan pins data/settings; fit trains all requested folds;
# test evaluates completed outer models and writes evaluation-report.html plus
# evaluation-summary.json; summarize rebuilds averages from pinned test results.
# A changed input needs a fresh output_directory and plan. Completed model runs
# can be reused only if their source lock, settings and file checksums match.
#
# NOTE 3 — holdout makes one whole-family split. leave_one_out rotates every
# family through testing, keeping validation_families separate for checkpoint
# selection. nested_leave_one_out additionally rotates every development family
# through inner validation, then trains a fresh model on all non-test families.
# It uses the median inner best epoch (rounded up) for this final fixed-epoch
# refit. Other model settings remain fixed by this INI; there is no automatic
# architecture/hyperparameter grid search. Six provisional groups imply six
# outer folds. Nested selection adds thirty inner fits per training seed.
#
# NOTE 4 — For holdout: set strategy=holdout, uncomment case_counts=8,2,2 and
# remove/comment validation_families. Counts refer to distinct case IDs, in
# training,validation,test order. Families are never split to force the counts;
# impossible requests fail with a clear error. For leave_one_out: omit
# case_counts and use validation_families=1. For nested_leave_one_out: omit both
# fields; each remaining family becomes an inner validation fold in turn.
#
# NOTE 5 — seeds changes neural-network initialization and training order, not
# which family is held out. Average repeats within each family. Then average
# case results within family, and give each family equal weight in the reported
# mean. A large sibling population does not count as more independent subjects.
#
# NOTE 6 — This is a probability cutoff for the current binary segmentation.
# It is NOT the intermediate/severe geometric class cutoff. Per-condition
# achieved severity, clinical class calibration and severity-response curves
# still need the condition-annotated cohort and model outputs from the plan.
#
# NOTE 7 — --preview-splits uses only this inventory and explicitly reports
# unverified provisional grouping. It does not read NPZ arrays, verify ancestry,
# lock datasets or run TensorFlow. Actual planning trusts verified registry
# provenance, never a case ID or this draft family assignment alone.
#
# NOTE 8 — [split] retains the existing model-only contract; its seed orders
# families. With [evaluation] present, case_counts or explicit cross-validation
# assignments determine the actual partitions. Existing configs without
# [evaluation] keep their previous fraction-based single-experiment behavior.
#
# NOTE 9 — Native crops span 0.4–1 mm spacing. Images are linearly resampled and
# masks use nearest-neighbor sampling at model time; archived pairs stay native.
# Check loss of small structures before adopting this 1 mm starter setting.
#
# NOTE 10 — Current metrics are full-volume Dice, IoU, precision and recall,
# with per-sample/per-case/per-family results. Three disease classifiers and
# condition-specific localization are a separate extension; no such outputs
# are implied by this segmentation model.
#
# NOTE 11 — Current images use an attenuation-copy proxy. This experiment tests
# synthetic anatomy generalization; independent clinical CT testing is later.
#
# NOTE 12 — The runner does not submit Slurm jobs. Run fitting/testing in the
# configured TensorFlow environment. Planning and split previews need no GPU.
# A nested run with one configuration takes 36 fits per seed for six families;
# choose repeats deliberately after checking the cost of a small pilot.
