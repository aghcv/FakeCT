# Classification-only control: the same reviewed five folds and 200 epochs.
# python3 scripts/research/train_coa_classification.py --config archive/research/configs/models/coa-classification-only200.ini --validate-only
# python3 scripts/research/train_coa_classification.py --config archive/research/configs/models/coa-classification-only200.ini --stage plan

[experiment]
schema_version = fakect.coa-classification-control/1 # NOTE 1: separate frozen experiment
output_directory = outputs/experiments/coa/classification-only200-r1 # NOTE 1: fresh revision

[reference]
experiment_directory = outputs/experiments/coa/rotating-evaluation-r2 # NOTE 2: fold-local locators and exact crops
comparison_directory = outputs/experiments/coa/rotating-budget200-r1 # NOTE 2: completed joint-loss baseline

[training]
classifier_epochs = 200                     # NOTE 3: evaluate the declared final epoch
checkpoint_interval = 50                    # NOTE 3: archive weights every 50 epochs
regression_weight = 0                       # NOTE 4: classification-only objective

# NOTE 1 — Planning freezes this input, implementation and reference metadata.
# Use a new output_directory before changing any frozen inputs. Arrays, cache
# and checkpoints stay outside Git. Existing sibling data are read in place.
#
# NOTE 2 — All five family-held-out folds retain the same 48 training and 12
# evaluation images, image-derived crop coordinates, seed 42, initial weights,
# model architecture, paired minibatches, Adam settings and learning rate 0.001.
# Locators are reused. Every classifier and optimizer starts fresh. No trained
# classifier or optimizer state is inherited. Related siblings never cross roles.
# The infant phantoms 260612 and 260617 remain reserved and unopened.
#
# NOTE 3 — Only epoch 200 is evaluated on held-out images. Milestone archives
# preserve weights, not resumable optimizer state. There is no outer early
# stopping or checkpoint selection. The same families have informed development,
# so this is development cross-validation rather than an untouched final test.
#
# NOTE 4 — Only the severity loss weight changes, from 1 to 0. The auxiliary
# head remains in the graph to preserve exact initialization and architecture.
# Its output is untrained and is excluded from severity performance evaluation.
# This control tests whether the auxiliary objective affects CoA classification.
