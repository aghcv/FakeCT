# Repaired native release: reuse 2,549 siblings and repair eleven connectivity failures.
# Broader morphology diversity; matched comparison with focused-change-r1.
[experiment]
schema_version = fakect.focused-change-population/1 # NOTE 1: independent immutable run
output_directory = outputs/experiments/aorta/diverse-change-r2 # NOTE 1

[reference]
experiment_directory = outputs/experiments/aorta/focused-change-r1 # NOTE 2

[population]
manifest = outputs/cohorts/aorta/diversity-r2/dataset-manifest.json # NOTE 3
siblings_per_case = 256                      # NOTE 3: selected new siblings per TRAIN anatomy

[training]
reporting_blocks = 64                       # NOTE 4: reporting intervals, not full population passes
updates_per_block = 224                     # NOTE 4: same total14,336optimizer updates as reference
patch_shape_kji = 96,96,96                  # NOTE 5: same57.6mm patch context
base_filters = 4                           # NOTE 5: same volumetric U-Net
learning_rate = 0.001                       # NOTE 5: fresh Adam
change_weight = 8                          # NOTE 5: same sparse-change loss
dice_weight = 1                            # NOTE 5
changed_fraction = 0.75                    # NOTE 5: supervised TRAIN sampling only
inference_overlap = 24                     # NOTE 5: same tiling
seed = 42                                  # NOTE 5

[validation]
minimum_dice = 0.60                         # NOTE 6: retain existing gate
minimum_precision = 0.50                    # NOTE 6
minimum_recall = 0.50                       # NOTE 6
maximum_control_change_fraction = 0.01      # NOTE 6

# NOTE 1 — Use a fresh output revision before changing pinned inputs/code/data.
# NOTE 2 — Five identical family exclusions. The old60edited held-out scans and
# ten original controls stay fixed so changing training diversity can be assessed.
# Reserved infant cases260612/260617 stay unopened; no Model2classifier starts.
# NOTE 3 — Prepare the sibling-population INI first. Each fold trains on256new
# variants for each ofeightcases:2,048edited siblings plus eightoriginal controls.
# New TRAINfocus crops come from that fold's frozen CT-only locator and are
# checked for coverage. QA never moves a crop. No whole-body siblings duplicated.
# NOTE 4 — Case-balanced queues visit all siblings before repeating. With256
# percase, every edited sibling receives sixpatch updates. Controls receive256
# each, retaining1/7 ofupdates. This isolates diversity without multiplying GPU
# work36-fold. A larger optimizer budget is a separate later experiment.
# NOTE 5 — Model, loss, resolution and normalization match the smaller-cohort run.
# Paired baseline differences are targets only; no exact differences enter inference.
# NOTE 6 — Gates remain engineering requirements; investigate precision/recall
# and unchanged-control false positives before downstream severity classification.
