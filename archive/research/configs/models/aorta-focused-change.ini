# CT -> baseline-relative enlargement/narrowing maps; validate before classification.
# python3 scripts/research/train_focused_change.py --config archive/research/configs/models/aorta-focused-change.ini --validate-only

[experiment]
schema_version = fakect.focused-change/1     # NOTE 1: independent frozen experiment
output_directory = outputs/experiments/aorta/focused-change-r1 # NOTE 1: fresh revision

[reference]
experiment_directory = outputs/experiments/coa/rotating-evaluation-r2 # NOTE 2: reuse image-predicted focus crops

[evaluation]
families = xcat_reference_10yr, xcat_reference_15yr, xcat_reference_1yr, xcat_reference_5yr, xcat_reference_adult # NOTE 3

[training]
epochs = 64                                # NOTE 4: fixed final epoch; first localization trial
patch_shape_kji = 96,96,96                  # NOTE 5: 57.6-mm patches on the inherited 0.6-mm grid
patches_per_sample = 4                      # NOTE 6: each edited/control sample visited each epoch
base_filters = 4                           # NOTE 5: compact volumetric U-Net
learning_rate = 0.001                       # NOTE 4: fresh Adam optimizer
change_weight = 8                          # NOTE 6: extra weight on changed target voxels
dice_weight = 1                            # NOTE 6: foreground overlap objective
changed_fraction = 0.75                    # NOTE 6: supervised change-centered TRAIN sampling only
inference_overlap = 24                     # NOTE 7: average overlapping full-focus tiles
seed = 42                                  # NOTE 4: reproducible training order

[validation]
minimum_dice = 0.60                         # NOTE 8: mean case Dice for EACH nonempty change class
minimum_precision = 0.50                    # NOTE 8: precision for EACH change class
minimum_recall = 0.50                       # NOTE 8: recall for EACH change class
maximum_control_change_fraction = 0.01      # NOTE 8: max predicted change / original aorta volume on controls

# NOTE 1 — Plan pins this INI, code, parent metadata and data references. Change
# output_directory before altering frozen settings. No full-body siblings copied.
# NOTE 2 — Only attenuation and acquisition validity enter the network. Baseline
# masks provide supervised targets; baseline images and true difference masks
# never enter predictions. Controls use unchanged data with the fixed paired
# crop of the lexicographically first sibling, not newly predicted baseline crops.
# NOTE 3 — Related anatomy stays in one role per fold. The two infant cases
# 260612/260617 remain closed. These are development folds, not independent
# clinical patients. The prior locator is reused and the change model starts fresh.
# NOTE 4 — Every fold fits exactly 64 epochs; held-out images are scored only
# after fitting. No outer early stopping, threshold tuning or checkpoint selection.
# NOTE 5 — U-Net predicts unchanged=0, added/enlargement=1, removed/narrowing=2.
# Targets combine all final net edits; no CoA/arch distinction is required.
# NOTE 6 — Training samples include one unchanged control per anatomy. Changed
# sampling is allowed for TRAIN patches; it never chooses inference locations.
# NOTE 7 — Evaluate all image-predicted focus voxels. Predictions are averaged
# across tiles and overlapping proposals, then scored once on their common grid.
# NOTE 8 — Engineering gates only, declared before fitting. They do not certify
# clinical trust or activate a classifier. Inspect change precision/recall and
# false abnormality on controls alongside interactive truth/prediction overlays.
