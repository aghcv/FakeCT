# Draft engineering benchmark labels; no image generation or model training.
# Run from the worktree: python3 scripts/research/evaluation/classify_coa_cohort.py --config archive/research/configs/studies/coa-label-review.ini --validate-only
# Export to a fresh versioned folder by omitting --validate-only.

[review]
dataset_manifest = outputs/datasets/coa/context-aorta-r1/dataset-manifest.json # NOTE 1: frozen source
output_directory = outputs/labels/coa/provisional-volume-r1                   # NOTE 2: new labels only
status = draft                                                               # NOTE 3: review before training

[classification]
step_name = coa_narrow                       # NOTE 4: one final CoA erosion
positive_loss_fraction = 0.20                # NOTE 5: inclusive engineering threshold
review_half_width = 0.02                     # NOTE 6: flag 18–22% for review
sensitivity_thresholds = 0.10,0.20,0.30       # NOTE 7: compare counts; do not optimize on test results
original_baselines_non_coa = true            # NOTE 8: explicit study assumption

# NOTE 1. Paths are relative to this repository worktree, not this INI directory.
# The script verifies the source manifest's SHA-256 sidecar, its immediate source
# manifest, and every prepared parent manifest. Copied per-step outcomes and
# parameters must match the parent. It does not change or duplicate image data.
# NOTE 2. Outputs are labels.json, labels.csv, report.html and an INI snapshot,
# with SHA-256 sidecars. Existing output directories cannot be overwritten.
# For a changed definition, choose a new directory such as provisional-volume-r2.
# NOTE 3. Labels remain draft, and ready_for_training remains false. Review the
# threshold, borderline examples and limitations before defining an experiment.
# There is deliberately no automatic promotion to a clinical/approved label.
# NOTE 4. The present audit supports one coa_narrow pass, iteration 1, as the last
# step. It checks accepted erosion/connectivity safeguards and voxel/volume
# consistency. Missing, rejected or unsupported metadata becomes unknown, not
# negative. A later edit or multiple CoA passes requires extending this audit.
# NOTE 5. Score = CoA removed target voxels / pre-CoA target voxels. The denominator
# is the selected target in the POSITIVE LONGITUDINAL PROFILE SUPPORT, immediately
# before this edit, after earlier edits. It includes the full selected cross-section
# before angular weighting or tissue resistance; the rest of a long ROI is excluded.
# A score >=0.20 is coa_benchmark_positive. This local volume-loss proxy is NOT
# maximum/minimum cross-sectional area or diameter reduction, hemodynamic severity,
# or a clinical CoA diagnostic threshold. It is provisional for method development.
# NOTE 6. The review band includes both endpoints. It flags cases for inspection
# without deleting them or changing the class. Below-threshold edited siblings are
# not healthy controls: coa_edit_applied stays true, and companion edits remain.
# NOTE 7. All sensitivity thresholds use the same recorded metadata. Report these
# counts before training. Keep family grouping and all siblings together in splits;
# never pick the threshold to improve held-out test performance.
# NOTE 8. All original phantoms are assumed non-CoA for this study, as specified by
# the user. Their induced-change score is zero; a local CoA denominator is absent.
# This is a study assumption, not an independent clinical examination. Every current
# edited sibling also has enlargement and arch narrowing; isolated CoA and CoA-off
# companion-anomaly controls remain needed to disentangle those conditions.
