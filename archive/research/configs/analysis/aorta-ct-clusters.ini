# Exploratory CT-only baseline-relative clustering; no model training.
[analysis]
schema_version = fakect.ct-delta-study/1     # NOTE 1: versioned derived analysis
manifest = outputs/cohorts/aorta/diversity-r2/dataset-manifest.json # NOTE 1
output_directory = outputs/analysis/aorta/ct-delta-clusters-r1 # NOTE 1

[representation]
arc_bins = 32                              # NOTE 2: normalized original centreline length
radial_bins = 4                            # NOTE 2: distance divided by baseline aortic radius
angular_bins = 8                           # NOTE 2: transported local angular frame
radial_extent = 4.0                        # NOTE 3: fixed baseline-centred focus includes growth
delta_tolerance_cm_inverse = 0.000001       # NOTE 3: suppress numerical roundoff

[clustering]
seed = 42                                  # NOTE 4: deterministic initializations
variance_target = 0.90                      # NOTE 4: cluster retained PCs, not just plot axes
max_components = 20                        # NOTE 4: bounded initial representation
k_min = 2                                  # NOTE 5: explore candidate partitions
k_max = 10                                 # NOTE 5
n_init = 4                                 # NOTE 5: independent k-means starts
kmeans_iterations = 100                    # NOTE 5
silhouette_sample_size = 1000               # NOTE 5: fixed queries compared with all siblings
silhouette_threshold = 0.25                 # NOTE 5: exploratory separation criterion
stability_threshold = 0.75                 # NOTE 5: restart agreement criterion
min_cluster_fraction = 0.01                # NOTE 5: avoid isolated extremes masquerading as groups

# NOTE 1 — Sources are read-only. Freeze with --stage plan, extract case features,
# then --stage analyse. Existing outputs cannot be replaced; choose a new revision.
# Reserved infant phantoms are not present in this completed development cohort.
# NOTE 2 — Positive/negative CT attenuation deltas are integrated on physical bins
# and scaled by each baseline's arterial attenuation, path length and radius.
# Tissue masks are used only for baseline localization/intensity reference;
# sibling labels, added/removed masks, edit settings and disease labels are NOT
# PCA or clustering features. Native counts may be posthoc annotations only.
# NOTE 3 — The fixed tube, thoracic landmark slab and identified crop delimit
# the analysis. It includes released and borrowed regions. Coverage metrics
# explicitly report delta energy outside this domain. CT-identical changes
# cannot be distinguished by a CT-only representation. Controls must map to zero.
# NOTE 4 — Mean-center features without normalizing every sibling to unit length:
# preserve extent. Plot PC1/PC2 but fit clusters in retained higher-dimensional
# space. The component cap can miss the target variance; report achieved variance.
# NOTE 5 — K-means always creates partitions, even along a continuum. Select the
# best silhouette candidate and report stability, cluster sizes and evidence
# separately. Suggested K can remain1 when evidence for discrete groups is weak.
# All2,560siblings are retained, including CT-near-baseline siblings. Ten original
# controls are plotted for reference but excluded from unsupervised fitting.
# This all-cohort analysis is descriptive. Any later TRAIN sampling/PCA/clustering
# used for model evaluation must be refit inside that model's training partition.
