# Native HU/orientation audit and fixed pretrained benchmark before fine-tuning.
[benchmark]
schema_version = fakect.pretrained-aorta-benchmark/1 # NOTE 1
source_manifest = outputs/cohorts/aorta/diversity-r2/dataset-manifest.json # NOTE 1
output_directory = outputs/experiments/aorta/pretrained-totalseg-r1 # NOTE 2
cases = 260602,260613,260616,260621          # NOTE 3: development panel
panel = baseline, lower_narrowing, higher_narrowing, enlargement # NOTE 3
target_review_status = engineering_proxy    # NOTE 4: atlas core boundaries remain provisional

[input]
context_mm = 50                            # NOTE 5: full X/Y; thorax plus z context
slab_slices = 8                            # NOTE 5: bounded native streaming

[model]
package_version = 2.18.0                   # NOTE 6: isolated PyTorch environment
environment_directory = outputs/environments/totalseg-r1 # NOTE 6
cache_directory = outputs/pretrained/totalseg-2.18.0 # NOTE 6
weight_tasks = 291,292,293,294,295,298       # NOTE 6: standard task checkpoints plus rough crop
task = total                              # NOTE 7: pretrained aorta class
roi_subset = aorta                         # NOTE 7: model-defined automatic crop
fast = false                              # NOTE 7: keep standard 1.5 mm inference

[evaluation]
surface_tolerance_mm = 1.0                 # NOTE 8: native physical surface tolerance
boundary_margin_mm = 2.0                   # NOTE 8: ignore artificial thoracic caps in surfaces
local_context_mm = 5.0                     # NOTE 8: known change support plus physical context

# NOTE 1 — Sources are immutable. This is a region-assisted synthetic benchmark,
# not a fully automatic thorax detector or a clinical validation. No model is
# trained here. The atlas selects a fixed thoracic slab; only HU images enter
# the pretrained model. Atlas masks and changes are evaluation references only.
# NOTE 2 — Plan creates a new frozen revision. Existing exports, predictions,
# receipts and reviews cannot be replaced. Change the directory for a new run.
# NOTE 3 — Each case includes its original plus three achieved-change examples.
# lower_narrowing is the 25th percentile of strictly positive removed-only counts;
# higher_narrowing is the maximum removed-only case; enlargement is the maximum
# added-only case. These are engineering burden descriptions, not disease grades.
# Samples are chosen deterministically within each case, before inference.
# NOTE 4 — Reference masks use the existing atlas aorta CORE, excluding proximal
# branches. Original disconnected islands remain excluded; added core voxels
# require original core ancestry. This does not promote provisional anatomical
# boundaries or phantom family assignments to clinically verified ground truth.
# NOTE 5 — XCAT per-pixel attenuation is converted to cm^-1 with pixel width,
# then to HU using that case's recorded water coefficient at its photon energy.
# Verified native L/P/S axes, true spacing, voxel-centre offset and crop origin
# are encoded in NIfTI RAS coordinates. Native images/masks are not resampled.
# NOTE 6 — PyTorch and weights are separate from the existing TensorFlow env.
# Pinned package/version, dependency freeze and checkpoint hashes bind the run.
# Cache the standard task's checkpoint set because the official API downloads
# every task part; aorta-only inference uses the cardiac part plus rough crop.
# NOTE 7 — TotalSegmentator resamples internally; returned predictions must be
# on the original export grid. Known truth never recentres a predicted mask.
# The model's 1.5 mm resolution may erase narrow lumens; inspect local errors.
# NOTE 8 — Score every prediction inside the shared thoracic slab, not merely
# inside the edit ROI or truth bbox. Report global and change-local overlap,
# surface errors and connected components. Controls have no change-local score.
