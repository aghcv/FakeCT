# ROI-free anatomical extraction from a labeled XCAT phantom.
# python3 scripts/research/select_phantom_anatomy.py --config archive/research/configs/anatomy/thoracic-aorta-260602.ini --validate-only
# Remove --validate-only to write the mask; use a new output revision for changes.

[anatomy]
schema_version = fakect.phantom-anatomy/1     # NOTE 1
name = thoracic-aorta-260602                 # NOTE 1
output_directory = outputs/anatomy/thoracic-auto/260602-r1  # NOTE 2

[input]
root = /home/aghorban/slurm/xcat             # NOTE 3
case_id = 260602                            # NOTE 3
frame = 1                                  # NOTE 3
audit = archive/research/docs/integration/2026-09-16/xcat-results.json  # NOTE 3
catalog = outputs/tissues/atlas-v1/label-catalog.json # NOTE 3
surface_inventory = outputs/anatomy/coa/radius115/260602-r1/selection.json # NOTE 4

[selection]
boundary_policy = t12_midpoint_to_t1_upper   # NOTE 5
include_branches = true                    # NOTE 6
branch_reach_mm =                           # NOTE 7: blank uses relative reach
branch_reach_radii = 3.0                    # NOTE 7
connectivity = 6                           # NOTE 8
padding_mm = 2.0                            # NOTE 9

# NOTE 1 — This deterministic XCAT label selector replaces the segmentation
# model only when anatomical ACT labels and registered RAW surfaces exist.
# It does not infer anatomy from attenuation-only clinical CT.
# NOTE 2 — New outputs contain native mask/core/branches, geometry, checksum and
# provenance. Existing output directories are never overwritten. Every new
# extraction is provisional until its anatomical extent has been reviewed.
# NOTE 3 — Original ACT IDs are discovered through the atlas. No source IDs,
# target ROI coordinates, old selector mask or attenuation thresholds are inputs.
# NOTE 4 — Optional acceleration cache. Blank inventories current RAW files.
# Only the full RAW inventory is reused; old ROI and old selected IDs are ignored.
# Cached inventory checksums and source file metadata must still match.
# NOTE 5 — The aorta label contains thoracic AND abdominal segments. This first
# explicit policy uses the midpoint of all T12 vertebral surface z bounds as the
# inferior cut and maximum T1 surface z as the superior cut. This is a reviewable
# approximation, not an exact diaphragm/hiatus classifier. Diaphragm surfaces
# are available for a future more detailed cutoff. No supplied ROI is needed.
# NOTE 6 — Keep the largest native aorta component, then adjacent eligible
# systemic/coronary/cerebrovascular arterial voxels. Pulmonary labels are excluded
# before connectivity. Generic branch labels remain generically named.
# NOTE 7 — Branch extent is Euclidean distance to the aorta core. Blank mm uses
# three times the median verified aortic ring radius, scaling across body sizes.
# This selects proximal branches; it does not promise complete named branches.
# NOTE 8 — 6 requires face contact. 26 also permits edge/corner contact. Unconnected
# pieces sharing the same original ID are excluded at voxel component level.
# Native contact is geometry evidence, not proof of physiological connectivity.
# NOTE 9 — Padding affects the automatic native crop, not anatomical inclusion.
