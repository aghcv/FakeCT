# DPI native XCAT source-adapter anatomy classification defaults.
#
# The parser intentionally supports a small YAML subset so the converter does
# not need a new runtime dependency. Custom files can add aliases or rules using
# the same fields shown here.

aliases:
  lkidney:
    canonical_name: kidney
    normalized_name: kidney
    laterality: left
  rkidney:
    canonical_name: kidney
    normalized_name: kidney
    laterality: right
  lv:
    canonical_name: left_ventricle
    normalized_name: left_ventricle
    laterality: left
  rv:
    canonical_name: right_ventricle
    normalized_name: right_ventricle
    laterality: right
  la:
    canonical_name: left_atrium
    normalized_name: left_atrium
    laterality: left
  ra:
    canonical_name: right_atrium
    normalized_name: right_atrium
    laterality: right
  lad:
    canonical_name: left_anterior_descending_coronary_artery
    normalized_name: left_anterior_descending_coronary_artery
    laterality: left
    structure_type: artery
  dia:
    canonical_name: diaphragm
    normalized_name: diaphragm
  pulmonary_arts:
    canonical_name: pulmonary_artery
    normalized_name: pulmonary_artery
  llung:
    canonical_name: lung
    normalized_name: lung
    laterality: left
  rlung:
    canonical_name: lung
    normalized_name: lung
    laterality: right
  lfoot_musc:
    canonical_name: foot_muscle
    normalized_name: foot_muscle
    laterality: left
    structure_type: muscle
  rfoot_musc:
    canonical_name: foot_muscle
    normalized_name: foot_muscle
    laterality: right
    structure_type: muscle
  dias_lv:
    canonical_name: left_ventricle
    normalized_name: left_ventricle
    laterality: left
    structure_type: heart
    temporal_phase: diastole
  sys_lv:
    canonical_name: left_ventricle
    normalized_name: left_ventricle
    laterality: left
    structure_type: heart
    temporal_phase: systole
  anterior_comunicating:
    canonical_name: anterior_communicating_artery
    normalized_name: anterior_communicating
    structure_type: artery
  cuniform:
    canonical_name: cuneiform
    normalized_name: cuneiform
    structure_type: bone
  cart:
    canonical_name: nasal_cartilage
