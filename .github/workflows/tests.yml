name: FakeCT regression and quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  CUDA_VISIBLE_DEVICES: '-1'
  TF_CPP_MIN_LOG_LEVEL: '3'
  TF_NUM_INTRAOP_THREADS: '1'
  TF_NUM_INTEROP_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  core:
    name: Complete CPU contracts (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements/core.txt
            requirements/dev.txt
      - name: Install core test environment
        run: python -m pip install -r requirements/dev.txt
      - name: Verify backend-free core environment
        run: |
          python - <<'PY'
          import importlib.util
          for module in ('tensorflow', 'torch', 'totalsegmentator'):
              assert importlib.util.find_spec(module) is None, module
          PY
      - name: Check declared dependencies
        run: python -m pip check
      - name: Verify source syntax and documented contracts
        run: python scripts/dev/check_quality.py
      - name: Run every CPU contract and synthetic workflow
        run: python -m pytest --junitxml=test-results/core.xml
      - name: Save test evidence and resolved dependency versions
        if: always()
        run: |
          mkdir -p test-results
          python -m pip freeze > test-results/core-environment.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-python-${{ matrix.python }}
          path: test-results/

  tensorflow:
    name: TensorFlow CPU training and reload contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FAKECT_TEST_TENSORFLOW: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements/core.txt
            requirements/dev.txt
            requirements/tensorflow.txt
      - name: Install optional TensorFlow environment
        run: python -m pip install -r requirements/dev.txt -r requirements/tensorflow.txt
      - name: Check declared dependencies
        run: python -m pip check
      - name: Require real CPU TensorFlow
        run: |
          python - <<'PY'
          import tensorflow as tf
          assert tf.__version__ == '2.17.1', tf.__version__
          assert not tf.config.list_physical_devices('GPU')
          print('TensorFlow CPU:', tf.__version__)
          PY
      - name: Exercise complete suite with real TensorFlow enabled
        run: >-
          python -m pytest
          --junitxml=test-results/tensorflow.xml
      - name: Save test evidence and resolved dependency versions
        if: always()
        run: |
          mkdir -p test-results
          python -m pip freeze > test-results/tensorflow-environment.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tensorflow-cpu
          path: test-results/

  browser:
    name: Offline ROI report browser contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FAKECT_TEST_BROWSER: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements/core.txt
            requirements/dev.txt
            requirements/browser.txt
      - name: Install optional browser environment
        run: python -m pip install -r requirements/dev.txt -r requirements/browser.txt
      - name: Install Chromium and system libraries
        run: python -m playwright install --with-deps chromium
      - name: Check declared dependencies
        run: python -m pip check
      - name: Exercise offline control-point navigation and panel updates
        run: python -m pytest tests/browser --junitxml=test-results/browser.xml
      - name: Save browser evidence and resolved dependency versions
        if: always()
        run: |
          mkdir -p test-results
          python -m pip freeze > test-results/browser-environment.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: offline-roi-browser
          path: test-results/
