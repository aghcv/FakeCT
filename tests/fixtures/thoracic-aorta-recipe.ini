# Fixed parser regression fixture; user study files remain independently editable.
# Named aorta edits: run scripts/preview_roi.py --config this-file.ini.
# The main ROI copies the user's third reviewed placement. Named subdivisions
# below are new starting points to inspect in the generated HTML.

[study]
schema_version = fakect.recipe/1             # NOTE 1: ordered editing recipe
name = xcat-thoracic-aorta-recipe             # NOTE 1: report name

[input]
root = /home/aghorban/slurm/xcat              # NOTE 2: original source root
case_id = 260602                             # NOTE 3: pilot anatomy
frame = 1                                   # NOTE 3: matching source frame
audit = docs/integration/2026-09-16/xcat-results.json # NOTE 4: source geometry
catalog = outputs/tissues/atlas-v1/label-catalog.json # NOTE 4: pinned tissue mapping

[selection]
tissue = artery                             # NOTE 5: coarse tissue category
source_ids = 2922                            # NOTE 5: OPTIONAL filter; blank or omit for tissue + ROI

[roi]
shape = tube                                # NOTE 6: reviewed outer boundary
center_ijk = 387,360,1352 ; 378,365,1363 ; 373,362,1374 ; 373,363,1389 ; 376,366,1409 ; 385,375,1415 ; 392,386,1417 ; 393,398,1409 ; 390,408,1394 ; 387,414,1383 ; 387,419,1370 ; 387,419,1356 ; 389,419,1341 ; 391,416,1316 # NOTE 6: native i,j,k path order
radius_mm = 10,10,10,12,11,10,10,13,12,11,11,11,11,11 # NOTE 7: outer tube radii
crop_half_width_mm = 22                      # NOTE 8: shared display/edit crop
coordinate_reviewed = true                  # NOTE 9: user's reviewed main placement

[preview]
slice_ijk = 385,388,1390                      # NOTE 10: inspection planes only
overlay_opacity = 0.22                       # NOTE 11: ROI transparency
volume_opacity = 0.25                        # NOTE 11: target transparency
context_tissues = artery, bone, vein         # NOTE 12: neighboring anatomy
context_opacity = 0.08                       # NOTE 11: context transparency
volume_stride = 2                           # NOTE 12: display pooling only

[recipe]
steps = ascending_expand, descending_narrow, arch_refine # NOTE 13: explicit execution order
overlap = sequential                        # NOTE 14: later steps see earlier results

[roi.ascending]
shape = tube                                # NOTE 15: first provisional subdivision
center_ijk = 387,360,1352 ; 378,365,1363 ; 373,362,1374 ; 373,363,1389 # NOTE 15: ordered ascending path
radius_mm = 10,10,10,12                       # NOTE 7: one radius per node
coordinate_reviewed = false                 # NOTE 9: inspect this new subdivision

[roi.descending]
shape = tube                                # NOTE 15: second provisional subdivision
center_ijk = 390,408,1394 ; 387,414,1383 ; 387,419,1370 ; 387,419,1356 ; 389,419,1341 ; 391,416,1316 # NOTE 15: ordered descending path
radius_mm = 12,11,11,11,11,11                 # NOTE 7: one radius per node
coordinate_reviewed = false                 # NOTE 9: inspect this new subdivision

[roi.arch]
shape = tube                                # NOTE 15: third provisional subdivision
center_ijk = 373,363,1389 ; 376,366,1409 ; 385,375,1415 ; 392,386,1417 ; 393,398,1409 ; 390,408,1394 # NOTE 15: path around arch apex
radius_mm = 12,11,10,10,13,12                 # NOTE 7: one radius per node
coordinate_reviewed = false                 # NOTE 9: inspect this new subdivision

[edit.ascending_expand]
roi = ascending                             # NOTE 16: references roi.ascending
operation = dilation                        # NOTE 17: borrow permitted surrounding voxels
distance_mm = 2.0                            # NOTE 18: maximum distance per pass, mm
iterations = 1                              # NOTE 19: finite passes for this step
profile = gaussian                          # NOTE 20: smooth longitudinal taper
profile_axis = tube                         # NOTE 20: this named ROI's path
shape_k = 6                                 # NOTE 20: Gaussian concentration
shape_window = 0,1                          # NOTE 20: normalized named path interval

[edit.descending_narrow]
roi = descending                            # NOTE 16: references roi.descending
operation = erosion                         # NOTE 17: release voxels to permitted tissue
distance_mm = 2.0                            # NOTE 18: maximum distance per pass, mm
iterations = 1                              # NOTE 19: finite passes for this step
profile = gaussian                          # NOTE 20: smooth longitudinal taper
profile_axis = tube                         # NOTE 20: this named ROI's path
shape_k = 6                                 # NOTE 20: Gaussian concentration
shape_window = 0,1                          # NOTE 20: normalized named path interval

[edit.arch_refine]
roi = arch                                  # NOTE 16: references roi.arch
operation = none                            # NOTE 17: visible placeholder; no third change
distance_mm = 1.0                            # NOTE 18: used if operation becomes active
iterations = 1                              # NOTE 19: counted in bounded recipe budget
profile = gaussian                          # NOTE 20: smooth longitudinal taper
profile_axis = tube                         # NOTE 20: this named ROI's path
shape_k = 6                                 # NOTE 20: Gaussian concentration
shape_window = 0,1                          # NOTE 20: normalized named path interval

[reassignment]
mode = stiffness                            # NOTE 21: use the editable factors below
allowed_tissues =                           # NOTE 21: must be blank in this mode
max_distance_mm = 3                         # NOTE 21: erosion recipient search
unresolved = preserve                       # NOTE 21: retain unresolved original voxels

[stiffness]
default = 0.05                              # NOTE 23: fallback factor for catalogued anatomy
bone = 1.0                                  # NOTE 23: rigid at 1; editable
skin = 0.95                                 # NOTE 23: very resistant; editable
soft_tissue = 0.05                           # NOTE 23: category resistance
muscle = 0.10                                # NOTE 23: category resistance
artery = 0.05                                # NOTE 23: includes selected target aorta
vein = 0.05                                  # NOTE 23: category resistance
lung = 0.02                                  # NOTE 23: category resistance
cartilage = 0.20                             # NOTE 23: category resistance
adipose = 0.02                               # NOTE 23: category resistance
nervous_tissue = 0.10                        # NOTE 23: category resistance
fluid = 0.02                                 # NOTE 23: category resistance
unknown = 0.05                               # NOTE 23: catalogued anatomy with unresolved grouping

[stiffness.labels]
2897 = 0.05                                 # NOTE 23: pericardium original-ID override example

[output]
directory = outputs/studies/thoracic-aorta/recipe-v3 # NOTE 22: global/local report; new folder per trial
